    $('umProfileForm').classList.toggle('hidden');
  };
  $('umSaveBtn').onclick=function(){
    const nick=($('umNickInput').value||'').trim();
    const sig=($('umSigInput').value||'').trim();
    const patch={};
    if(nick) patch.nickname=nick;
    patch.signature=sig;
    updateMeUser(patch);
    toast('个人信息已保存','ok');
    renderHeaderUser(); renderMe();
    if(activeTab==='plaza') renderPlaza();
    closeUserMenu();
  };
  // 更换账号 / 退出登录
  $('umSwitchBtn').onclick=function(){ closeUserMenu(); doLogout(); toast('请登录其他账号'); };
  $('umLogoutBtn').onclick=function(){ closeUserMenu(); doLogout(); };

  // 广场
  $('newTopicBtn').onclick=function(){ modalOpen=true; resetTopicMedia(); show('newTopicModal'); $('topicTitle').focus(); };
  $('topicSubmitBtn').onclick=submitTopic;
  $('subAccountSaveBtn').onclick=saveSubAccount;
  $('commentSendBtn').onclick=submitComment;
  $('commentInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submitComment(); });
  $('plazaBackBtn').onclick=function(){
    activeTopicId=null;
    show('plazaListView'); hide('plazaDetailView');
    renderPlaza();
  };
  // 发帖媒体
  $('topicImgs').addEventListener('change', function(e){
    topicMedia.imgs=Array.from(e.target.files||[]).filter(function(f){return checkMediaSize(f,'图片');});
    previewTopicImgs(topicMedia.imgs);
  });
  $('topicAudio').addEventListener('change', function(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    if(!checkMediaSize(f,'音频')){ e.target.value=''; return; }
    topicMedia.audio=f;
    const ai=$('topicAudioInfo'); if(ai) ai.textContent='🎵 '+f.name+'（'+Math.round(f.size/1024)+'KB）';
  });
  const vr=$('voiceRecordBtn');
  if(vr){
    function vrStart(ev){ if(ev) ev.preventDefault(); startVoiceRecord(function(file,size){
      topicMedia.voice=file;
      const vs=$('voiceStatus'); if(vs) vs.textContent='🎤 已录制 '+Math.round(size/1024)+'KB';
      vr.textContent='🎤 按住录音';
    }); vr.textContent='⏹ 松开结束'; const vs=$('voiceStatus'); if(vs) vs.textContent='录音中…'; }
    function vrEnd(){ stopVoiceRecord(); }
    vr.addEventListener('mousedown', vrStart);
    vr.addEventListener('mouseup', vrEnd);
    vr.addEventListener('mouseleave', vrEnd);
    vr.addEventListener('touchstart', vrStart, {passive:false});
    vr.addEventListener('touchend', vrEnd);
    vr.addEventListener('touchcancel', vrEnd);
  }
  // 评论媒体
  $('commentImg').addEventListener('change', function(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    if(!checkMediaSize(f,'图片')){ e.target.value=''; return; }
    commentMedia.img=f;
    const mi=$('commentMediaInfo'); if(mi) mi.textContent='📷 '+f.name;
  });
  const cvb=$('commentVoiceBtn');
  if(cvb){
    cvb.addEventListener('click', function(){
      if(commentMedia.voice){ commentMedia.voice=null; cvb.textContent='🎤 语音留言'; const mi=$('commentMediaInfo'); if(mi) mi.textContent=''; return; }
      startVoiceRecord(function(file,size){
        commentMedia.voice=file;
        cvb.textContent='🎤 已录 '+Math.round(size/1024)+'KB（再点取消）';
      });
    });
  }

  // 档期表单
  $('fTotal').addEventListener('input', updateBalance);
  $('fDeposit').addEventListener('input', updateBalance);
  $('fShootDate').addEventListener('change', function(){ populateMainSelect(); populateSecondSelect(); });
  $('fPhotographer').addEventListener('change', function(){ populateSecondSelect(); });
  $('fSecond').addEventListener('change', function(){ populateMainSelect(); });
  $('fHotel').addEventListener('change', function(){ $('fHall').value=''; $('fPlanner').value=''; populateHotelChain(); });
  $('fHall').addEventListener('change', function(){ populateHotelChain(); });
  $('fabAddBtn').onclick=function(){ if(isMasterLike()) openScheduleModal(null); else toast('子账号仅可查看档期','error'); };
  $('upcomingBtn').onclick=openUpcomingModal;
  $('scheduleSaveBtn').onclick=saveSchedule;

  // 弹窗关闭
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.onclick=function(){ closeModal(b.dataset.close); };
  });
  document.querySelectorAll('.modal-mask').forEach(function(mask){
    mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(mask.id); });
  });

  // 跨标签页同步
  window.addEventListener('storage', function(e){
    if(e.key && e.key.indexOf('ps_')===0 && e.key!=='ps_session'){
      if(!modalOpen){ renderAll(); if(activeTab==='schedule') refreshPhotographerFilter(); }
    }
  });
  // 切回前台拉取
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && cloudOK && navigator.onLine){
      (async function(){ await pullAllToLocal(false); if(!modalOpen) renderAll(); })();
    }
  });
  // 恢复在线
  window.addEventListener('online', function(){
    if(cloudOK){
      (async function(){
        await pullAllToLocal(true);
        await pushAllCollections();
        renderAll();
        setSyncState('on');
        toast('网络已恢复，数据已同步','ok');
      })();
    }
  });
  window.addEventListener('offline', function(){ setSyncState('off'); toast('当前离线，修改将在联网后自动同步','error'); });
  // 系统主题变化（跟随系统）
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ loadTheme(); });
  }
}

async function boot(){
  bindEvents();
  setSyncState('busy');
  const hasCloud=await initCloud();
  if(!hasCloud) setSyncState('off');
  ensureSettingsShape();
  // 已登录会话恢复（兼容旧版 ps_session 的 {username} 格式）
  const session=DB.getSession();
  let resumeUser=null;
  if(session && session.currentUser){
    resumeUser=DB.getUsers().find(function(x){ return x.id===session.currentUser.id; });
  }else if(session && session.username){
    resumeUser=DB.getUsers().find(function(x){ return x.username===session.username; });
  }
  if(resumeUser){
    currentUser=resumeUser;
    const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
    selectedDate=null;
    hide('authPage'); show('mainApp');
    switchTab('schedule');
    renderAll();
    refreshPhotographerFilter();
    if(hasCloud){ startHeartbeat(); startReminderLoop(); }
    checkPendingScan();   // 手机端扫码打开：已登录则弹确认
    return;
  }
  show('authPage');
  startQrLogin();         // 登录页展示扫码登录二维码
  if(hasCloud){ startHeartbeat(); startReminderLoop(); }
  checkPendingScan();     // 未登录也记录 scan 参数，登录后确认
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
