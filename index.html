}
[data-theme="champagne"]{
  --bg:#f8f3ea;--card:#fffdf8;--text:#3f3527;--text2:#857763;--text3:#b3a795;
  --border:#e8dfd0;--primary:#b98a2f;--primary2:#a67a22;--primary-soft:#f5ecd9;
  --danger:#c05548;--ok:#7d9b4e;--warn:#b98a2f;
  --header-bg:rgba(255,253,248,.88);--shadow:0 2px 12px rgba(90,70,30,.08);--input-bg:#f6efe2;
}
[data-theme="pink"]{
  --bg:#fff5f8;--card:#ffffff;--text:#3a2f36;--text2:#8a6f7c;--text3:#bfa9b5;
  --border:#f3dfe7;--primary:#ec407a;--primary2:#d81b60;--primary-soft:#fdeef3;
  --danger:#e5484d;--ok:#26a269;--warn:#d97706;
  --header-bg:rgba(255,255,255,.9);--shadow:0 2px 12px rgba(200,90,130,.09);--input-bg:#fdf3f7;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
/* 档期页右上角主题圆点切换 */
.theme-dots{display:flex;align-items:center;gap:7px}
.theme-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--border);transition:transform .15s}
.theme-dot:hover{transform:scale(1.18)}
.theme-dot.active{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--primary);transform:scale(1.12)}
/* 档期表单下拉项（酒店/厅名/策划师/人员）：文字与底色反向，加粗突出 */
#scheduleModal input[list],
#scheduleModal .person-pick input{background:var(--text);color:var(--card);font-weight:700;border-color:var(--primary);letter-spacing:.3px}
#scheduleModal input[list]::placeholder,
#scheduleModal .person-pick input::placeholder{color:var(--card);opacity:.55}
textarea{resize:vertical;min-height:80px}
#fNote{resize:none;height:80px;overflow-y:auto}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px;opacity:.4}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:600;transition:transform .12s,opacity .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-danger-ghost{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.role-badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.role-badge.master{background:#fde8e8;color:#c53030}
.role-badge.sub{background:#e8eefd;color:#3b6fe0}
.role-badge.admin{background:#f0e8fd;color:#7c3aed}
[data-theme="dark"] .role-badge.master{background:#3a2020;color:#fca5a5}
[data-theme="dark"] .role-badge.sub{background:#1d2942;color:#93b4f8}
[data-theme="dark"] .role-badge.admin{background:#2c2240;color:#c4a5f4}
.empty-hint{text-align:center;color:var(--text3);padding:48px 20px;font-size:14px}
.empty-hint .big{font-size:42px;margin-bottom:10px;opacity:.5}
select option:disabled{color:#b5aea4;background:#f6f3ee}
.list-date-title{font-size:13px;font-weight:700;color:var(--text2);padding:10px 4px 6px;display:flex;align-items:center;justify-content:space-between}
#scheduleListView{width:100%;max-width:900px;margin:0 auto}
/* 头像 */
.me-avatar{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:18px;font-weight:800;overflow:hidden;vertical-align:middle}
.me-avatar img{width:100%;height:100%;object-fit:cover}
.auth-avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15px;font-weight:700;overflow:hidden;flex:none}
.auth-avatar img{width:100%;height:100%;object-fit:cover}
.auth-avatar.sm{width:26px;height:26px;font-size:12px}
@media(min-width:1100px){#scheduleListView{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}#scheduleListView .list-date-title,#scheduleListView .delivered-divider{grid-column:1/-1}}
/* 顶部滚动订单条（近一周订单，红字灰底） */
.order-ticker{width:100%;max-width:900px;margin:8px auto 2px;background:#e8e8e8;border-radius:10px;overflow:hidden;position:relative;height:30px;border:1px solid #ddd}
.order-ticker-track-v{width:100%;will-change:transform}
.ticker-line{height:30px;line-height:30px;padding:0 12px;font-size:13px;color:#d32f2f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
@keyframes orderScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
/* 下两次订单日 */
.upcoming-btn{margin:10px 4px 2px}
.up-day{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px;margin-bottom:12px}
.up-day-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;cursor:pointer;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--border);color:var(--primary)}
.up-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--input-bg);cursor:pointer}
.up-card:active{opacity:.7}
.up-card-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.up-client{font-weight:700;font-size:14px}
.up-time{font-size:12px;color:var(--primary);font-weight:600}
.up-card-sub{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Toast */
#toastRoot{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{padding:10px 20px;border-radius:12px;background:rgba(30,34,48,.92);color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:toastIn .25s ease;max-width:100%;text-align:center}
.toast.error{background:rgba(190,55,60,.95)}
.toast.ok{background:rgba(34,138,107,.95)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* 确认框 */
#confirmRoot{position:fixed;inset:0;z-index:980;display:flex;align-items:center;justify-content:center;background:rgba(15,17,26,.5);padding:24px;animation:fadeIn .18s}
.confirm-card{background:var(--card);border-radius:16px;padding:22px;width:min(92vw,360px);box-shadow:var(--shadow)}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--text2);margin-bottom:18px;white-space:pre-wrap}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}

/* ============ 登录页 ============ */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--primary-soft),var(--bg) 60%)}
.auth-card{width:min(92vw,400px);background:var(--card);border-radius:20px;padding:32px 26px;box-shadow:var(--shadow)}
.auth-foot{margin-top:20px;text-align:center;font-size:12px;letter-spacing:1px;color:var(--text3);opacity:.75}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-welcome{background:linear-gradient(135deg,var(--primary),var(--primary2));border-radius:18px;padding:30px 18px 26px;margin-bottom:18px;color:#fff;box-shadow:var(--shadow)}
.auth-welcome-title{font-size:26px;font-weight:800;text-align:center;letter-spacing:2px}
.auth-welcome-sig{font-size:13px;text-align:center;margin-top:10px;color:rgba(255,255,255,.94);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-qr-pane .qr-login-block{border:none;padding:0;margin:0}
.auth-qr-pane{margin-top:2px}
.auth-logo .logo-box{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;font-size:30px;font-weight:800}
.auth-logo h1{font-size:22px;font-weight:800}
.auth-logo p{font-size:13px;color:var(--text3);margin-top:4px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.auth-toggle{display:flex;background:var(--input-bg);border-radius:12px;padding:4px;margin-bottom:18px;border:1px solid var(--border)}
.auth-toggle button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2)}
.auth-toggle button.active{background:var(--card);color:var(--primary);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.auth-hint{font-size:12px;color:var(--text3);text-align:center;margin-top:14px}
.qr-login-block{margin-bottom:6px;text-align:center}
.qr-login-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:14px;color:var(--text1)}
.qr-box{width:168px;height:168px;margin:0 auto;background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.qr-box img{width:152px;height:152px;border-radius:6px}
.qr-loading{color:var(--text3);font-size:12px}
.qr-status{margin-top:10px;font-size:12px;color:var(--text3);line-height:1.5}
.qr-hint{margin-top:6px;font-size:11px;color:var(--primary);line-height:1.5;min-height:16px}
.qr-offline{color:#c0392b;font-size:12px;padding:8px;line-height:1.5}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ============ 主框架 ============ */
.app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:74px}
.app-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
.header-l{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;flex-shrink:0}
.header-title{font-size:17px;font-weight:800;line-height:1.2}
.header-sub{font-size:11px;color:var(--text3)}
.header-r{display:flex;align-items:center;gap:10px}
.sync-state{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s}
.sync-dot.on{background:var(--ok)}
.sync-dot.off{background:var(--danger)}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.header-user{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;cursor:pointer;padding:5px 9px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);transition:transform .12s}
.header-user:active{transform:scale(.96)}
.header-user .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.header-txt{min-width:0}
.header-sig{display:inline-block;vertical-align:middle;margin-left:7px;font-size:11.9px;font-weight:500;color:var(--text3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;overflow:hidden}
.header-avatar img{width:100%;height:100%;object-fit:cover}
.logout-btn{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#e74c3c;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:5px 10px;cursor:pointer;transition:transform .12s;white-space:nowrap}
.logout-btn:active{transform:scale(.95)}
.hu-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hu-sig{font-size:10px;color:var(--text3);font-weight:500;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hu-caret{color:var(--text3);font-size:10px;flex-shrink:0}
/* 用户菜单 */
.user-menu-card{max-width:330px;width:100%}
.um-head{display:flex;align-items:center;gap:12px}
.um-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;overflow:hidden}
.um-avatar img{width:100%;height:100%;object-fit:cover}
.um-id{flex:1;min-width:0}
.um-name{font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um-meta{font-size:12px;color:var(--text3);margin-top:3px}
.um-close{flex-shrink:0}
.um-sig{font-size:12px;color:var(--text2);background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:8px 11px;margin:12px 0;word-break:break-all}
.um-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.um-actions .btn{font-size:13px}
.um-form{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
.um-form .fld{margin-bottom:9px}
.um-form .fld input{width:100%;box-sizing:border-box;margin-top:4px}
@media(max-width:420px){ .hu-sig{display:none} }
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--input-bg);border:1px solid var(--border);color:var(--text2);font-size:16px}
.icon-btn:active{transform:scale(.94)}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--text3);font-size:11px;font-weight:600}
.tab-item .t-ic{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .2s}
.tab-item.active{color:var(--primary)}
.tab-item.active .t-ic{background:var(--primary-soft)}
@media(min-width:768px){
  .app{padding-bottom:20px}
  .tabbar{position:static;border-top:none;border-bottom:1px solid var(--border);box-shadow:none;max-width:1100px;margin:0 auto}
  .tab-item{flex:none;flex-direction:row;gap:7px;padding:13px 22px;font-size:14px}
}

/* ============ 档期 ============ */
.tab-page{padding:14px 14px 20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-switch{display:flex;gap:8px;margin-bottom:12px}
.view-switch button{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-weight:600;color:var(--text2)}
.view-switch button.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* 日历 */
.calendar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
/* 人员年度订单搜索 */
.py-search{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.py-search input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text1);outline:none}
.py-search input:focus{border-color:var(--primary)}
.py-year-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px}
.py-year-title{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.py-year-title .sub{font-size:12px;color:var(--text3);font-weight:400}
.py-year-item{display:flex;flex-direction:column;gap:3px;padding:10px 4px;border-bottom:1px dashed var(--border);cursor:pointer}
.py-year-item:last-child{border-bottom:none}
.py-year-item:active{background:var(--input-bg)}
.py-year-item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.py-year-item .date{font-size:13px;font-weight:800;color:var(--primary)}
.py-year-item .client{font-size:14px;font-weight:700}
.py-year-item .r2{font-size:12px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap}
/* 当日人员占用 */
.occ-panel{margin-top:10px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px}
.occ-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.occ-title .occ-date{color:var(--text3);font-weight:600;font-size:12px}
.occ-list{display:flex;flex-wrap:wrap;gap:7px}
.occ-chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--input-bg);color:var(--text1);border:1px solid var(--border)}
.occ-chip.occ-busy{background:var(--bg);color:var(--text3);border-color:var(--border);opacity:.65;text-decoration:line-through}
.occ-chip.occ-empty-hint{background:transparent;border-style:dashed;color:var(--text3);font-weight:400}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--input-bg);font-size:16px;color:var(--text2)}
.cal-nav button:active{transform:scale(.94)}
.cal-month{font-size:17px;font-weight:800;cursor:pointer;padding:6px 10px;border-radius:9px}
.cal-month:hover{background:var(--input-bg)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px 4px}
.cal-week span{text-align:center;font-size:12px;color:var(--text3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 6px 10px}
.cal-day{position:relative;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;cursor:pointer;transition:background .15s}
.cal-day:hover{background:var(--input-bg)}
.cal-day.out{opacity:.3}
.cal-day.today{background:var(--primary-soft)}
.cal-day.today .d-num{color:var(--primary);font-weight:800}
.cal-day.selected{background:var(--primary)}
.cal-day.selected .d-num,.cal-day.selected .d-count{color:#fff}
.d-num{font-size:14px;font-weight:600}
.d-count{font-size:10px;color:var(--text3);margin-top:2px;font-weight:600}
.cal-day.selected .d-count{color:rgba(255,255,255,.85)}
.dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:80%}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.cal-day.selected .dots i{background:#fff}
@media(min-width:768px){.cal-day{min-height:72px}.d-num{font-size:15px}}

/* 筛选 */
.sched-filters{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
.sched-filters select{width:auto;flex:1;min-width:120px}
.sched-filters input{flex:2;min-width:140px}

/* 档期卡片 */
.sched-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--primary);transition:transform .12s}
.sched-card.expanded{border-left-color:#b8860b}
.sub-detail{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:8px;border:1px dashed var(--border)}
.sub-detail-row{font-size:13px;line-height:1.9;color:var(--text)}
.sub-detail-row span{display:inline-block;min-width:72px;font-weight:600;color:var(--text2)}
.sched-card:active{transform:scale(.99)}
.sched-card.delivered{border-left-color:var(--text3);opacity:.6;filter:grayscale(.6)}

    _this.getLength = function(buffer) {
      return ~~(_bytes.length / 2);
    };

    _this.write = function(buffer) {

      var data = _bytes;

      var i = 0;

      while (i + 1 < data.length) {

        var c = ( (0xff & data[i]) << 8) | (0xff & data[i + 1]);

        if (0x8140 <= c && c <= 0x9FFC) {
          c -= 0x8140;
        } else if (0xE040 <= c && c <= 0xEBBF) {
          c -= 0xC140;
        } else {
          throw 'illegal char at ' + (i + 1) + '/' + c;
        }

        c = ( (c >>> 8) & 0xff) * 0xC0 + (c & 0xff);

        buffer.put(c, 13);

        i += 2;
      }

      if (i < data.length) {
        throw 'illegal char at ' + (i + 1);
      }
    };

    return _this;
  };

  //=====================================================================
  // GIF Support etc.
  //

  //---------------------------------------------------------------------
  // byteArrayOutputStream
  //---------------------------------------------------------------------

  var byteArrayOutputStream = function() {

    var _bytes = [];

    var _this = {};

    _this.writeByte = function(b) {
      _bytes.push(b & 0xff);
    };

    _this.writeShort = function(i) {
      _this.writeByte(i);
      _this.writeByte(i >>> 8);
    };

    _this.writeBytes = function(b, off, len) {
      off = off || 0;
      len = len || b.length;
      for (var i = 0; i < len; i += 1) {
        _this.writeByte(b[i + off]);
      }
    };

    _this.writeString = function(s) {
      for (var i = 0; i < s.length; i += 1) {
        _this.writeByte(s.charCodeAt(i) );
      }
    };

    _this.toByteArray = function() {
      return _bytes;
    };

    _this.toString = function() {
      var s = '';
      s += '[';
      for (var i = 0; i < _bytes.length; i += 1) {
        if (i > 0) {
          s += ',';
        }
        s += _bytes[i];
      }
      s += ']';
      return s;
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // base64EncodeOutputStream
  //---------------------------------------------------------------------

  var base64EncodeOutputStream = function() {

    var _buffer = 0;
    var _buflen = 0;
    var _length = 0;
    var _base64 = '';

    var _this = {};

    var writeEncoded = function(b) {
      _base64 += String.fromCharCode(encode(b & 0x3f) );
    };

    var encode = function(n) {
      if (n < 0) {
        // error.
      } else if (n < 26) {
        return 0x41 + n;
      } else if (n < 52) {
        return 0x61 + (n - 26);
      } else if (n < 62) {
        return 0x30 + (n - 52);
      } else if (n == 62) {
        return 0x2b;
      } else if (n == 63) {
        return 0x2f;
      }
      throw 'n:' + n;
    };

    _this.writeByte = function(n) {

      _buffer = (_buffer << 8) | (n & 0xff);
      _buflen += 8;
      _length += 1;

      while (_buflen >= 6) {
        writeEncoded(_buffer >>> (_buflen - 6) );
        _buflen -= 6;
      }
    };

    _this.flush = function() {

      if (_buflen > 0) {
        writeEncoded(_buffer << (6 - _buflen) );
        _buffer = 0;
        _buflen = 0;
      }

      if (_length % 3 != 0) {
        // padding
        var padlen = 3 - _length % 3;
        for (var i = 0; i < padlen; i += 1) {
          _base64 += '=';
        }
      }
    };

    _this.toString = function() {
      return _base64;
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // base64DecodeInputStream
  //---------------------------------------------------------------------

  var base64DecodeInputStream = function(str) {

    var _str = str;
    var _pos = 0;
    var _buffer = 0;
    var _buflen = 0;

    var _this = {};

    _this.read = function() {

      while (_buflen < 8) {

        if (_pos >= _str.length) {
          if (_buflen == 0) {
            return -1;
          }
          throw 'unexpected end of file./' + _buflen;
        }

        var c = _str.charAt(_pos);
        _pos += 1;

        if (c == '=') {
          _buflen = 0;
          return -1;
        } else if (c.match(/^\s$/) ) {
          // ignore if whitespace.
          continue;
        }

        _buffer = (_buffer << 6) | decode(c.charCodeAt(0) );
        _buflen += 6;
      }

      var n = (_buffer >>> (_buflen - 8) ) & 0xff;
      _buflen -= 8;
      return n;
    };

    var decode = function(c) {
      if (0x41 <= c && c <= 0x5a) {
        return c - 0x41;
      } else if (0x61 <= c && c <= 0x7a) {
        return c - 0x61 + 26;
      } else if (0x30 <= c && c <= 0x39) {
        return c - 0x30 + 52;
      } else if (c == 0x2b) {
        return 62;
      } else if (c == 0x2f) {
        return 63;
      } else {
        throw 'c:' + c;
      }
    };

    return _this;
  };

  //---------------------------------------------------------------------
  // gifImage (B/W)
  //---------------------------------------------------------------------

  var gifImage = function(width, height) {

    var _width = width;
    var _height = height;
    var _data = new Array(width * height);

    var _this = {};

    _this.setPixel = function(x, y, pixel) {
      _data[y * _width + x] = pixel;
    };

    _this.write = function(out) {

      //---------------------------------
      // GIF Signature

      out.writeString('GIF87a');

      //---------------------------------
      // Screen Descriptor

      out.writeShort(_width);
      out.writeShort(_height);

      out.writeByte(0x80); // 2bit
      out.writeByte(0);
      out.writeByte(0);

      //---------------------------------
      // Global Color Map

      // black
      out.writeByte(0x00);
      out.writeByte(0x00);
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);
      out.writeByte(0xff);
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeString(',');
      out.writeShort(0);
      out.writeShort(0);
      out.writeShort(_width);
      out.writeShort(_height);
      out.writeByte(0);

      //---------------------------------
      // Local Color Map

      //---------------------------------
      // Raster Data

      var lzwMinCodeSize = 2;
      var raster = getLZWRaster(lzwMinCodeSize);

      out.writeByte(lzwMinCodeSize);

      var offset = 0;

      while (raster.length - offset > 255) {
        out.writeByte(255);
        out.writeBytes(raster, offset, 255);
        offset += 255;
      }

      out.writeByte(raster.length - offset);
      out.writeBytes(raster, offset, raster.length - offset);
      out.writeByte(0x00);

      //---------------------------------
      // GIF Terminator
      out.writeString(';');
    };

    var bitOutputStream = function(out) {

      var _out = out;
      var _bitLength = 0;
      var _bitBuffer = 0;

      var _this = {};

      _this.write = function(data, length) {

        if ( (data >>> length) != 0) {
          throw 'length over';
        }

        while (_bitLength + length >= 8) {
          _out.writeByte(0xff & ( (data << _bitLength) | _bitBuffer) );
          length -= (8 - _bitLength);
          data >>>= (8 - _bitLength);
          _bitBuffer = 0;
          _bitLength = 0;
        }

        _bitBuffer = (data << _bitLength) | _bitBuffer;
        _bitLength = _bitLength + length;
      };

      _this.flush = function() {
        if (_bitLength > 0) {
          _out.writeByte(_bitBuffer);
        }
      };

      return _this;
    };

    var getLZWRaster = function(lzwMinCodeSize) {

      var clearCode = 1 << lzwMinCodeSize;
      var endCode = (1 << lzwMinCodeSize) + 1;
      var bitLength = lzwMinCodeSize + 1;

      // Setup LZWTable
      var table = lzwTable();

      for (var i = 0; i < clearCode; i += 1) {
        table.add(String.fromCharCode(i) );
      }
      table.add(String.fromCharCode(clearCode) );
      table.add(String.fromCharCode(endCode) );

      var byteOut = byteArrayOutputStream();
      var bitOut = bitOutputStream(byteOut);

      // clear code
      bitOut.write(clearCode, bitLength);

      var dataIndex = 0;

      var s = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

      while (dataIndex < _data.length) {

        var c = String.fromCharCode(_data[dataIndex]);
        dataIndex += 1;

        if (table.contains(s + c) ) {

          s = s + c;

        } else {

          bitOut.write(table.indexOf(s), bitLength);

          if (table.size() < 0xfff) {

            if (table.size() == (1 << bitLength) ) {
              bitLength += 1;
            }

            table.add(s + c);
          }

          s = c;
        }
      }

      bitOut.write(table.indexOf(s), bitLength);

      // end code
      bitOut.write(endCode, bitLength);

      bitOut.flush();

      return byteOut.toByteArray();
    };

    var lzwTable = function() {

      var _map = {};
      var _size = 0;

      var _this = {};

      _this.add = function(key) {
        if (_this.contains(key) ) {
          throw 'dup key:' + key;
        }
        _map[key] = _size;
        _size += 1;
      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

      _this.contains = function(key) {
        return typeof _map[key] != 'undefined';
      };

      return _this;
    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  //---------------------------------------------------------------------
  // returns qrcode function.

  return qrcode;
}();

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

if(typeof window!=='undefined'){ window.qrcode=qrcode; }

</script>

/* ============ 工具函数 ============ */
function uid(p){ return (p||'x') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function $(id){ return document.getElementById(id); }
function val(id){ return $(id).value; }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }

/* Toast */
function toast(msg, type){
  const root=$('toastRoot');
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':type==='ok'?' ok':'');
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); },320); }, 2400);
}

/* 确认框（Promise） */
function confirmBox(title, text){
  return new Promise(function(resolve){
    const root=$('confirmRoot');
    root.classList.remove('hidden');
    root.innerHTML='<div class="confirm-card">'+
      '<div class="confirm-title">'+esc(title)+'</div>'+
      '<div class="confirm-text">'+esc(text)+'</div>'+
      '<div class="confirm-actions">'+
      '<button class="btn btn-ghost" id="confirmNo">取消</button>'+
      '<button class="btn btn-primary" id="confirmYes">确定</button>'+
      '</div></div>';
    $('confirmYes').onclick=function(){ root.classList.add('hidden'); resolve(true); };
    $('confirmNo').onclick=function(){ root.classList.add('hidden'); resolve(false); };
    root.onclick=function(e){ if(e.target===root){ root.classList.add('hidden'); resolve(false); } };
  });
}

/* 下载文件 */
function download(filename, content, mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ============ 本地存储层（ps_ 前缀，云端集合一一对应） ============ */
const DB = {
  get:function(key,fb){ try{ const v=localStorage.getItem('ps_'+key); return v?JSON.parse(v):fb; }catch(e){ return fb; } },
  set:function(key,val){ try{ localStorage.setItem('ps_'+key, JSON.stringify(val)); }catch(e){ console.warn('storage write fail', key); } },
  getUsers:function(){ return this.get('users',[]); },
  setUsers:function(v){ this.set('users',v); },
  getSchedules:function(){ return this.get('schedules',[]); },
  setSchedules:function(v){ this.set('schedules',v); },

  getDaySettings:function(){ return this.get('day_settings',{}); },

        if(!r) return;
        out.push({
          id:(r.id)||('s2_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)),

        });

  getSession:function(){ return this.get('session',null); },

  getDeviceId:function(){

    if(!d){ d='dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,10); localStorage.setItem('ps_device_id',d); }

/* ============ 全局状态 ============ */
let currentUser=null;
let activeTab='schedule';
let calYear=null, calMonth=null;   // 当前显示的日历年月（0-11）
let selectedDate=null;
let viewMode='calendar';           // calendar | list
let editingScheduleId=null;        // 表单编辑中的档期 id

var expandedMeCards={acct:1};      // 我的页主体栏目：默认账号信息展开，其余收起

function getCurrentMasterId(){
  if(!currentUser) return null;

  if(currentUser.ownerId) return currentUser.ownerId;
  const owner=DB.getUsers().find(function(u){ return u.id===currentUser.createdBy || u.username===currentUser.createdBy; });
  return owner?owner.id:null;
}
function isMasterLike(){ return currentUser && (currentUser.role==='master'||currentUser.role==='admin'); }
function hotelName(h){ return (typeof h==='string')?h:((h&&h.name)?h.name:''); }
function mapOldTheme(t){
  if(t==='system'||t==='light') return 'auto';
  return THEME_ORDER.indexOf(t)>=0?t:'auto';
}
/* 兼容旧版 ps_settings 扁平格式 {themeMode, themeColor} → 按主账号分组 */
function ensureSettingsShape(){
  const s=DB.getSettings();
  if(!s || (s.themeMode===undefined && s.themeColor===undefined)) return;
  const mids=DB.getUsers().filter(function(u){return u.role==='master'||u.role==='admin';}).map(function(u){return u.id;});

  const news={};
  mids.forEach(function(mid){ news[mid]={masterId:mid, theme:theme, updatedAt:new Date().toISOString()}; });
  if(Object.keys(news).length) DB.setSettings(news);
}
function masterSettings(){
  const mid=getCurrentMasterId();
  const s=DB.getSettings();
  return s[mid]||{ masterId:mid };
}
function saveMasterSettings(patch){
  const mid=getCurrentMasterId(); if(!mid) return;
  const s=DB.getSettings();
  s[mid]=Object.assign({}, s[mid]||{masterId:mid}, patch, {updatedAt:new Date().toISOString()});
  DB.setSettings(s);
  markDirty('settings');
}
function addLog(action, detail){
  const mid=getCurrentMasterId(); if(!mid) return;
  const log=DB.getOpLog(mid);
  log.unshift({id:uid('log'), action:action, detail:detail||'', username:currentUser?currentUser.username:'', time:new Date().toISOString()});
  if(log.length>500) log.length=500;
  DB.setOpLog(mid, log);

/* ============ 云端同步层 ============ */
let cloudApp=null, cloudDB=null, cloudOK=false;
const dirty=new Set();
let pushTimer=null, pushing=false;

async function initCloud(){
  try{
    if(typeof cloudbase==='undefined'){ console.warn('[cloud] SDK 未加载，离线模式'); return false; }
    cloudApp=cloudbase.init({env:CLOUDBASE_ENV, region:CLOUD_REGION});
    const auth=cloudApp.auth({persistence:'local'});
    await auth.signInAnonymously();
    // SDK 在匿名登录未开通时会静默失败，这里主动校验登录态
    const st=await auth.getLoginState();
    if(!st){ throw new Error('匿名登录未开通，请到 CloudBase 控制台开启'); }
    cloudDB=cloudApp.database();
    // 探活：真实读取一次，验证数据接口（CORS/安全域名）可用，避免登录成功但数据接口被拦时误报「已同步」
    try{
      await cloudDB.collection('users').limit(1).get();
    }catch(probeErr){
      console.warn('[cloud] 数据接口探活失败:', probeErr && probeErr.message);
      throw new Error('数据接口不可用：请在 CloudBase 控制台「安全来源-Web 安全域名」添加 '+location.origin);
    }
    cloudOK=true;
    setSyncState('busy');
    // 后台异步拉取，不阻塞页面（登录后仍会带进度条完整同步）
    setTimeout(function(){
      (async function(){
        try{
          await pullAllToLocal(true, null);
          await pushAllCollections();
          setSyncState('on');
          startWatchers();
          if(currentUser){ renderAll(); refreshPhotographerFilter(); }
        }catch(e){ console.warn('[cloud] 后台初始化同步失败', e); setSyncState('on'); startWatchers(); }
      })();
    }, 0);
    checkAppUpdate();   // 检测云端是否有新版本（强制更新）
    return true;
  }catch(e){
    console.warn('[cloud] 初始化失败:', e && e.message);
    cloudOK=false; setSyncState('off');
    toast((e&&e.message)||'云同步未连接','error');
    return false;
  }
}

function setSyncState(state){ // on | off | busy
  const dot=$('syncDot'), txt=$('syncText');
  if(!dot) return;
  dot.className='sync-dot '+state;
  if(!txt) return;
  if(state==='on'){ txt.textContent=cloudOK?'已同步':'离线'; }
  else if(state==='off'){ txt.textContent='离线模式'; }
  else { txt.textContent='同步中'; }
}

async function getAllDocs(name){
  if(!cloudOK||!cloudDB) return [];
  try{
    const col=cloudDB.collection(name);
    let out=[];
    let batch=await col.limit(100).get();
    out=out.concat(batch.data||[]);
    while((batch.data||[]).length===100){
      batch=await col.skip(out.length).limit(100).get();
      out=out.concat(batch.data||[]);
    }
    /* 兼容旧版 data 嵌套文档（早期 set({data:...}) 写入）：展开为顶层字段 */
    return out.map(function(x){
      if(x && x.data && typeof x.data==='object' && !x.id && !x.username && !x.name && !x.clientName && !x.date && !x.title && !x.masterId && !x.code){
        const merged=Object.assign({}, x.data);
        if(x._id) merged._id=x._id;
        delete merged._openid;   // 云端自动字段，禁止回写
        return merged;
      }
      const c=Object.assign({}, x);
      delete c._openid;          // 云端自动字段，禁止回写
      return c;
    });
  }catch(e){ console.warn('[cloud] 拉取失败', name, e); return []; }
}

/* 增量拉取：只取 _syncAt > since 的文档；无 since 或失败时回退全量 */
async function getAllDocsInc(name, since){
  if(!cloudOK||!cloudDB) return [];
  if(!since) return getAllDocs(name);
  try{
    const col=cloudDB.collection(name);
    const _=cloudDB.command;
    let out=[];
    let batch=await col.where({_syncAt: _.gt(since)}).limit(100).get();
    out=out.concat(batch.data||[]);
    while((batch.data||[]).length===100){
      batch=await col.where({_syncAt: _.gt(since)}).skip(out.length).limit(100).get();
      out=out.concat(batch.data||[]);
    }
    return out.map(function(x){
      if(x && x.data && typeof x.data==='object' && !x.id && !x.username && !x.name && !x.clientName && !x.date && !x.title && !x.masterId && !x.code){
        const merged=Object.assign({}, x.data);
        if(x._id) merged._id=x._id;
        delete merged._openid;
        return merged;
      }
      const c=Object.assign({}, x);
      delete c._openid;
      return c;
    });
  }catch(e){
    console.warn('[cloud] 增量拉取失败，回退全量', name, e);
    return getAllDocs(name);
  }
}

/* 各集合上次同步时间戳（按主账号隔离） */
function _lastSyncKey(name){ const mid=getCurrentMasterId()||'_anon'; return 'xgd_lastSync_'+mid+'_'+name; }
function _getLastSync(name){ try{ return localStorage.getItem(_lastSyncKey(name))||''; }catch(e){ return ''; } }
function _setLastSync(name, ts){ try{ localStorage.setItem(_lastSyncKey(name), ts); }catch(e){} }

/* 全量拉取：云端 → 本地（REPLACE 覆盖；dirty 集合跳过以避免覆盖未同步的本地修改） */
async function pullAllToLocal(force, onProgress){
  if(!cloudOK) return false;
  const _pT=['users','schedules','settings','day_settings','sessions','photographers','hotels','operation_log','plaza_topics','plaza_comments'];
  let _pi=0;
  const _stepP=function(label){ if(onProgress){ _pi++; onProgress(Math.min(_pi,_pT.length), _pT.length, label); } };
  const skip=function(c){ return dirty.has(c); };
  const myMid=getCurrentMasterId();   // 未登录时为 null：跳过私有集合，避免混合
  // 通用合并：以 id 去重。云端同 id 多份先按 _syncAt 取最新（用户清空/最新保存优先），再与本地合并：
  // 云端空/缺省字段不覆盖本地非空值（保护本地已录数据），云端非空新值覆盖本地旧值
  function mergeById(local, cloud){
    const cloudBy={};
    (cloud||[]).forEach(function(x){
      if(x&&x.id){
        const cur=cloudBy[x.id];
        if(!cur || (x._syncAt||x.updatedAt||'') >= (cur._syncAt||cur.updatedAt||'')) cloudBy[x.id]=x;
      }
    });
    const by={};
    (local||[]).forEach(function(x){ if(x&&x.id) by[x.id]=x; });
    Object.keys(cloudBy).forEach(function(id){
      const x=cloudBy[id];
      const cur=by[id];
      if(!cur){ by[id]=x; return; }
      const merged=Object.assign({}, cur, x);
      Object.keys(x).forEach(function(k){
        if((x[k]===''||x[k]===null||x[k]===undefined) && cur[k]!=='' && cur[k]!=null && cur[k]!==undefined){ merged[k]=cur[k]; }
      });
      by[id]=merged;
    });
    return Object.keys(by).map(function(k){ return by[k]; });
  }
  try{
    // 并行+增量：10个集合同时发起；有上次同步时间则只拉变化的，首次全量
    const nowIso=new Date().toISOString();
    const doGet=function(name){
      if(skip(name)) return Promise.resolve(null);
      const since=_getLastSync(name);
      return getAllDocsInc(name, since).then(function(d){ _stepP(name); _setLastSync(name, nowIso); return d; });
    };
    const [usersD,schedD,settingsD,dayD,sessionsD,photoD,hotelD,opLogD,topicD,commentD]=await Promise.all([
      doGet('users'), doGet('schedules'), doGet('settings'), doGet('day_settings'),
      doGet('sessions'), doGet('photographers'), doGet('hotels'), doGet('operation_log'),
      doGet('plaza_topics'), doGet('plaza_comments')
    ]);

    if(usersD){
      /* 先收集云端删除标记，过滤该 id 所有文档（含跨身份删不掉的残留），防止删除的账号复活 */
      const deletedIds={};
      usersD.forEach(function(x){ if(x&&x.id&&x._deleted) deletedIds[x.id]=true; });
      const valid=usersD.filter(function(x){return x&&x.id&&x.username&&!deletedIds[x.id];});
      if(valid.length>0) DB.setUsers(mergeById(DB.getUsers(), valid).filter(function(x){ return x&&!x._deleted; }));
    }
    const cloudUserIds={};
    DB.getUsers().forEach(function(u){ if(u&&u.id) cloudUserIds[u.id]=true; });

    if(myMid && schedD){
      // 收集云端删除墓碑：已删除的订单 id 不再复活
      const tombIds={};
      schedD.forEach(function(x){ if(x&&x.id&&x._deleted) tombIds[x.id]=true; });
      if(Object.keys(tombIds).length>0){
        DB.setSchedules(DB.getSchedules().filter(function(x){ return x&&!tombIds[x.id]; }));
      }
      // 兼容无 ownerId 的旧档期：可见并归属当前主账号（单主账号场景认领）
      const mine=schedD.filter(function(x){return x&&x.id&&!tombIds[x.id]&&(x.ownerId===myMid||!x.ownerId);});
      if(mine.length>0){
        const merged=mergeById(DB.getSchedules(), mine);
        DB.setSchedules(merged);
        const toClaim=merged.filter(function(x){return !x.ownerId;});
        if(toClaim.length){
          const now2=new Date().toISOString();
          toClaim.forEach(function(x){ x.ownerId=myMid; x.updatedAt=now2; });
          DB.setSchedules(merged);
          markDirty('schedules');
        }
      }
    }
    if(settingsD){
      const map={};
      const cur=DB.getSettings();
      settingsD.forEach(function(x){
        if(!x) return;
        if(x._id==='_login_sig'||x.key==='_login_sig'){ if(x.value!=null) cur._login_sig=x.value; return; }
        if(x.masterId||x._masterId) map[x.masterId||x._masterId]=x;
      });
      if(Object.keys(map).length>0){
        Object.keys(map).forEach(function(m){ cur[m]=map[m]; });
      }
      DB.setSettings(cur);
    }
    if(myMid && dayD){
      const map={};
      dayD.forEach(function(x){ if(x&&x.date&&(x.masterId===myMid||x._masterId===myMid)) map[x.date]=x; });
      if(Object.keys(map).length>0){
        const cur=DB.getDaySettings();
        Object.keys(map).forEach(function(date){ cur[date]=map[date]; });
        DB.setDaySettings(cur);
      }
    }
    if(sessionsD){
      const mine=sessionsD.filter(function(x){ return x&&x.type!=='qr_login'&&x.type!=='online'&&(x.username===currentUser.username||x.userId===currentUser.id); });
      if(mine.length>0) DB.setSessions(mergeById(DB.getSessions(), mine));
    }
    if(photoD){
      const by={};
      photoD.forEach(function(x){ if(x&&x.name){ const m=x._masterId||x.masterId||'_default'; if(myMid&&m===myMid && String(x.name).indexOf('喜玛拾光')<0) (by[m]=by[m]||[]).push(x.name); } });
      Object.keys(by).forEach(function(m){
        const cur=DB.getPhoto(m).slice();
        by[m].forEach(function(nm){ if(cur.indexOf(nm)<0) cur.push(nm); });
        DB.setPhoto(m, cur);
      });
      // 云端空不清本地（配额超限/首次同步时云端为空，不能把本地人员清掉）
    }
    if(hotelD){
      const by={};
      hotelD.forEach(function(x){
        if(x&&x.name){
          const m=x._masterId||x.masterId||'_default';
          if(myMid&&m!==myMid) return;
          const nm=x.name;
          const arr=(by[m]=by[m]||[]);
          if(!arr.some(function(y){ return hotelName(y)===nm; })){
            arr.push({name:nm, halls:x.halls||[], planners:x.planners||[]});
          }
        }
      });
      Object.keys(by).forEach(function(m){
        const cur=DB.getHotels(m).slice();
        by[m].forEach(function(h){
          if(!cur.some(function(y){ return hotelName(y)===hotelName(h); })) cur.push(h);
        });
        DB.setHotels(m, cur);
      });
      // 云端空不清本地酒店数据
    }
    if(opLogD){
      const by={};
      opLogD.forEach(function(x){ if(x&&x.id){ const m=x._masterId||x.masterId||'_default'; if(myMid&&m===myMid) (by[m]=by[m]||[]).push(x); } });
      Object.keys(by).forEach(function(m){
        const cur=DB.getOpLog(m).slice();
        by[m].forEach(function(item){ if(!cur.some(function(y){ return y.id===item.id; })) cur.push(item); });
        DB.setOpLog(m, cur);
      });
    }
    if(topicD){
      const valid=topicD.filter(function(x){return x&&x.id&&x.title;});
      if(valid.length>0) DB.setPlazaTopics(mergeById(DB.getPlazaTopics(), valid));
    }
    if(commentD){
      const valid=commentD.filter(function(x){return x&&x.id&&x.topicId;});
      if(valid.length>0) DB.setPlazaComments(mergeById(DB.getPlazaComments(), valid));
    }
    return true;
  }catch(e){ console.warn('[cloud] pull 异常', e); return false; }
}

/* 元信息 */
function cloudMeta(){
  return {_syncAt:new Date().toISOString(), _env:CLOUDBASE_ENV, _device:DB.getDeviceId()};
}

/* 推送单个集合：本地 → 云端（doc.set 幂等覆盖） */
async function pushCollection(name){
  if(!cloudOK||!cloudDB) return;
  try{
    const col=cloudDB.collection(name);
    let items=[];
    const masterUsers=DB.getUsers().filter(function(u){ return u.role==='master'||u.role==='admin'; });
    if(name==='users'){
      items=DB.getUsers().map(function(x){ return Object.assign({}, x, {_id:'u_'+x.id}, cloudMeta()); });
    } else if(name==='schedules'){
      const myMid2=getCurrentMasterId();
      items=DB.getSchedules().filter(function(x){ return x&&(!myMid2||x.ownerId===myMid2); }).map(function(x){ return Object.assign({}, x, {_id:'s_'+x.id}, cloudMeta()); });
    } else if(name==='sessions'){
      items=DB.getSessions().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='plaza_topics'){
      items=DB.getPlazaTopics().map(function(x){ return Object.assign({}, x, {_id:'pt_'+x.id}, cloudMeta()); });
    } else if(name==='plaza_comments'){
      items=DB.getPlazaComments().map(function(x){ return Object.assign({}, x, {_id:'pc_'+x.id}, cloudMeta()); });
    } else if(name==='settings'){
      const s=DB.getSettings();
      if(s._login_sig) items.push(Object.assign({}, {_id:'_login_sig', value:s._login_sig}, cloudMeta()));
      Object.keys(s).forEach(function(mid){
        if(mid==='_login_sig') return;
        items.push(Object.assign({}, s[mid], {_id:'settings_'+mid, masterId:mid}, cloudMeta()));
      });
    } else if(name==='day_settings'){
      const ds=DB.getDaySettings();
      Object.keys(ds).forEach(function(date){
        const item=ds[date]||{};
        const mid=item.masterId||getCurrentMasterId();
        items.push(Object.assign({}, item, {_id:'day_'+mid+'_'+date, date:date, masterId:mid}, cloudMeta()));
      });
    } else if(name==='operation_log'){
      masterUsers.forEach(function(mu){
        DB.getOpLog(mu.id).forEach(function(item){
          items.push(Object.assign({}, item, {_id:'log_'+item.id, _masterId:mu.id}, cloudMeta()));
        });
      });
    } else if(name==='photographers'){
      masterUsers.forEach(function(mu){
        DB.getPhoto(mu.id).forEach(function(name){
          if(String(name).indexOf('喜玛拾光')>=0) return;
          items.push({_id:mu.id+'|'+name, name:name, _masterId:mu.id, _syncAt:cloudMeta()._syncAt, _env:CLOUDBASE_ENV, _device:DB.getDeviceId()});
        });
      });
    } else if(name==='hotels'){
      masterUsers.forEach(function(mu){
        DB.getHotels(mu.id).forEach(function(item){
          const nm=hotelName(item);
          if(!nm) return;
          items.push({_id:mu.id+'|'+nm, name:nm, halls:(item&&item.halls)||[], planners:(item&&item.planners)||[], _masterId:mu.id, _syncAt:cloudMeta()._syncAt, _env:CLOUDBASE_ENV, _device:DB.getDeviceId()});
        });
      });
    }
    if(items.length===0){ dirty.delete(name); return; }
    const B=10;   // 小批次并发，避免 CloudBase 限流导致 15s 超时中断
    for(let i=0;i<items.length;i+=B){
      const batch=items.slice(i,i+B);
      await Promise.all(batch.map(function(item){
        /* 文档内容必须剥离 _id 与 _openid（保留字段会被 CloudBase 静默拒绝写入） */
        const body=Object.assign({}, item);
        delete body._id;
        delete body._openid;
        if(item._id){
          /* users 集合：先删后建，规避跨身份 doc.set 静默失败；删除失败时读回验证，仍未生效则新增文档（拉取时最新版胜出） */
          if(name==='users'){
            body._syncAt=new Date().toISOString();
            const docRef=col.doc(item._id);
            return docRef.remove().then(function(){
              return docRef.set(body);
            }).catch(function(){
              return docRef.set(body);
            }).then(function(){
              return docRef.get().then(function(doc){
                const d=doc&&doc.data?doc.data:{};
                if(d && d._syncAt===body._syncAt) return null;
                return col.add(body);
              }).catch(function(){ return col.add(body); });
            });
          }
          return col.doc(item._id).set(body).catch(function(){ return col.add(body); });
        }
        return col.add(body);
      }));
      await new Promise(function(res){ setTimeout(res, 250); });   // 批间隔，降低触发限流概率
    }
    dirty.delete(name);
    setSyncState('on');
  }catch(e){ console.warn('[cloud] 推送失败', name, e && e.message); setSyncState('off'); }
}

function markDirty(name){ dirty.add(name); setSyncState('busy'); schedulePush(); }

function schedulePush(){
  if(!cloudOK) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){ pushTimer=null; pushAllDirty(); }, 400);
}
let pendingPush=false;
async function pushAllDirty(){
  if(!cloudOK) return;
  if(pushing){ pendingPush=true; return; }   // 推送进行中：排队，完成后重推，确保保存的修改不丢失
  pushing=true;
  try{
    const list=[];
    dirty.forEach(function(c){ list.push(c); });
    for(const c of list){ await pushCollection(c); }
  }catch(e){ console.warn(e); }
  finally{
    pushing=false;
    if(pendingPush){ pendingPush=false; pushAllDirty(); }
  }
}
async function flushPush(){
  if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; }
  await pushAllDirty();
}
async function pushAllCollections(){
  if(!cloudOK) return;
  const names=['users','schedules','settings','day_settings','sessions','operation_log','photographers','hotels','plaza_topics','plaza_comments'];
  for(const n of names){ dirty.add(n); await pushCollection(n); }
}

/* 按业务字段删除云端文档（直接删除，保证删除实时生效） */
async function cloudRemoveByField(name, field, value){
  if(!cloudOK||!cloudDB) return;
  try{
    const res=await cloudDB.collection(name).where(({[field]:value})).limit(100).get();
    const docs=res.data||[];
    for(const doc of docs){
      try{ await cloudDB.collection(name).doc(doc._id).remove(); }catch(e2){}
    }
  }catch(e){ console.warn('[cloud] 删除失败', name, e); }
}
async function cloudRemoveByQuery(name, queryObj){
  if(!cloudOK||!cloudDB) return;
  try{
    const res=await cloudDB.collection(name).where(queryObj).limit(100).get();
    const docs=res.data||[];
    for(const doc of docs){
      try{ await cloudDB.collection(name).doc(doc._id).remove(); }catch(e2){}
    }
  }catch(e){ console.warn('[cloud] 删除失败', name, e); }
}

/* watch 实时监听（收到他人修改立即合并到本地并重渲染） */
function startWatchers(){
  if(!cloudOK||!cloudDB) return;
  const cfgs=[
    {name:'schedules', local:'schedules', idKey:'id', filter:function(doc){ const m=getCurrentMasterId(); return !!m&&doc.ownerId===m; }},
    {name:'users', local:'users', idKey:'id'},
    {name:'plaza_topics', local:'plaza_topics', idKey:'id'},
    {name:'plaza_comments', local:'plaza_comments', idKey:'id'},
    {name:'sessions', local:'sessions', idKey:'id', filter:function(doc){ return doc&&(doc.username===currentUser.username||doc.userId===currentUser.id); }}
  ];
  cfgs.forEach(function(cfg){
    try{
      cloudDB.collection(cfg.name).watch({
        onChange:function(snap){
          if(!snap.docChanges||!snap.docChanges.length) return;
          /* 同账号最多 3 台设备：被"退出设备"指令踢出 → 立即退出；其他设备新登录 → 检测是否被挤出前 3 */
          if(cfg.name==='sessions'){
            const kickedByCmd=snap.docChanges.some(function(ch){
              const doc=ch.doc;
              return doc && doc.type==='kick' && currentUser && doc.userId===currentUser.id && doc.deviceId===DB.getDeviceId();
            });
            if(kickedByCmd){
              toast('该设备已被账号所有者退出登录','error');
              setTimeout(function(){ doLogout(); }, 800);
              return;
            }
            const newOnline=snap.docChanges.some(function(ch){
              const doc=ch.doc;
              return doc && doc.type==='online' && currentUser && doc.userId===currentUser.id && doc.deviceId && doc.deviceId!==DB.getDeviceId();
            });
            if(newOnline){ checkSessionLimit(); return; }
          }
          /* users 删除标记：云端标记删除 → 本地立即移除该 id 全部账号，防止残留复活 */
          if(cfg.name==='users'){
            const delIds={};
            snap.docChanges.forEach(function(ch){
              const doc=ch.doc;
              if(doc && doc[cfg.idKey] && doc._deleted) delIds[doc[cfg.idKey]]=true;
            });
            if(Object.keys(delIds).length){
              DB.set('users', DB.get('users',[]).filter(function(x){ return x&&!delIds[x.id]; }));
              if(!modalOpen) renderAll();
              return;
            }
          }
          const arr=DB.get(cfg.local, []);
          let changed=false;
          snap.docChanges.forEach(function(ch){
            const doc=ch.doc; if(!doc||!doc[cfg.idKey]) return;
            if(cfg.filter && !cfg.filter(doc)) return;
            const i=arr.findIndex(function(x){ return x[cfg.idKey]===doc[cfg.idKey]; });
            if(ch.dataType==='remove'){ if(i>=0){ arr.splice(i,1); changed=true; } }
            else if(ch.dataType==='update'){ if(i>=0){
              /* 合并：云端非空字段优先；云端空/缺省字段保留本地有值，防止脏数据覆盖本地刚保存的备注等 */
              const merged=Object.assign({}, arr[i], doc);
              Object.keys(doc).forEach(function(k){
                if((doc[k]===''||doc[k]===null||doc[k]===undefined) && arr[i][k]!=='' && arr[i][k]!=null && arr[i][k]!==undefined){ merged[k]=arr[i][k]; }
              });
              arr[i]=merged; changed=true;
            } }
            else if(ch.dataType==='add'){ if(i<0){ arr.push(doc); changed=true; } }
          });
          if(changed){
            DB.set(cfg.local, arr);
            if(!modalOpen) renderAll();
          }
        },
        onError:function(err){ console.warn('[cloud] watch 错误', cfg.name, err); }
      });
    }catch(e){ console.warn('[cloud] watch 启动失败', cfg.name); }
  });
}

/* 三设备上限检测：当前设备不在最新 3 台在线记录中 → 退出 */
async function checkSessionLimit(){
  if(!cloudOK||!cloudDB||!currentUser) return;
  try{
    const res=await cloudDB.collection('sessions').where({type:'online', userId:currentUser.id}).limit(50).get();
    const map={};
    (res.data||[]).forEach(function(d){
      if(d&&d.loginAt&&d.deviceId && (!map[d.deviceId] || d.loginAt>map[d.deviceId].loginAt)) map[d.deviceId]=d;
    });
    const onlines=Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return (b.loginAt||'').localeCompare(a.loginAt||''); });
    const myIdx=onlines.findIndex(function(d){ return d.deviceId===DB.getDeviceId(); });
    if(myIdx>=3){
      toast('本账号同时在线已达 3 台，当前设备已被顶出','error');
      setTimeout(function(){ doLogout(); }, 1000);
    }
  }catch(e){}
}
/* "我的"页已登录设备列表：云端读取该账号在线记录，最多 3 台在线 */
async function loadDeviceList(){
  const host=$('deviceList'); if(!host) return;
  if(!cloudOK||!cloudDB||!currentUser){ host.innerHTML='<span class="lbl small" style="color:var(--text3)">离线状态，无法获取设备列表</span>'; return; }
  try{
    const res=await cloudDB.collection('sessions').where({type:'online', userId:currentUser.id}).limit(50).get();
    const map={};
    (res.data||[]).forEach(function(d){
      if(d&&d.loginAt&&d.deviceId && (!map[d.deviceId] || d.loginAt>map[d.deviceId].loginAt)) map[d.deviceId]=d;
    });
    const onlines=Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return (b.loginAt||'').localeCompare(a.loginAt||''); });
    let html='';
    if(!onlines.length){ html='<div class="me-row"><span class="lbl small" style="color:var(--text3)">暂无在线设备记录</span></div>'; }
    const isLatest=onlines.length>0 && onlines[0].deviceId===DB.getDeviceId();   // 本机是否最新登录（仅最新登录可强制退出其他设备）
    onlines.slice(0,8).forEach(function(d,i){
      const isMe=d.deviceId===DB.getDeviceId();
      const online=i<3;
      html+='<div class="dev-row">'+
        '<span class="dev-name">'+esc(d.deviceName||((d.deviceId||'未知设备').slice(0,18)))+'</span>'+
        '<span class="dev-time small">'+fmtTime(d.loginAt)+'</span>'+
        '<span class="dev-status '+(isMe?'me':(online?'on':'off'))+'">'+(isMe?(isLatest?'本机(最新登录)':'本机'):(online?'在线':'已下线'))+'</span>'+
        (isMe||!online||!isLatest?'':'<button class="btn btn-ghost btn-sm" data-dev-kick="'+esc(d.deviceId)+'">强制退出</button>')+
        '</div>';
    });
    if(onlines.length>0 && !isLatest) html+='<div class="me-row"><span class="lbl small" style="color:var(--text3)">仅最新登录的设备可强制退出其他设备</span></div>';
    if(onlines.length>3) html+='<div class="me-row"><span class="lbl small" style="color:var(--text3)">仅最新 3 台为在线设备，其余自动下线</span></div>';
    host.innerHTML=html;
    host.querySelectorAll('[data-dev-kick]').forEach(function(b){
      b.onclick=function(){ sessionKick(b.dataset.devKick); };
    });
  }catch(e){ host.innerHTML='<div class="me-row"><span class="lbl small" style="color:var(--text3)">设备列表加载失败</span></div>'; }
}
/* 强制退出指定设备：仅最新登录的设备有权限（写入踢出指令，该设备数秒内被强制下线） */
async function sessionKick(deviceId){
  if(!currentUser) return;
  try{
    const res=await cloudDB.collection('sessions').where({type:'online', userId:currentUser.id}).limit(50).get();
    const map={};
    (res.data||[]).forEach(function(d){
      if(d&&d.loginAt&&d.deviceId && (!map[d.deviceId] || d.loginAt>map[d.deviceId].loginAt)) map[d.deviceId]=d;
    });
    const onlines=Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return (b.loginAt||'').localeCompare(a.loginAt||''); });
    const latest=onlines[0];
    if(!latest || latest.deviceId!==DB.getDeviceId()){
      toast('仅最新登录的设备可强制退出其他设备','error');
      loadDeviceList();
      return;
    }
  }catch(e){}
  const ok=await confirmBox('强制退出设备','确定强制该设备退出登录吗？该设备将在数秒内被强制下线。');
  if(!ok) return;
  try{
    await cloudDB.collection('sessions').add({type:'kick', userId:currentUser.id, deviceId:deviceId, kickedAt:new Date().toISOString()});
    toast('已发送强制退出指令，该设备即将下线','ok');
    loadDeviceList();
  }catch(e){ toast('操作失败，请稍后重试','error'); }
}

/* 心跳：20s 拉取一次最新数据；同时校验唯一在线（被顶出检测） */
function startHeartbeat(){
  setInterval(async function(){
    if(!cloudOK||!navigator.onLine) return;
    if(pushing) return;
    /* 三设备在线判定：自己不在该账号最新 3 台在线设备中 → 被顶出；或被"退出设备"指令踢出 → 退出 */
    if(currentUser){
      try{
        const res=await cloudDB.collection('sessions').where({type:'online', userId:currentUser.id}).limit(50).get();
        const map={};
        (res.data||[]).forEach(function(d){
          if(d&&d.loginAt&&d.deviceId && (!map[d.deviceId] || d.loginAt>map[d.deviceId].loginAt)) map[d.deviceId]=d;
        });
        const onlines=Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return (b.loginAt||'').localeCompare(a.loginAt||''); });
        const myIdx=onlines.findIndex(function(d){ return d.deviceId===DB.getDeviceId(); });
        if(myIdx>=3){
          toast('本账号同时在线已达 3 台，当前设备已被顶出','error');
          setTimeout(function(){ doLogout(); }, 1200);
          return;
        }
        const kres=await cloudDB.collection('sessions').where({type:'kick', userId:currentUser.id, deviceId:DB.getDeviceId()}).limit(20).get();
        const kicked=(kres.data||[]).some(function(d){ return d&&d.kickedAt&&(!myLoginStamp||d.kickedAt>myLoginStamp); });
        if(kicked){
          toast('该设备已被账号所有者退出登录','error');
          setTimeout(function(){ doLogout(); }, 1200);
          return;
        }
      }catch(e){}
    }
    const before=JSON.stringify({
      s:DB.getSchedules().map(function(x){return x.updatedAt||x.id;}).sort(),
      p:DB.getPlazaTopics().map(function(x){return x.id;}).sort(),
      c:DB.getPlazaComments().map(function(x){return x.id;}).sort()
    });
    await pullAllToLocal(false);
    const after=JSON.stringify({
      s:DB.getSchedules().map(function(x){return x.updatedAt||x.id;}).sort(),
      p:DB.getPlazaTopics().map(function(x){return x.id;}).sort(),
      c:DB.getPlazaComments().map(function(x){return x.id;}).sort()
    });
    if(before!==after && !modalOpen) renderAll();
  }, 20000);
}

/* 顶部订单条：上下滚动（垂直逐条轮播，速度较慢） */
var tickerTimer=null;
function renderTicker(){
  const wrap=$('orderTicker'); if(!wrap) return;
  if(tickerTimer){ clearInterval(tickerTimer); tickerTimer=null; }
  const today=todayStr();
  const end=fmtDate(addDays(new Date(),7));
  const scheds=DB.getSchedules().filter(function(s){ return s.shootDate && s.shootDate>=today && s.shootDate<=end; })
    .sort(function(a,b){ return a.shootDate<b.shootDate?-1:1; });
  if(!scheds.length){
    wrap.innerHTML='<div class="ticker-line" style="color:#999">近一周暂无订单</div>';
    return;
  }
  const lineH=30;
  // 两两并排一行，中间逗号隔开；复制一份实现无缝循环
  const fmtLine=function(s){ return (s.shootDate||'').slice(5)+' '+s.clientName+(s.hotel?'·'+s.hotel:'')+(s.photographer?'【'+s.photographer+'】':''); };
  const pairArr=[];
  for(let i=0;i<scheds.length;i+=2){
    const a=scheds[i], b=scheds[i+1];
    pairArr.push('<div class="ticker-line">'+esc(fmtLine(a))+(b?('，'+esc(fmtLine(b))):'')+'</div>');
  }
  const lines=pairArr.join('');
  wrap.innerHTML='<div class="order-ticker-track-v" id="orderTickerTrack">'+lines+lines+'</div>';
  const track=$('orderTickerTrack');
  const N=pairArr.length;
  let idx=0;
  // 垂直轮播：每 3.6s 向上滚一条（较慢速度）
  tickerTimer=setInterval(function(){
    idx++;
    if(idx>=N){ idx=0; track.style.transition='none'; track.style.transform='translateY(0)'; void track.offsetHeight; }
    track.style.transition='transform .45s ease';
    track.style.transform='translateY('+(-idx*lineH)+'px)';
  }, 3600);
  // 悬停暂停
  wrap.onmouseenter=function(){ if(tickerTimer){ clearInterval(tickerTimer); tickerTimer=null; } };
  wrap.onmouseleave=function(){
    if(!tickerTimer){
      tickerTimer=setInterval(function(){
        idx++;
        if(idx>=N){ idx=0; track.style.transition='none'; track.style.transform='translateY(0)'; void track.offsetHeight; }
        track.style.transition='transform .45s ease';
        track.style.transform='translateY('+(-idx*lineH)+'px)';
      }, 3600);
    }
  };
}

  $('unschedBtn').onclick=showUnschedModal;

  DB.getPhoto(mid).forEach(function(nm){ if(nm) set[nm]=true; });
  DB.getSchedules().forEach(function(s){

      if(nm && String(nm).indexOf('喜玛拾光')<0) set[nm]=true;

/* ============ 档期：列表 ============ */
function filterSchedules(){
  const kw=($('filterKeyword')?$('filterKeyword').value:'').trim().toLowerCase();
  const ph=$('filterPhotographer')?$('filterPhotographer').value:'';
  return DB.getSchedules().filter(function(s){
    if(ph && s.photographer!==ph) return false;
    if(kw){
      const hay=[s.clientName,s.hotel,s.hall,s.planner,s.photographer,s.secondPhotographer,s.second2Photographer,s.note].join(' ').toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
}
function upcomingDays(){
  const t=todayStr();
  const set={};
  for(let i=1;i<=5;i++){ set[fmtDate(addDays(new Date(),i))]=true; }
  return set;
}
function schedCardHTML(s, upcoming){
  const flags=[];
  if(s.pickup) flags.push('接送');
  if(s.dualCamera) flags.push('双机');
  if(s.noMorningGown) flags.push('无晨袍');
  if(s.personConfirmed) flags.push('已指定');
  const bal=(s.totalAmount||0)-(s.deposit||0);
  const note=s.note||'';
  const canEdit=isMasterLike();
  const dateHtml=upcoming[s.shootDate]&&!s.delivered?'<span class="upcoming">'+(s.shootDate?esc(s.shootDate).slice(5):'')+'</span>':(s.shootDate?esc(s.shootDate).slice(5):'未定');
  let html='<div class="sched-card'+(s.delivered?' delivered':'')+'" data-id="'+esc(s.id)+'">';
  html+='<div class="sched-head"><div class="sched-client">'+esc(s.clientName)+'</div><div class="sched-date">'+dateHtml+'</div></div>';
  if(s.hotel||s.hall||s.planner||s.photographer||s.secondPhotographer||s.second2Photographer||s.orderDate||s.arrivalTime||s.groomArrival){
    html+='<div class="sched-meta">';
    if(s.hotel) html+='<span class="m">'+esc(s.hotel)+'</span>';
    if(s.hall) html+='<span class="m">'+esc(s.hall)+'</span>';
    if(s.planner) html+='<span class="m">策划：'+esc(s.planner)+'</span>';
    if(s.photographer) html+='<span class="m">📷 '+esc(s.photographer)+'</span>';
    if(s.secondPhotographer) html+='<span class="m">副机：'+esc(s.secondPhotographer)+'</span>';
    if(s.second2Photographer) html+='<span class="m">副2机：'+esc(s.second2Photographer)+'</span>';
    if(s.arrivalTime) html+='<span class="m">人员到场 '+esc(s.arrivalTime)+'</span>';
    if(s.groomArrival) html+='<span class="m">新郎抵达 '+esc(s.groomArrival)+'</span>';
    html+='</div>';
  }
  html+='<div class="sched-money"><span class="amt">总额 ¥'+(s.totalAmount||0)+'</span><span class="dep">定金 ¥'+(s.deposit||0)+'</span><span class="bal">尾款 ¥'+bal+'</span></div>';
  if(note) html+='<div class="sched-note">'+esc(note)+'</div>';
  html+='<div class="sched-foot"><div class="sched-tags">';
  if(flags.length) flags.forEach(function(f){ html+='<span class="chip">'+f+'</span>'; });
  if(s.delivered){ html+='<span class="delivered-stamp">已交付 '+(s.deliveredAt?esc(s.deliveredAt).slice(0,10):'')+'</span>'; }
  html+='</div><div class="sched-actions">';
  html+='<button class="btn btn-sm btn-ghost s-act-share">分享</button>';
  if(!s.delivered && canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-deliver">交付</button>';
  }else if(s.delivered && canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-restore">恢复</button>';
  }
  if(canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-edit">编辑</button>';
    html+='<button class="btn btn-sm btn-danger-ghost s-act-del">删除</button>';
  }
  html+='</div></div></div>';
  return html;
}
function renderScheduleList(){
  initCalDates();
  const cont=$('scheduleListView');
  if(!selectedDate){
    cont.innerHTML='<div class="empty-hint"><div class="big">📅</div>点击日历选择日期，查看当日订单</div>';
    return;
  }
  const scheds=filterSchedules().filter(function(s){ return s.shootDate===selectedDate; });
  const titleHtml='<div class="list-date-title"><span>'+esc(selectedDate)+'（'+scheds.length+' 单）</span><span style="color:var(--text3);font-weight:400;font-size:12px">点＋新增当日档期</span></div>';
  const upcoming=upcomingDays();
  const undelivered=scheds.filter(function(s){return !s.delivered;}).sort(function(a,b){ return (a.arrivalTime||'').localeCompare(b.arrivalTime||'')||(a.createdAt||'').localeCompare(b.createdAt||''); });
  const delivered=scheds.filter(function(s){return s.delivered;}).sort(function(a,b){ return (b.deliveredAt||'').localeCompare(a.deliveredAt||''); });
  // 当日订单统一卡片式展示
  let html=titleHtml;
  undelivered.forEach(function(s){ html+=schedCardHTML(s, upcoming); });
  if(delivered.length){
    html+='<div class="delivered-divider">已交付 ' + delivered.length + ' 单</div>';
    delivered.forEach(function(s){ html+=schedCardHTML(s, upcoming); });
  }
  if(!scheds.length) html=titleHtml+'<div class="empty-hint"><div class="big">🗓</div>当日暂无档期，点下方＋新增</div>';
  cont.innerHTML=html;
  // 绑定事件
  cont.querySelectorAll('.s-act-share').forEach(function(b){

    const subLong=function(e){ e.preventDefault(); e.stopPropagation(); subCapture(card.dataset.id); };
    card.addEventListener('touchstart', function(){
      card.__long=setTimeout(function(){ card.__longed=true; subCapture(card.dataset.id); }, 550);
    }, {passive:true});
    card.addEventListener('touchend', function(){ clearTimeout(card.__long); setTimeout(function(){ card.__longed=false; }, 50); }, {passive:true});
    card.addEventListener('mousedown', function(){
      card.__long=setTimeout(function(){ card.__longed=true; subCapture(card.dataset.id); }, 550);
    });
    card.addEventListener('mouseup', function(){ clearTimeout(card.__long); setTimeout(function(){ card.__longed=false; }, 50); });
    card.addEventListener('mouseleave', function(){ clearTimeout(card.__long); });
    card.onclick=function(e){
      if(card.__longed){ e.stopPropagation(); return; }
      if(isMasterLike()){ openScheduleModal(card.dataset.id); return; }
      toggleSubDetail(this, card.dataset.id);
    };
    if(card.classList.contains('delivered')){
      card.ondblclick=function(){ if(isMasterLike()) restoreDelivered(card.dataset.id); };
    }

/* 长按订单卡片 / 分享按钮：生成全字段订单图片（自动折行，保证全部文字显示） */
function wrapLines(g, text, maxW){
  const chars=Array.from(String(text));
  const out=[]; let line='';
  for(let i=0;i<chars.length;i++){
    const test=line+chars[i];
    if(g.measureText(test).width>maxW && line){ out.push(line); line=chars[i]; }
    else line=test;
  }
  if(line) out.push(line);
  return out;
}
function subCapture(id){
  const s=DB.getSchedules().find(function(x){ return x.id===id; });
  if(!s) return;
  const W=750;
  const rows=[
    ['客户', s.clientName||''], ['酒店', s.hotel||''], ['厅名', s.hall||''], ['策划师', s.planner||''],
    ['人员', (s.photographer||'未排')+(s.secondPhotographer?' / '+s.secondPhotographer:'')+(s.second2Photographer?' / '+s.second2Photographer:'')],
    ['拍摄日期', s.shootDate||'未排期'],
    ['人员到场', s.arrivalTime||'—'], ['新郎抵达', s.groomArrival||'—'],
    ['下单日期', s.orderDate||'—'],
    ['拍摄对象', ((s.shootBride!==false?'拍新娘':'')+(s.shootGroom?' / 拍新郎':'')||'—')],
    ['服务项目', ((s.pickup?'接送 ':'')+(s.dualCamera?'双机 ':'')+(s.noMorningGown?'无晨袍 ':'')+(s.personConfirmed?'已指定 ':'')||'—')],
    ['金额', '总额 ¥'+(s.totalAmount||0)+'  定金 ¥'+(s.deposit||0)+'  尾款 ¥'+((s.totalAmount||0)-(s.deposit||0))]
  ];
  // 预计算每行折行数（值区宽度 = 750-40-170-20 = 520）
  const valW=520;
  const c0=document.createElement('canvas'); const g0=c0.getContext('2d'); g0.font='24px sans-serif';
  let H=190;
  const rowPlan=[];
  rows.forEach(function(r0){
    if(!r0[1]||r0[1]==='—'){ rowPlan.push(0); return; }
    const lines=wrapLines(g0, r0[1], valW);
    rowPlan.push(lines.length);
    H+=lines.length*44;
  });
  g0.font='24px sans-serif';
  const noteRaw=s.note?String(s.note).split(/\n/):[];
  const notePlan=noteRaw.map(function(l){ return wrapLines(g0, l, valW); });
  notePlan.forEach(function(ls){ H+=ls.length*40; });
  H+=30;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#fff8ef'; g.fillRect(0,0,W,H);
  g.fillStyle='#1a1a1a';
  g.font='bold 34px sans-serif'; g.fillText('喜档管家 · 订单详情', 40, 70);
  g.fillStyle='#b8860b'; g.fillRect(40, 92, 670, 3);
  g.font='16px sans-serif'; g.fillStyle='#999'; g.fillText('生成于 '+new Date().toLocaleString('zh-CN'), 40, 122);
  let y=160;
  g.font='24px sans-serif';
  rows.forEach(function(r0,ri){
    const lines=rowPlan[ri];
    if(!r0[1]||r0[1]==='—') return;
    g.fillStyle='#888'; g.font='bold 22px sans-serif'; g.fillText(r0[0], 40, y);
    g.fillStyle='#222'; g.font='24px sans-serif';
    wrapLines(g, r0[1], valW).forEach(function(l){ g.fillText(l, 170, y); y+=44; });
  });
  if(noteRaw.length){
    g.fillStyle='#888'; g.font='bold 22px sans-serif'; g.fillText('备注', 40, y);
    y+=34;
    g.fillStyle='#222'; g.font='24px sans-serif';
    notePlan.forEach(function(ls){
      ls.forEach(function(l){ g.fillText(l, 170, y); y+=40; });
    });
  }
  const img=c.toDataURL('image/png');
  const fname='喜档管家订单-'+((s.clientName||'无客户'))+'-'+(s.shootDate||'未排期')+'.png';
  let m=document.getElementById('subCaptureModal');
  if(!m){
    m=document.createElement('div'); m.id='subCaptureModal';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px';
    m.innerHTML='<img style="max-width:88%;max-height:72%;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)">'+
      '<div style="color:#fff;font-size:14px">长按图片可保存，或点击下方按钮下载</div>'+
      '<div style="display:flex;gap:10px">'+
      '<a class="subCap-dl" download="" style="background:#b8860b;color:#fff;text-decoration:none;padding:10px 22px;border-radius:10px;font-weight:700">⬇ 下载图片</a>'+
      '<button class="subCap-x" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:10px 22px;border-radius:10px">关闭</button>'+
      '</div>';
    m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
    document.body.appendChild(m);
    m.querySelector('.subCap-dl').onclick=function(e){ e.stopPropagation(); };
    m.querySelector('.subCap-x').onclick=function(){ m.remove(); };
  }
  const dl=m.querySelector('.subCap-dl');
  dl.setAttribute('href', img);
  dl.setAttribute('download', fname);
  m.querySelector('img').src=img;
  m.style.display='flex';
}

function dayOccupiedNames(dateStr, excludeId){

    if(x.photographer) names[x.photographer]=true;

}

/* 增量更新下拉选项：内容未变时只改 disabled/selected，绝不重建 innerHTML，
   避免移动端点开下拉时被重建导致列表闪退 */
function setSelectOptions(sel, options){
  const cur=sel.querySelectorAll('option');
  let same=cur.length===options.length;
  for(let i=0;i<options.length && same;i++){
    const o=cur[i];
    if(!o || o.value!==options[i].v || o.textContent!==options[i].label) same=false;
  }
  if(same){
    options.forEach(function(op,i){
      cur[i].disabled=!!op.disabled;
      cur[i].selected=!!op.selected;
    });
    return;
  }
  sel.innerHTML=options.map(function(op){
    return '<option value="'+esc(op.v)+'"'+(op.selected?' selected':'')+(op.disabled?' disabled':'')+'>'+esc(op.label)+'</option>';
  }).join('');
}
function buildPersonOptions(people, occ, excludeVals, currentVal){
  const opts=[{v:'',label:excludeVals.length?'（已选为主人员）':'未指定',disabled:false,selected:currentVal===''}];
  people.forEach(function(p){
    const busy=(occ[p]||excludeVals.indexOf(p)>=0) && p!==currentVal;
    opts.push({v:p, label:p+(busy?'（已占用）':''), disabled:busy, selected:p===currentVal});
  });
  return opts;
}

/* —— 酒店/厅/策划师 层级（目录树数据） —— */
function hotelHalls(h){
  const halls=h&&h.halls;
  if(!halls) return [];
  if(halls.length && typeof halls[0]==='string'){   // 兼容旧格式：字符串数组
    return halls.map(function(nm,i){ return {id:'hh_'+i+'_'+nm, name:nm, planners:[]}; });
  }
  return halls;
}
function hallName(hall){ return (typeof hall==='string')?hall:((hall&&hall.name)?hall.name:''); }
function hotelPlanners(h){ return (h&&h.planners&&Array.isArray(h.planners))?h.planners:[]; }
function hallPlanners(h, hName){
  const hall=hotelHalls(h).find(function(x){ return hallName(x)===hName; });
  return (hall&&Array.isArray(hall.planners))?hall.planners:[];
}
function findHotel(hotels, nm){ return hotels.find(function(x){ return hotelName(x)===nm; })||null; }
/* 联动填充：酒店 → 厅 → 策划师（datalist 可输入，选择或输入新值均可） */
function populateHotelChain(){
  const mid=getCurrentMasterId();
  const hotels=DB.getHotels(mid);
  const curHotel=$('fHotel').value;
  const curHall=$('fHall').value;
  const curPlanner=$('fPlanner').value;
  // 酒店建议
  setDatalistOptions($('fHotel'), 'dlHotel', hotels.map(function(h){ return hotelName(h); }));
  // 厅建议（当前酒店下）
  const h=findHotel(hotels, curHotel);
  const halls=hotelHalls(h);
  setDatalistOptions($('fHall'), 'dlHall', halls.map(function(x){ return hallName(x); }));
  // 策划师建议：一个酒店共用一批策划师（酒店级为主，兼容旧数据的厅级策划师）
  const allPlanners=[];
  hotelPlanners(h).forEach(function(p){ if(allPlanners.indexOf(p)<0) allPlanners.push(p); });
  hotelHalls(h).forEach(function(x){
    hallPlanners(h, hallName(x)).forEach(function(p){ if(allPlanners.indexOf(p)<0) allPlanners.push(p); });
  });
  setDatalistOptions($('fPlanner'), 'dlPlanner', allPlanners);
}
function updateBalance(){
  const total=num($('fTotal').value), dep=num($('fDeposit').value);
