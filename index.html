async function removeHall(hotelNameStr, hallNameStr){
  const ok=await confirmBox('删除厅','确定删除「'+hotelNameStr+' · '+hallNameStr+'」吗？');
  if(!ok) return;
  const mid=getCurrentMasterId(); if(!mid) return;
  const list=DB.getHotels(mid);
  const h=findHotel(list, hotelNameStr);
  if(!h) return;
  const halls=hotelHalls(h);
  const gone=halls.find(function(x){ return hallName(x)===hallNameStr; });
  // 兼容旧数据：被删厅下若有策划师，并入酒店共用策划师（一个酒店共用）
  if(gone && Array.isArray(gone.planners) && gone.planners.length){
    const ps=hotelPlanners(h).slice();
    gone.planners.forEach(function(p){ if(ps.indexOf(p)<0) ps.push(p); });
    h.planners=ps;
  }
  h.halls=halls.filter(function(x){ return hallName(x)!==hallNameStr; });
  DB.setHotels(mid, list);
  addLog('删除厅', hotelNameStr+' → '+hallNameStr);
  expandedHotels[hotelNameStr]=1;
  markDirty('hotels'); flushPush(); refreshCurrentView();

  h.halls=hotelHalls(h).map(function(x){

    const c=Object.assign({}, x);
    c.planners=c.planners.filter(function(p){ return p!==plannerName; });
    return c;
  });
  DB.setHotels(mid, list);
  addLog('删除策划师', hotelNameStr+' → '+plannerName);

function initDragSort(listId, onOrderChange){
  const list=$(listId); if(!list) return;
  let dragEl=null;
  list.querySelectorAll('[draggable="true"]').forEach(function(el){
    el.addEventListener('dragstart', function(e){ dragEl=el; e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover', function(e){ e.preventDefault(); });
    el.addEventListener('drop', function(e){
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      const items=Array.from(list.children);
      const from=items.indexOf(dragEl), to=items.indexOf(el);
      if(from<0||to<0) return;
      if(from<to) el.after(dragEl); else el.before(dragEl);
      onOrderChange();
    });
  });
  // 移动端拖拽排序：长按进入移动模式（简化：长按 600ms 后冒泡提示改用桌面端）
}

/* ============ Excel / ICS ============ */
function cell(row, idx){ return (row[idx]===undefined?'':row[idx]); }
function excelDateToStr(v){
  if(typeof v==='number'&&v>20000&&v<60000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return fmtDate(d);
  }
  const s=String(v||'');
  if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) return s.replace(/\//g,'-').slice(0,10);
  return s;
}
function exportExcel(scope){
  if(typeof XLSX==='undefined'){ toast('Excel 组件未加载','error'); return; }
  const headers=['客户','酒店','厅名','策划师','摄影师','副机位','下单日期','拍摄日期','到场时间','总额','定金','尾款','接送','双机','无晨袍','已指定','备注','交付状态'];
  let list=DB.getSchedules().slice();
  if(scope==='month'){
    const y=calYear, m=calMonth;
    list=list.filter(function(s){ return s.shootDate && s.shootDate.indexOf(y+'-'+pad(m+1))===0; });
  }
  list.sort(function(a,b){ return (a.shootDate||'').localeCompare(b.shootDate||''); });
  const rows=[headers];
  list.forEach(function(s){
    rows.push([
      s.clientName||'', s.hotel||'', s.hall||'', s.planner||'', s.photographer||'', s.secondPhotographer||'',
      s.orderDate||'', s.shootDate||'', s.arrivalTime||'', s.totalAmount||0, s.deposit||0,
      ((s.totalAmount||0)-(s.deposit||0)).toFixed(2),
      s.pickup?'是':'', s.dualCamera?'是':'', s.noMorningGown?'是':'', s.personConfirmed?'是':'',
      s.note||s.remarks||'', s.delivered?'已交付':'待拍摄'
    ]);
  });
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, '档期');
    XLSX.writeFile(wb, '喜档管家-'+(scope==='month'?(calYear+'-'+pad(calMonth+1)):'全部')+'.xlsx');
    addLog('导出Excel('+(scope==='month'?'当月':'全部')+')', list.length+' 条');
    toast('已导出 '+list.length+' 条','ok');
  }catch(e){ toast('导出失败: '+e.message,'error'); }
}
function importExcel(file){
  if(typeof XLSX==='undefined'){ toast('Excel 组件未加载','error'); return; }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length<2){ toast('表格无数据','error'); return; }
      const head=rows[0].map(function(h){ return String(h).trim(); });
      const idx={};
      ['客户','酒店','厅名','策划师','摄影师','副机位','下单日期','拍摄日期','到场时间','总额','定金','备注'].forEach(function(k){ idx[k]=head.indexOf(k); });
      if(idx['客户']<0||idx['拍摄日期']<0){ toast('表头不完整，请使用模板格式','error'); return; }
      const mid=getCurrentMasterId();
      const now=new Date().toISOString();
      const scheds=DB.getSchedules();
      let added=0, firstDate=null;
      rows.slice(1).forEach(function(r){
        const client=String(cell(r, idx['客户'])).trim();
        if(!client) return;
        const shoot=excelDateToStr(cell(r,idx['拍摄日期']));
        if(!firstDate && shoot) firstDate=shoot;
        scheds.push({
          id:uid('s'), clientName:client, hotel:String(cell(r,idx['酒店'])).trim(),
          hall:String(cell(r,idx['厅名'])).trim(), planner:String(cell(r,idx['策划师'])).trim(),
          photographer:String(cell(r,idx['摄影师'])).trim()||'', secondPhotographer:String(cell(r,idx['副机位'])).trim(),
          orderDate:excelDateToStr(cell(r,idx['下单日期'])), shootDate:shoot,
          arrivalTime:String(cell(r,idx['到场时间'])).trim(), totalAmount:num(cell(r,idx['总额'])),
          deposit:num(cell(r,idx['定金'])), note:String(cell(r,idx['备注'])).trim(),
          ownerId:mid, createdBy:currentUser.username, createdAt:now, updatedAt:now,
          delivered:false, deliveredAt:null, personConfirmed:false, noMorningGown:false, pickup:false, dualCamera:false
        });
        added++;
      });
      DB.setSchedules(scheds);
      addLog('导入Excel', added+' 条');
      // 导入后自动定位到首个拍摄日期，立即看到结果
      if(firstDate){
        const d=new Date(firstDate);
        if(!isNaN(d.getTime())){ calYear=d.getFullYear(); calMonth=d.getMonth(); selectedDate=firstDate; }
      }
      markDirty('schedules'); flushPush(); renderAll();
      toast('成功导入 '+added+' 条档期','ok');
    }catch(err){ toast('导入失败: '+err.message,'error'); }
  };
  reader.readAsArrayBuffer(file);
}
/* ---- JSON 数据库导入/导出（作为初始数据，导入后自动上传云端） ---- */
function exportDatabaseJson(){
  const mid=getCurrentMasterId();
  const data={
    app:'maodou-schedule', version:1, exportedAt:new Date().toISOString(), masterId:mid,
    schedules:DB.getSchedules().filter(function(s){ return s&&(!mid||s.ownerId===mid); }),
    users:DB.getUsers(),

    hotels:mid?DB.getHotels(mid):[],
    settings:mid?(DB.getSettings()[mid]||{}):{},
    day_settings:{},
    operation_log:mid?DB.getOpLog(mid):[]
  };
  const ds=DB.getDaySettings();
  Object.keys(ds).forEach(function(date){
    if(ds[date]&&(ds[date].masterId===mid||!ds[date].masterId)) data.day_settings[date]=ds[date];
  });
  const blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});

  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('已导出 JSON 数据库','ok');
}
function importDatabaseJson(file){

  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data||typeof data!=='object'||!Array.isArray(data.schedules)){

      const now=new Date().toISOString();
      // 档期：整体替换为本主账号数据，ownerId 归一
      const scheds=(data.schedules||[]).map(function(s,i){
        return Object.assign({}, s, {
          id:(s&&s.id)?s.id:uid('s'), ownerId:mid,
          createdAt:(s&&s.createdAt)||now, updatedAt:now
        });
      });
      DB.setSchedules(scheds);
      // 人员
      const photos=Array.isArray(data.photographers)?data.photographers:((data.photographers&&data.photographers[mid])||[]);
      DB.setPhoto(mid, photos.filter(function(n){return n&&String(n).trim();}));
      // 酒店
      let hotels=Array.isArray(data.hotels)?data.hotels:((data.hotels&&data.hotels[mid])||[]);
      if(!Array.isArray(hotels)) hotels=[];
      DB.setHotels(mid, hotels.map(function(h){ return (typeof h==='string')?{name:h, halls:[], planners:[]}:({name:h.name||'', halls:h.halls||[], planners:h.planners||[]}); }).filter(function(h){return h.name;}));
      // 设置
      const s=DB.getSettings();
      if(data.settings&&typeof data.settings==='object'){
        s[mid]=Object.assign({}, data.settings, {masterId:mid, updatedAt:now});
        DB.setSettings(s);
      }
      // 单日设置
      const ds=DB.getDaySettings();
      if(data.day_settings&&typeof data.day_settings==='object'){
        Object.keys(data.day_settings).forEach(function(date){
          ds[date]=Object.assign({}, data.day_settings[date], {date:date, masterId:mid});
        });
        DB.setDaySettings(ds);
      }
      // 操作日志
      const logs=(data.operation_log||[]).slice(0,500);
      if(logs.length) DB.setOpLog(mid, logs);
      addLog('导入JSON数据库', scheds.length+' 档期 / '+photos.length+' 人员 / '+hotels.length+' 酒店');
      // 自动定位首个拍摄日期
      const firstDate=scheds.filter(function(s){return s.shootDate;}).map(function(s){return s.shootDate;}).sort()[0];
      if(firstDate){
        const d=new Date(firstDate);
        if(!isNaN(d.getTime())){ calYear=d.getFullYear(); calMonth=d.getMonth(); selectedDate=firstDate; }
      }
      // 全部标记待推送并立即上传云端
      ['schedules','photographers','hotels','settings','day_settings','operation_log'].forEach(function(c){ markDirty(c); });
      toast('JSON 导入成功，正在上传云端…','ok');
      flushPush().then(function(){
        toast('JSON 导入完成，已上传云端','ok');
        renderAll();
      });
    }catch(err){ toast('JSON 导入失败: '+err.message,'error'); }
  };
  reader.readAsText(file, 'utf-8');
}
function exportICS(){
  const list=DB.getSchedules().filter(function(s){ return s.shootDate && !s.delivered; })
    .sort(function(a,b){ return (a.shootDate||'').localeCompare(b.shootDate||''); });
  if(!list.length){ toast('暂无待拍摄档期','error'); return; }
  function icsDate(d){ return String(d).replace(/-/g,''); }
  function icsTime(t){ return t?String(t).replace(':',''):'0900'; }
  function icsEsc(s){ return String(s||'').replace(/[,;\\\n]/g, function(c){ return '\\'+c; }); }
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//喜档管家//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(function(s){
    lines=lines.concat([
      'BEGIN:VEVENT',
      'UID:'+s.id+'@maodou',
      'DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+icsDate(s.shootDate),
      'SUMMARY:'+icsEsc(s.clientName+(s.hotel?' '+s.hotel:'')+(s.hall?' '+s.hall:'')),
      'DESCRIPTION:'+icsEsc((s.arrivalTime?'到场 '+s.arrivalTime+' ':'')+(s.note||'')),
      'END:VEVENT'
    ]);
  });
  lines.push('END:VCALENDAR');
  download('喜档管家-拍摄日程.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  addLog('导出ICS', list.length+' 条');
  toast('已导出 ICS','ok');
}

function checkReminders(){

  const inTwoDays=fmtDate(addDays(new Date(),2));

/* ============ 扫码登录（二维码 → 手机确认 → 云端联动） ============ */
let qrCode=null, qrTimer=null, qrStartAt=0, pendingScan=null;

function urlParam(name){
  const m=location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function clearUrlScan(){
  if(location.search.indexOf('scan=')>=0){
    history.replaceState(null,'',location.pathname+(location.hash||''));
  }
}
function qrLoginBase(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    return location.origin+location.pathname;
  }
  // 本地预览时使用线上地址，扫码仍可打开线上应用
  return 'https://mjz1024.github.io/maodou-schedule/index.html';
}
function startQrLogin(){
  const box=$('qrBox'), status=$('qrStatus'), hint=$('qrHint');
  if(!box) return;
  if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
  if(!cloudOK){
    box.innerHTML='<div class="qr-offline">扫码登录需先开启云端同步<br>请在 CloudBase 控制台配置「Web 安全域名」后使用</div>';
    status.textContent='离线模式：扫码登录暂不可用';
    if(hint) hint.textContent='账号密码登录不受影响';
    return;
  }
  qrCode='QR'+Math.random().toString(36).slice(2,6).toUpperCase()+Math.floor(100+Math.random()*900);
  qrStartAt=Date.now();
  try{
    const qr=qrcode(0,'M');
    qr.addData(qrLoginBase()+'?scan='+qrCode);
    qr.make();
    box.innerHTML='<img src="'+qr.createDataURL(4,8)+'" alt="扫码登录二维码">';
    status.textContent='用微信「扫一扫」打开并确认登录';
    if(hint) hint.textContent='二维码有效期 2 分钟，过期请刷新';
    qrTimer=setInterval(pollQrLogin, 2500);
  }catch(e){
    console.warn('二维码生成失败', e);
    box.innerHTML='<div class="qr-offline">二维码生成失败，请刷新重试</div>';
  }
}
async function pollQrLogin(){
  if(!cloudOK||!cloudDB){ if(qrTimer){ clearInterval(qrTimer); qrTimer=null; } return; }
  if(Date.now()-qrStartAt>120000){
    if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
    const st=$('qrStatus'); if(st) st.textContent='二维码已过期，点击「刷新」重新生成';
    return;
  }
  try{
    const res=await cloudDB.collection('sessions')
      .where({type:'qr_login', code:qrCode, status:'confirmed'}).limit(1).get();
    const d=(res&&res.data&&res.data[0]);
    if(d&&d.userId){
      if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
      const st=$('qrStatus'); if(st) st.textContent='扫码确认成功，正在登录…';
      try{ await cloudDB.collection('sessions').doc(d._id).remove(); }catch(e){}
      await doQrLoginUser(d.userId);
    }
  }catch(e){ /* 轮询瞬时错误忽略 */ }
}
/* 记录登录统计：上次登录时间 + 本月登录次数 + 总访问次数 */
function recordUserLogin(user){
  const iso=new Date().toISOString();
  const month=iso.slice(0,7);
  user.lastLoginAt=iso;
  if(user.loginMonth!==month){ user.loginMonth=month; user.monthLogins=1; }
  else{ user.monthLogins=(user.monthLogins||0)+1; }
  user.visitCount=(user.visitCount||0)+1;
}
async function doQrLoginUser(userId){
  try{
    if(cloudOK && navigator.onLine){ await pullAllToLocal(true); }
    const user=DB.getUsers().find(function(u){ return u.id===userId; });
    if(!user){ toast('未找到该账号，请刷新后重试','error'); startQrLogin(); return; }
    DB.setUsers(DB.getUsers());
    markDirty('users');
    await flushPush();
    await loginComplete(user);
    toast('扫码登录成功','ok');
  }catch(e){
    console.warn(e);
    toast('扫码登录异常：'+e.message,'error');
    startQrLogin();
  }
}
/* 手机端：确认扫码登录 */
function checkPendingScan(){
  const code=urlParam('scan');
  if(!code) return;
  pendingScan=code;
  if(currentUser) showQrConfirm(code);
}
async function showQrConfirm(code){
  const u=currentUser;

    toast('云端同步未开启，无法确认扫码','error');

      toast('确认失败：'+e.message,'error');

/* 登录后公共流程：写会话 → 云端补拉补推 → 进入主界面 */
async function loginComplete(user){
  currentUser=user;
  renderHeaderUser();
  DB.setSession({
    id:uid('sess'),
    currentUser:{id:user.id, username:user.username, nickname:user.nickname, role:user.role},
    token:'tk_'+Math.random().toString(36).slice(2,14),
    loginTime:new Date().toISOString()
  });
  // 记录多端登录会话
  const sessions=DB.getSessions();
  sessions.push({
    id:uid('sess2'), username:user.username, nickname:user.nickname||user.username,
    role:user.role, deviceId:DB.getDeviceId(), loginTime:new Date().toISOString()
  });
  DB.setSessions(sessions);
  markDirty('sessions');
  // 登录后再拉取一次并补推（云端为真相源）
  let statRecorded=false;
  if(cloudOK && navigator.onLine){
    // 清理初始化时可能残留的空集合标记，确保登录即拉取最新数据
    // （档期、人员、酒店、账号、设置、广场等全部集合，云端为真相源，本地独有数据保留）
    ['schedules','day_settings','operation_log','photographers','hotels','users','settings','plaza_topics','plaza_comments','sessions'].forEach(function(n){ dirty.delete(n); });
    await pullAllToLocal(true);
    await pushAllCollections();
    // 重新解析当前用户（云端可能更新了用户数据）
    currentUser=DB.getUsers().find(function(u2){ return u2.id===user.id; })||user;
    // 登录统计（拉取合并完成后记录，避免被云端旧数据覆盖；随后推送云端）
    recordUserLogin(currentUser); statRecorded=true;
    DB.setUsers(DB.getUsers());
    markDirty('users');
    try{ await flushPush(); }catch(e){}
    // 唯一在线改：同账号最多 3 台设备同时在线（新增在线记录；被挤出的旧设备自行检测退出）
    try{
      await cloudDB.collection('sessions').add({
        type:'online', userId:user.id, username:user.username,
        deviceId:DB.getDeviceId(), deviceName:getDeviceName(), loginAt:new Date().toISOString()
      });
      myLoginStamp=new Date().toISOString();
    }catch(e){ console.warn('[cloud] 在线登记失败', e); }
  }
  // 离线登录也记录登录统计
  if(!statRecorded && currentUser){
    recordUserLogin(currentUser);
    DB.setUsers(DB.getUsers());
    markDirty('users'); schedulePush();
  }
  ensureSettingsShape();
  // 初始化日历到当前月
  const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
  selectedDate=null;
  activeTab='schedule'; activeTopicId=null;
  hide('authPage'); show('mainApp');
  switchTab('schedule');
  renderAll();
  refreshPhotographerFilter();
  toast('欢迎，'+(currentUser.nickname||currentUser.username));
  // 扫码登录：手机端打开带 scan 参数的链接时，登录后立即进入确认
  checkPendingScan();
}

    vr.addEventListener('touchcancel', vrEnd);
  }
  // 评论媒体
  $('commentImg').addEventListener('change', function(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    if(!checkMediaSize(f,'图片')){ e.target.value=''; return; }
    commentMedia.img=f;
    const mi=$('commentMediaInfo'); if(mi) mi.textContent='📷 '+f.name;
  });
  const cvb=$('commentVoiceBtn');
  if(cvb){
    cvb.addEventListener('click', function(){
      if(commentMedia.voice){ commentMedia.voice=null; cvb.textContent='🎤 语音留言'; const mi=$('commentMediaInfo'); if(mi) mi.textContent=''; return; }
      startVoiceRecord(function(file,size){
        commentMedia.voice=file;
        cvb.textContent='🎤 已录 '+Math.round(size/1024)+'KB（再点取消）';
      });
    });
  }

  // 档期表单
  $('fBride').addEventListener('change', function(){ if($('fBride').checked) $('fGroom').checked=false; });
  $('fGroom').addEventListener('change', function(){ if($('fGroom').checked) $('fBride').checked=false; });
  $('fTotal').addEventListener('input', updateBalance);
  $('fDeposit').addEventListener('input', updateBalance);
  $('fShootDate').addEventListener('change', function(){ populateMainSelect(); populateSecondSelect(); });
  $('fPhotographer').addEventListener('input', function(){ renderPhotoPop($('fPhotographer').value); populateSecondSelect(); });
  $('fPhotographer').addEventListener('focus', function(){ renderPhotoPop(''); });
  $('fPhotographer').addEventListener('blur', function(){ setTimeout(function(){ const p=$('photoPop'); if(p) p.hidden=true; }, 180); });
  $('fSecond').addEventListener('input', function(){ renderSecondPop($('fSecond').value); populateMainSelect(); });
  $('fSecond').addEventListener('focus', function(){ renderSecondPop(''); });
  $('fSecond').addEventListener('blur', function(){ setTimeout(function(){ const p=$('secondPop'); if(p) p.hidden=true; }, 180); });
  $('fHotel').addEventListener('input', function(){ populateHotelChain(); });
  $('fHotel').addEventListener('change', function(){ if($('fHall').value||$('fPlanner').value){ $('fHall').value=''; $('fPlanner').value=''; } populateHotelChain(); });
  $('fHall').addEventListener('input', function(){ populateHotelChain(); });
  $('fabAddBtn').onclick=function(){ if(isMasterLike()) openScheduleModal(null); else toast('子账号仅可查看档期','error'); };
  $('upcomingBtn').onclick=openUpcomingModal;
  $('scheduleSaveBtn').onclick=saveSchedule;

  // 弹窗关闭
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.onclick=function(){ closeModal(b.dataset.close); };
  });
  document.querySelectorAll('.modal-mask').forEach(function(mask){
    mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(mask.id); });
  });

  // 跨标签页同步
  window.addEventListener('storage', function(e){
    if(e.key && e.key.indexOf('ps_')===0 && e.key!=='ps_session'){
      if(!modalOpen){ renderAll(); if(activeTab==='schedule') refreshPhotographerFilter(); }
    }
  });
  // 切回前台拉取
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && cloudOK && navigator.onLine){
      (async function(){ await pullAllToLocal(false); if(!modalOpen) renderAll(); })();
    }
  });
  // 恢复在线
  window.addEventListener('online', function(){
    if(cloudOK){
      (async function(){
        await pullAllToLocal(true);
        await pushAllCollections();
        renderAll();
        setSyncState('on');
        toast('网络已恢复，数据已同步','ok');
      })();
    }
  });
  window.addEventListener('offline', function(){ setSyncState('off'); toast('当前离线，修改将在联网后自动同步','error'); });
  // 系统主题变化（跟随系统）
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ loadTheme(); });
  }
}

async function boot(){
  bindEvents();
  setSyncState('busy');
  const hasCloud=await initCloud();
  if(!hasCloud) setSyncState('off');
  ensureSettingsShape();
  // 扫码或打开网址后默认未登录：清除历史会话，一律展示登录页（登录后才进入首页）
  DB.setSession(null);
  show('authPage');
  startQrLogin();         // 登录页展示扫码登录二维码
  if(hasCloud){ startHeartbeat(); startReminderLoop(); }
  checkPendingScan();     // 未登录也记录 scan 参数，登录后确认
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
