function autoCategorizeInputs(mid){
  const hotelVal=$('fHotel').value.trim();
  const hallVal=$('fHall').value.trim();
  const plannerVal=$('fPlanner').value.trim();
  const mainVal=$('fPhotographer').value.trim();
  const secondVal=$('fSecond').value.trim();
  const second2Val=$('fSecond2').value.trim();
  // 1) 人员库（统一人员表）
  const people=DB.getPhoto(mid||'_default').slice().filter(function(p){return String(p).indexOf('喜玛拾光')<0;});
  let pChanged=false;
  [mainVal, secondVal, second2Val].forEach(function(nm){
    if(nm && people.indexOf(nm)<0){ people.push(nm); pChanged=true; }
  });
  if(pChanged){ DB.setPhoto(mid, people); markDirty('photographers'); }
  // 2) 酒店目录树
  if(!hotelVal) return;
  const hotels=DB.getHotels(mid).slice();
  let h=findHotel(hotels, hotelVal);
  if(!h){ h={name:hotelVal, halls:[], planners:[]}; hotels.push(h); }
  let hChanged=false;
  if(hallVal){
    let hall=hotelHalls(h).find(function(x){ return hallName(x)===hallVal; });
    if(!hall){
      h.halls.push({id:'hh_'+Date.now()+'_'+hallVal, name:hallVal, planners:[]});
      hChanged=true;
    }
    if(plannerVal && hotelPlanners(h).indexOf(plannerVal)<0){ h.planners.push(plannerVal); hChanged=true; }
  } else if(plannerVal && hotelPlanners(h).indexOf(plannerVal)<0){
    h.planners.push(plannerVal); hChanged=true;
  }
  if(hChanged){ DB.setHotels(mid, hotels); markDirty('hotels'); }
}

  markDirty('schedules');

  function cloudPushSingle(col0, body0, retry){
    window.__errs=window.__errs||[];
    col0.add(body0).then(function(res){ window.__errs.push({t:'add-ok', at:new Date().toISOString().slice(11,19)}); }).catch(function(e){
      window.__errs.push({t:'add-fail', msg:String(e&&e.message||e).slice(0,120), retry:retry, at:new Date().toISOString().slice(11,19)});
      if(retry>0){ setTimeout(function(){ cloudPushSingle(col0, body0, retry-1); }, 4000); }
    });
  }
  if(cloudOK && cloudDB){
    const mid2=getCurrentMasterId();
    const sid=editingScheduleId||(DB.getSchedules().length? (DB.getSchedules()[DB.getSchedules().length-1]||{}).id:'');
    const s3=DB.getSchedules().find(function(x){ return x&&x.id===sid; });

      const b=Object.assign({}, s3, cloudMeta());

         同 id 多份文档由拉取合并 mergeById 按 _syncAt 取最新，保证读到最新数据 */
      cloudPushSingle(cloudDB.collection('schedules'), b, 5);
    }
  }
  flushPush();
  renderAll();
  closeModal('scheduleModal');
  toast('已保存并同步到云端','ok');
}

function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const max=256; let w=img.width, h=img.height;
      if(w>max||h>max){ const r=Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){ cb(e.target.result); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  if(MEDIA_OFF && (file.type||'').indexOf('image/')===0){ toast('图片上传已临时关闭','ok'); return null; }
  if(cloudAvailable()){
    try{
      const ext=(file.name||'f').split('.').pop()||'bin';
      const cloudPath='plaza/'+prefix+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const up=await cloudApp.uploadFile({cloudPath:cloudPath, filePath:file});
      if(up&&up.fileID) return {kind:'cloud', url:up.fileID, name:file.name||'', size:file.size};
    }catch(e){ console.warn('云存储上传失败',e); }
  }
  return new Promise(function(resolve){
    const reader=new FileReader();
    reader.onload=function(){ resolve({kind:'local', url:reader.result, name:file.name||'', size:file.size}); };
    reader.onerror=function(){ resolve(null); };
    reader.readAsDataURL(file);
  });
}
async function resolveTempUrls(items){
  const cloudOnes=(items||[]).filter(function(x){return x&&x.url&&x.url.indexOf('cloud://')===0;});
  if(!cloudOnes.length) return;
  try{
    const res=await cloudApp.getTempFileURL({fileList:cloudOnes.map(function(x){return x.url;})});
    (res.fileList||[]).forEach(function(f){
      if(f.fileID&&f.tempFileURL){
        const it=cloudOnes.find(function(x){return x.url===f.fileID;});
        if(it) it.tempUrl=f.tempFileURL;
      }
    });
  }catch(e){ console.warn('获取媒体URL失败',e); }
}
function mediaUrl(m){
  if(!m) return '';
  if(m.tempUrl) return m.tempUrl;
  if(m.url&&m.url.indexOf('cloud://')!==0) return m.url;
  return '';
}

function isImageMedia(m){
  return m&&(m.kind==='image'||(m.type||'').indexOf('image/')===0||(m.url||'').match(/\.(png|jpe?g|gif|webp)(\?|$)/i));
}
function mediaBlockHtml(m){

/* ---- 语音录制 ---- */
let plazaRec=null, plazaRecChunks=[], plazaRecStream=null;
function startVoiceRecord(onDone){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    toast('当前浏览器不支持录音','error'); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    plazaRecStream=stream;
    plazaRecChunks=[];
    plazaRec=new MediaRecorder(stream);
    plazaRec.ondataavailable=function(e){ if(e.data&&e.data.size) plazaRecChunks.push(e.data); };
    plazaRec.onstop=function(){
      try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
      const type=(plazaRec.mimeType||'audio/webm').split(';')[0];
      const blob=new Blob(plazaRecChunks, {type:type});
      onDone(new File([blob], 'voice_'+Date.now()+'.webm', {type:type}), blob.size);
    };
    plazaRec.start();
  }).catch(function(e){ toast('无法访问麦克风：'+(e&&e.message||e),'error'); });
}
function stopVoiceRecord(){
  if(plazaRec&&plazaRec.state!=='inactive'){ try{ plazaRec.stop(); }catch(e){} }
}

async function submitTopic(){
  const title=$('topicTitle').value.trim();
  const content=$('topicContent').value.trim();
  const catSel=document.querySelector('input[name="topicCat"]:checked');
  const cat=catSel?catSel.value:'photo';
  if(!title){ toast('请填写标题','error'); return; }
  if(!content&&!topicMedia.imgs.length&&!topicMedia.audio&&!topicMedia.voice){ toast('请填写内容或添加媒体','error'); return; }
  const chk=checkIllegalContent(title+' '+content);
  if(!chk.ok){ toast('内容包含禁止的文字「'+chk.word+'」，请修改后发布','error'); return; }
  const okD=await confirmBox('发布免责声明', DISCLAIMER_TEXT);
  if(!okD){ toast('已取消发布','ok'); return; }
  const btn=$('topicSubmitBtn');
  if(btn) btn.disabled=true;
  const t={
    id:uid('pt'), title:title, content:content, category:cat,
    images:[], audio:null, voice:null,
    authorId:currentUser.id, authorUsername:currentUser.username,
    authorName:currentUser.nickname||currentUser.username,
    authorAvatar:currentUser.avatar||'',
    authorRole:currentUser.role,
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  for(let i=0;i<topicMedia.imgs.length;i++){
    const m=await uploadMedia(topicMedia.imgs[i],'img');
    if(m) t.images.push(Object.assign({kind:'image', type:'image'}, m));
  }
  if(topicMedia.audio){
    const m=await uploadMedia(topicMedia.audio,'audio');
    if(m) t.audio=Object.assign({kind:'audio', type:'audio'}, m);
  }
  if(topicMedia.voice){
    const m=await uploadMedia(topicMedia.voice,'voice');
    if(m) t.voice=Object.assign({kind:'audio', type:'audio'}, m);
  }
  const list=DB.getPlazaTopics();
  list.push(t);
  DB.setPlazaTopics(list);
  markDirty('plaza_topics');
  await flushPush();
  resetTopicMedia();
  closeModal('newTopicModal');
  activeTopicId=t.id;
  hide('plazaListView'); show('plazaDetailView');
  renderTopicDetail(t.id);
  if(btn) btn.disabled=false;
  toast('主题已发布','ok');
}

async function submitComment(){

  };

async function deleteTopic(id){
  const t=DB.getPlazaTopics().find(function(x){return x.id===id;});
  if(!t||!canDeletePlaza(t)) return;
  const ok=await confirmBox('删除主题','确定删除主题「'+t.title+'」及其全部评论吗？');
  if(!ok) return;
  DB.setPlazaTopics(DB.getPlazaTopics().filter(function(x){return x.id!==id;}));
  DB.setPlazaComments(DB.getPlazaComments().filter(function(c){return c.topicId!==id;}));
  addLog('删除广场主题', t.title);
  markDirty('plaza_topics'); markDirty('plaza_comments');
  cloudRemoveByField('plaza_topics','id',id);
  cloudRemoveByField('plaza_comments','topicId',id);
  flushPush();
  if(activeTopicId===id){ activeTopicId=null; show('plazaListView'); hide('plazaDetailView'); }
  renderPlaza();
  toast('已删除','ok');
}
async function deleteComment(cid){
  const c=DB.getPlazaComments().find(function(x){return x.id===cid;});
  if(!c||!canDeletePlaza(c)) return;
  const ok=await confirmBox('删除评论','确定删除这条评论吗？');
  if(!ok) return;
  DB.setPlazaComments(DB.getPlazaComments().filter(function(x){return x.id!==cid;}));
  markDirty('plaza_comments');
  cloudRemoveByField('plaza_comments','id',cid);
  flushPush();
  renderTopicDetail(activeTopicId);
  toast('已删除','ok');
}

function getDeviceName(){
  const ua=(navigator.userAgent||'');
  let n='浏览器';
  if(/MicroMessenger/i.test(ua)) n='微信';
  else if(/iPhone|iPad/i.test(ua)) n='iPhone';
  else if(/Android/i.test(ua)) n='Android';
  else if(/Macintosh|Mac OS X/i.test(ua)) n='Mac';
  else if(/Windows/i.test(ua)) n='Windows';
  return n;
}
/* ===== 强制更新：云端 app_versions 集合 + 超管发布版本 ===== */
function cmpVer(a,b){
  const pa=(a||'').toString().replace(/^v/i,'').split('.').map(function(x){ return parseInt(x)||0; });
  const pb=(b||'').toString().replace(/^v/i,'').split('.').map(function(x){ return parseInt(x)||0; });
  for(let i=0;i<3;i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x>y?1:-1; }
  return 0;
}
function platformOf(){
  const ua=(navigator.userAgent||'');
  if(/MicroMessenger/i.test(ua)) return 'wx';
  if(/Android/i.test(ua)) return 'android';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Windows/i.test(ua)) return 'win';
  if(/Macintosh|Mac OS X/i.test(ua)) return 'mac';
  return 'web';
}
function platformNameOf(){ const p=platformOf(); return {wx:'微信小程序',android:'安卓',ios:'iOS',win:'Windows',mac:'Mac',web:'网页版'}[p]||'网页版'; }
async function readLatestVersion(){
  try{
    if(!cloudDB) return null;
    const res=await cloudDB.collection('settings').where({type:'version'}).orderBy('publishedAt','desc').limit(1).get();
    const list=res && res.data;
    return (list && list[0]) || null;
  }catch(e){ return null; }
}
async function checkAppUpdate(){
  try{
    const v=await readLatestVersion();
    if(!v || !v.appVersion) return;
    if(cmpVer(v.appVersion, APP_RELEASE)<=0) return;
    // 强制规则：①超管勾选强制 ②超管设的最低版本高于当前 ③落后≥2个次版本自动强制
    const segs=function(x){ const p=(x||'').toString().replace(/^v/i,'').split('.'); return [parseInt(p[0])||0, parseInt(p[1])||0]; };
    const a=segs(v.appVersion), b=segs(APP_RELEASE);
    const behind=(a[0]-b[0])*10+(a[1]-b[1]);
    const force = v.force===true || (v.minVersion && cmpVer(v.minVersion, APP_RELEASE)>0) || behind>=2;
    showUpdateDialog(v, force);
  }catch(e){}
}
function updateUrlFor(v){
  const p=platformOf();
  const u=(v&&v.urls)||{};
  if(p==='android' && u.android) return u.android;
  if(p==='ios' && u.ios) return u.ios;
  if(p==='win' && u.win) return u.win;
  if(p==='mac' && u.mac) return u.mac;
  if(u.web) return u.web;
  return u.android||u.win||u.mac||u.web||'';
}

/* 超管修改任意账号（主/子）：用户名 / 昵称 / 密码 */
function superEditUser(id){
  const u=DB.getUsers().find(function(x){ return x.id===id; });
  if(!u) return;
  const un=window.prompt('修改用户名（留空保持不变）', u.username);
  if(un===null) return;
  const nk=window.prompt('修改昵称（留空保持不变）', u.nickname||u.username);
  if(nk===null) return;
  const pw=window.prompt('修改登录密码（留空保持不变）', '');
  if(pw===null) return;
  const users=DB.getUsers();
  const i=users.findIndex(function(x){ return x.id===id; });
  if(i<0) return;
  const un2=(un||'').trim(), nk2=(nk||'').trim(), pw2=(pw||'').trim();
  if(un2 && un2!==u.username && users.some(function(x){ return x.username===un2 && x.id!==id; })){ toast('用户名已存在','error'); return; }
  const nu=Object.assign({}, users[i]);
  if(un2) nu.username=un2;
  if(nk2) nu.nickname=nk2;
  if(pw2) nu.password=pw2;
  nu.updatedAt=new Date().toISOString();

async function deleteSubAccount(id){
  const sub=DB.getUsers().find(function(x){return x.id===id;});

  const ok=await confirmBox('删除子账号','确定删除子账号「'+(sub.nickname||sub.username)+'」吗？');

  markDirty('users');
  cloudRemoveByField('users','id',id);
  await removeUserNestedCloud(id, sub.username);   // 彻底清理云端旧格式嵌套残留，防止删除后重复出现
  await cloudMarkDeletedUser(id);                  // 写入删除标记，防止跨身份残留被拉取复活
  flushPush(); refreshCurrentView();
  toast('已删除','ok');

/* 云端写入删除标记（add 新文档，当前身份可写）；拉取时按标记过滤该 id 所有文档，防止跨身份残留复活 */
async function cloudMarkDeletedUser(id){
  if(!cloudOK||!cloudDB) return;
  try{
    await cloudDB.collection('users').add({
      id:id, _deleted:true, _deletedAt:new Date().toISOString(), _syncAt:new Date().toISOString()
    });
  }catch(e){ console.warn('[cloud] 写入删除标记失败', e); }
}
/* 删除云端 users 集合中旧格式嵌套文档（{data:[...]}）内含该账号的记录 */
async function removeUserNestedCloud(id, username){
  if(!cloudOK||!cloudDB) return;
  try{
    const res=await cloudDB.collection('users').limit(1000).get();
    for(const d of (res.data||[])){
      if(d && Array.isArray(d.data) && !d.id){
        const has=d.data.some(function(u){ return u && (u.id===id||u.username===username); });
        if(has){ await cloudDB.collection('users').doc(d._id).remove().catch(function(){}); }
      }
    }
  }catch(e){ console.warn('[cloud] 清理子账号嵌套残留失败', e); }
}

function initDragSort(listId, onOrderChange){
  const list=$(listId); if(!list) return;
  let dragEl=null;
  list.querySelectorAll('[draggable="true"]').forEach(function(el){
    el.addEventListener('dragstart', function(e){ dragEl=el; e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover', function(e){ e.preventDefault(); });
    el.addEventListener('drop', function(e){
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      const items=Array.from(list.children);
      const from=items.indexOf(dragEl), to=items.indexOf(el);
      if(from<0||to<0) return;
      if(from<to) el.after(dragEl); else el.before(dragEl);
      onOrderChange();
    });
  });
  // 移动端拖拽排序：长按进入移动模式（简化：长按 600ms 后冒泡提示改用桌面端）
}

function cell(row, idx){ return (row[idx]===undefined?'':row[idx]); }
function excelDateToStr(v){
  if(typeof v==='number'&&v>20000&&v<60000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return fmtDate(d);
  }
  const s=String(v||'');
  if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) return s.replace(/\//g,'-').slice(0,10);
  return s;
}

function exportICS(){
  const list=DB.getSchedules().filter(function(s){ return s.shootDate && !s.delivered; })
    .sort(function(a,b){ return (a.shootDate||'').localeCompare(b.shootDate||''); });
  if(!list.length){ toast('暂无待拍摄档期','error'); return; }
  function icsDate(d){ return String(d).replace(/-/g,''); }
  function icsTime(t){ return t?String(t).replace(':',''):'0900'; }
  function icsEsc(s){ return String(s||'').replace(/[,;\\\n]/g, function(c){ return '\\'+c; }); }
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//喜档管家//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(function(s){
    lines=lines.concat([
      'BEGIN:VEVENT',
      'UID:'+s.id+'@maodou',
      'DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+icsDate(s.shootDate),
      'SUMMARY:'+icsEsc(s.clientName+(s.hotel?' '+s.hotel:'')+(s.hall?' '+s.hall:'')),
      'DESCRIPTION:'+icsEsc((s.arrivalTime?'到场 '+s.arrivalTime+' ':'')+(s.note||'')),
      'END:VEVENT'
    ]);
  });
  lines.push('END:VCALENDAR');
  download('喜档管家-拍摄日程.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  addLog('导出ICS', list.length+' 条');
  toast('已导出 ICS','ok');
}

async function handleLogin(){
  const username=val('loginUsername').trim();
  const password=val('loginPassword');
  if(!username||!password){ toast('请输入用户名和密码','error'); return; }
  const btn=$('loginBtn');
  btn.disabled=true; btn.textContent='登录中…';
  try{
    let user=null;
    // ① 云端快速校验：单条查询，不再等全量拉取
    if(cloudOK && navigator.onLine){
      try{
        const r=await cloudDB.collection('users').where({username:username}).limit(1).get();
        const d=(r&&r.data&&r.data[0]);
        if(d && d._deleted){ toast('该账号已被删除','error'); return; }
        if(d){
          if(d.password===password){
            user={id:d.id, username:d.username, password:d.password, nickname:d.nickname||d.username, role:d.role||'master', phone:d.phone||'', createdAt:d.createdAt||new Date().toISOString(), visitCount:d.visitCount||1, ownerId:d.ownerId||null};
            const users=DB.getUsers();
            const i=users.findIndex(function(u){ return u.id===d.id; });
            if(i>=0) users[i]=Object.assign({}, users[i], user); else users.push(user);
            DB.setUsers(users); markDirty('users');
          }else{ toast('用户名或密码错误','error'); return; }
        }
      }catch(e){ console.warn('[cloud] 快速校验失败，走本地兜底', e); }
    }
    // ② 本地校验兜底（离线或云端未命中）
    if(!user){
      const users=DB.getUsers();
      const lu=users.find(function(u){ return u.username===username; });
      if(lu){
        if(lu._deleted){ toast('该账号已被删除','error'); return; }
        if(lu.password!==password){ toast('用户名或密码错误','error'); return; }
        user=lu;
        // 老账号本地登录成功：补字段并标记 users 脏，让 flushPush 推到云端
        if(!user.createdAt) user.createdAt=new Date().toISOString();
        user.visitCount=(user.visitCount||0)+1;
        const i=users.findIndex(function(u){ return u.id===user.id; });
        if(i>=0) users[i]=user; else users.push(user);
        DB.setUsers(users); markDirty('users');
      }
    }
    // ②.5 云端快速校验失败时，拉取 users 集合再校验一次（防止老用户被误判为新账号）
    if(!user && cloudOK && navigator.onLine){
      try{
        const usersD=await getAllDocs('users');
        const found=usersD.find(function(x){ return x&&x.username===username; });
        if(found){
          if(found._deleted){ toast('该账号已被删除','error'); return; }
          if(found.password===password){
            user={id:found.id, username:found.username, password:found.password, nickname:found.nickname||found.username, role:found.role||'master', phone:found.phone||'', createdAt:found.createdAt||new Date().toISOString(), visitCount:found.visitCount||1, ownerId:found.ownerId||null};
            const users=DB.getUsers();
            const i=users.findIndex(function(u){ return u.id===found.id; });
            if(i>=0) users[i]=Object.assign({}, users[i], user); else users.push(user);
            DB.setUsers(users); markDirty('users');
          }else{ toast('用户名或密码错误','error'); return; }
        }
      }catch(e){ console.warn('[cloud] 登录重试校验失败', e); }
    }
    // ③ 新用户名 → 自动注册（需用户确认后进入）
    if(!user){
      // 在线时最后再查一次云端，防止网络抖动把同名老用户误注册成新账号
      if(cloudOK && navigator.onLine){
        try{
          const recheck=await cloudDB.collection('users').where({username:username}).limit(1).get();
          const cd=(recheck&&recheck.data&&recheck.data[0]);
          if(cd){
            if(cd._deleted){ toast('该账号已被删除','error'); return; }
            if(cd.password===password){ toast('账号密码正确，请重新登录','error'); return; }
            toast('用户名或密码错误','error'); return;
          }

/* ============ 扫码登录（二维码 → 手机确认 → 云端联动） ============ */
let qrCode=null, qrTimer=null, qrStartAt=0, pendingScan=null;

function urlParam(name){
  const m=location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));
  return m?decodeURIComponent(m[1]):null;
}
function clearUrlScan(){
  if(location.search.indexOf('scan=')>=0){
    history.replaceState(null,'',location.pathname+(location.hash||''));
  }
}
function qrLoginBase(){
  if(location.protocol==='http:'||location.protocol==='https:'){
    return location.origin+location.pathname;
  }
  // 本地预览时使用线上地址，扫码仍可打开线上应用
  return 'https://mjz1024.github.io/maodou-schedule/index.html';
}
function startQrLogin(){
  const box=$('qrBox'), status=$('qrStatus'), hint=$('qrHint');
  if(!box) return;
  if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
  if(!cloudOK){
    box.innerHTML='<div class="qr-offline">扫码登录需先开启云端同步<br>请在 CloudBase 控制台配置「Web 安全域名」后使用</div>';
    status.textContent='离线模式：扫码登录暂不可用';
    if(hint) hint.textContent='账号密码登录不受影响';
    return;
  }
  qrCode='QR'+Math.random().toString(36).slice(2,6).toUpperCase()+Math.floor(100+Math.random()*900);
  qrStartAt=Date.now();
  try{
    const qr=qrcode(0,'M');
    qr.addData(qrLoginBase()+'?scan='+qrCode);
    qr.make();
    box.innerHTML='<img src="'+qr.createDataURL(4,8)+'" alt="扫码登录二维码">';
    status.textContent='用微信「扫一扫」打开并确认登录';
    if(hint) hint.textContent='二维码有效期 2 分钟，过期请刷新';
    qrTimer=setInterval(pollQrLogin, 2500);
  }catch(e){
    console.warn('二维码生成失败', e);
    box.innerHTML='<div class="qr-offline">二维码生成失败，请刷新重试</div>';
  }
}
async function pollQrLogin(){
  if(!cloudOK||!cloudDB){ if(qrTimer){ clearInterval(qrTimer); qrTimer=null; } return; }
  if(Date.now()-qrStartAt>120000){
    if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
    const st=$('qrStatus'); if(st) st.textContent='二维码已过期，点击「刷新」重新生成';
    return;
  }
  try{
    const res=await cloudDB.collection('sessions')
      .where({type:'qr_login', code:qrCode, status:'confirmed'}).limit(1).get();
    const d=(res&&res.data&&res.data[0]);
    if(d&&d.userId){
      if(qrTimer){ clearInterval(qrTimer); qrTimer=null; }
      const st=$('qrStatus'); if(st) st.textContent='扫码确认成功，正在登录…';
      try{ await cloudDB.collection('sessions').doc(d._id).remove(); }catch(e){}
      await doQrLoginUser(d.userId);
    }
  }catch(e){ /* 轮询瞬时错误忽略 */ }
}
/* 记录登录统计：上次登录时间 + 本月登录次数 + 总访问次数 */
function recordUserLogin(user){
  const iso=new Date().toISOString();
  const month=iso.slice(0,7);
  user.lastLoginAt=iso;
  if(user.loginMonth!==month){ user.loginMonth=month; user.monthLogins=1; }
  else{ user.monthLogins=(user.monthLogins||0)+1; }
  user.visitCount=(user.visitCount||0)+1;
}
async function doQrLoginUser(userId){
  try{
    if(cloudOK && navigator.onLine){ await pullAllToLocal(true); }
    const user=DB.getUsers().find(function(u){ return u.id===userId; });
    if(!user){ toast('未找到该账号，请刷新后重试','error'); startQrLogin(); return; }
    DB.setUsers(DB.getUsers());
    markDirty('users');
    await flushPush();
    await loginComplete(user);
    toast('扫码登录成功','ok');
  }catch(e){
    console.warn(e);
    toast('扫码登录异常：'+e.message,'error');
    startQrLogin();
  }
}
/* 手机端：确认扫码登录 */
function checkPendingScan(){
  const code=urlParam('scan');
  if(!code) return;
  pendingScan=code;
  if(currentUser) showQrConfirm(code);
}
async function showQrConfirm(code){
  const u=currentUser;
  if(!u){ return; }
  if(!cloudOK){
    toast('云端同步未开启，无法确认扫码','error');
    clearUrlScan();
    return;
  }
  const ok=await confirmBox('扫码登录确认', (u.nickname||u.username)+'（'+roleName(u.role)+'）正在另一台设备请求登录，是否确认？');
  if(ok){
    try{
      await cloudDB.collection('sessions').add({type:'qr_login', code:code, userId:u.id, status:'confirmed', at:new Date().toISOString()});
      toast('已确认，对方设备即将登录','ok');
    }catch(e){
      toast('确认失败：'+e.message,'error');
    }
  }else{
    toast('已取消扫码登录','');
  }
  clearUrlScan();
}
/* 登录后公共流程：写会话 → 云端补拉补推 → 进入主界面 */
async function loginComplete(user, opts){
  opts=opts||{};
  currentUser=user;
  renderHeaderUser();
  DB.setSession({
    id:uid('sess'),
    currentUser:{id:user.id, username:user.username, nickname:user.nickname, role:user.role},
    token:'tk_'+Math.random().toString(36).slice(2,14),
    loginTime:new Date().toISOString()
  });
  // 记录多端登录会话
  const sessions=DB.getSessions();
  sessions.push({
    id:uid('sess2'), username:user.username, nickname:user.nickname||user.username,
    role:user.role, deviceId:DB.getDeviceId(), loginTime:new Date().toISOString()
  });
  DB.setSessions(sessions);
  markDirty('sessions');
  ensureSettingsShape();
  // 初始化日历到当前月
  const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
  selectedDate=null;
  activeTab='schedule'; activeTopicId=null;
  hide('authPage'); show('mainApp');
  switchTab('schedule');
  renderAll();
  refreshPhotographerFilter();
  if(!opts.silent) toast('欢迎，'+(currentUser.nickname||currentUser.username));
  // 扫码登录：手机端打开带 scan 参数的链接时，登录后立即进入确认
  checkPendingScan();
  // 云端在线：先登录成功，后台异步同步 + 顶部进度条
  if(cloudOK && navigator.onLine){ syncCloudAfterLogin(user); }
  else{
    recordUserLogin(currentUser);
    DB.setUsers(DB.getUsers());
    markDirty('users'); schedulePush();
  }
}
/* 登录后数据加载进度条 */
function showLoadBar(pct,text){
  const bar=$('dataLoadBar'); if(!bar) return;
  const fill=$('dataLoadFill'), tx=$('dataLoadText');
  bar.classList.remove('hidden');
  if(fill) fill.style.width=Math.max(0,Math.min(100,pct))+'%';
  if(tx) tx.textContent=text||('数据正在加载，请稍候… '+Math.round(pct)+'%');
}
function hideLoadBar(){ const bar=$('dataLoadBar'); if(bar) bar.classList.add('hidden'); }
/* 登录后后台同步：进度条下拉云端数据 */
async function syncCloudAfterLogin(user){
  try{
    ['schedules','day_settings','operation_log','photographers','hotels','users','settings','plaza_topics','plaza_comments','sessions'].forEach(function(n){ dirty.delete(n); });
    showLoadBar(0,'数据正在加载，请稍候…');
    await pullAllToLocal(true, function(done,total,label){
      const pct=Math.round(done/total*100);
      showLoadBar(pct, '数据正在加载，请稍候… '+pct+'%');
    });
    showLoadBar(96,'正在同步数据，请稍候…');
    await pushAllCollections();
    // 重新解析当前用户（云端可能更新了用户数据）
    currentUser=DB.getUsers().find(function(u2){ return u2.id===user.id; })||user;
    // 登录统计（拉取合并完成后记录，避免被云端旧数据覆盖；随后推送云端）
    recordUserLogin(currentUser);
    DB.setUsers(DB.getUsers());
    markDirty('users');
    try{ await flushPush(); }catch(e){}
    // 在线登记：同账号最多 3 台设备同时在线
    try{
      await cloudDB.collection('sessions').add({
        type:'online', userId:user.id, username:user.username,
        deviceId:DB.getDeviceId(), deviceName:getDeviceName(), loginAt:new Date().toISOString()
      });
      myLoginStamp=new Date().toISOString();
    }catch(e){ console.warn('[cloud] 在线登记失败', e); }
    showLoadBar(100,'数据加载完成');
    setTimeout(hideLoadBar, 700);
    renderHeaderUser();
    renderAll();
    refreshPhotographerFilter();
  }catch(e){
    console.warn('[cloud] 登录后同步异常', e);
    hideLoadBar();
  }
}

function switchTab(tab){

  ['schedule','plaza','manage','me'].forEach(function(t){

  // 记录按下目标：备注等文本框中按下后拖到遮罩上松开时不关闭弹窗（框选文字场景）
  let downTarget=null;
  document.addEventListener('mousedown', function(e){ downTarget=e.target; }, true);
  document.querySelectorAll('.modal-mask').forEach(function(mask){
    mask.addEventListener('click', function(e){
      if(e.target!==mask) return;
      // 按下点在编辑框内、松开点在遮罩上：视为框选拖出，不关闭
      const inEdit=downTarget && downTarget.closest && downTarget.closest('textarea, input, [contenteditable]');
      if(inEdit){ downTarget=null; return; }
      downTarget=null;
      closeModal(mask.id);
    });
  });

  // 跨标签页同步
  window.addEventListener('storage', function(e){
    if(e.key && e.key.indexOf('ps_')===0 && e.key!=='ps_session'){
      if(!modalOpen){ renderAll(); if(activeTab==='schedule') refreshPhotographerFilter(); }
    }
  });
  // 切回前台拉取
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && cloudOK && navigator.onLine){
      (async function(){ await pullAllToLocal(false); if(!modalOpen) renderAll(); })();
    }
  });
  // 恢复在线
  window.addEventListener('online', function(){
    if(cloudOK){
      (async function(){
        await pullAllToLocal(true);
        await pushAllCollections();
        renderAll();
        setSyncState('on');
        toast('网络已恢复，数据已同步','ok');
      })();
    }
  });
  window.addEventListener('offline', function(){ setSyncState('off'); toast('当前离线，修改将在联网后自动同步','error'); });
  // 系统主题变化（跟随系统）
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ loadTheme(); });
  }
}

/* 记住登录态：重开软件/刷新页面自动登录（保持前一次登录账号密码） */
async function autoLoginIfRemembered(){
  try{
    let saved=null;
    try{ saved=localStorage.getItem('xgd_remember'); }catch(e){}
    if(!saved) return false;
    const s=JSON.parse(saved);
    if(!s || !s.username || !s.password) return false;
    // 账号密码保留7天：过期后清除记住状态，需重新登录
    const REMEMBER_MS=7*24*3600*1000;
    if(s.ts && (Date.now()-s.ts)>REMEMBER_MS){
      try{ localStorage.removeItem('xgd_remember'); }catch(e){}
      return false;
    }
    let user=null;
    // 云端快速校验（在线）
    if(cloudOK && navigator.onLine){
      try{
        const r=await cloudDB.collection('users').where({username:s.username}).limit(1).get();
        const d=(r&&r.data&&r.data[0]);
        if(d && !d._deleted && d.password===s.password){
          user={id:d.id, username:d.username, password:d.password, nickname:d.nickname||d.username, role:d.role||'master', phone:d.phone||'', createdAt:d.createdAt||new Date().toISOString(), visitCount:d.visitCount||1, ownerId:d.ownerId||null};
          const users=DB.getUsers();
          const i=users.findIndex(function(u){ return u.id===d.id; });
          if(i>=0) users[i]=Object.assign({}, users[i], user); else users.push(user);
          DB.setUsers(users); markDirty('users');
        }
      }catch(e){ console.warn('[cloud] 自动登录快速校验失败', e); }
    }
    if(!user){
      const lu=DB.getUsers().find(function(u){ return u.username===s.username; });
      if(lu && lu.password===s.password && !lu._deleted) user=lu;
    }
    // 云端快速校验失败时，拉取 users 集合再校验一次（防止老用户被误判）
    if(!user && cloudOK && navigator.onLine){
      try{
        const usersD=await getAllDocs('users');
        const found=usersD.find(function(x){ return x&&x.username===s.username; });
        if(found && !found._deleted && found.password===s.password){
          user={id:found.id, username:found.username, password:found.password, nickname:found.nickname||found.username, role:found.role||'master', phone:found.phone||'', createdAt:found.createdAt||new Date().toISOString(), visitCount:found.visitCount||1, ownerId:found.ownerId||null};
          const users=DB.getUsers();
          const i=users.findIndex(function(u){ return u.id===found.id; });
          if(i>=0) users[i]=Object.assign({}, users[i], user); else users.push(user);
          DB.setUsers(users); markDirty('users');
        }
      }catch(e){ console.warn('[cloud] 自动登录重试校验失败', e); }
    }
    if(!user) return false;
    await loginComplete(user, {quick:true, silent:true});
    return true;
  }catch(e){ console.warn('[auto login]', e); return false; }
}
async function boot(){
  bindEvents();
  setSyncState('busy');
  const hasCloud=await initCloud();
  if(!hasCloud) setSyncState('off');
  ensureSettingsShape();
  // 扫码打开默认未登录；正常打开则尝试自动登录（记住上次账号）
  const isScan=location.search.indexOf('scan=')>=0;
  let autoLogged=false;
  if(!isScan){ autoLogged=await autoLoginIfRemembered(); }
  if(!autoLogged){
    // 清除历史会话，展示登录页（登录后才进入首页）
    DB.setSession(null);
    show('authPage');
    startQrLogin();         // 登录页展示扫码登录二维码
  }
  if(hasCloud){ startHeartbeat(); startReminderLoop(); }
  checkPendingScan();     // 未登录也记录 scan 参数，登录后确认
}
document.addEventListener('DOMContentLoaded', boot);
</script>
