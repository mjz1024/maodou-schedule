<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>毛豆档期</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#1f2430;--text2:#5b6472;--text3:#9aa3b2;
  --border:#e6e8ee;--primary:#e8467c;--primary2:#d6336c;--primary-soft:#fdeef3;
  --danger:#e5484d;--ok:#22a06b;--warn:#d97706;
  --header-bg:rgba(255,255,255,.86);--shadow:0 2px 12px rgba(20,24,40,.07);
  --input-bg:#f7f8fa;--radius:14px;
}
[data-theme="dark"]{
  --bg:#12141c;--card:#1c1f2b;--text:#eef0f5;--text2:#a6adbd;--text3:#6b7280;
  --border:#2a2f3d;--primary:#f06292;--primary2:#ec407a;--primary-soft:#33202b;
  --danger:#f2555a;--ok:#2fd18c;--warn:#f0a23a;
  --header-bg:rgba(18,20,28,.86);--shadow:0 2px 12px rgba(0,0,0,.4);--input-bg:#242836;
}
[data-theme="blackgold"]{
  --bg:#0b0b0d;--card:#17171b;--text:#f2ead8;--text2:#a89f8a;--text3:#6e6756;
  --border:#2c2a24;--primary:#d4af37;--primary2:#b8962e;--primary-soft:#262214;
  --danger:#e06b6b;--ok:#8fbf5f;--warn:#d4af37;
  --header-bg:rgba(11,11,13,.88);--shadow:0 2px 12px rgba(0,0,0,.5);--input-bg:#1d1d22;
}
[data-theme="champagne"]{
  --bg:#f8f3ea;--card:#fffdf8;--text:#3f3527;--text2:#857763;--text3:#b3a795;
  --border:#e8dfd0;--primary:#b98a2f;--primary2:#a67a22;--primary-soft:#f5ecd9;
  --danger:#c05548;--ok:#7d9b4e;--warn:#b98a2f;
  --header-bg:rgba(255,253,248,.88);--shadow:0 2px 12px rgba(90,70,30,.08);--input-bg:#f6efe2;
}
[data-theme="pink"]{
  --bg:#fff5f8;--card:#ffffff;--text:#3a2f36;--text2:#8a6f7c;--text3:#bfa9b5;
  --border:#f3dfe7;--primary:#ec407a;--primary2:#d81b60;--primary-soft:#fdeef3;
  --danger:#e5484d;--ok:#26a269;--warn:#d97706;
  --header-bg:rgba(255,255,255,.9);--shadow:0 2px 12px rgba(200,90,130,.09);--input-bg:#fdf3f7;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px;opacity:.4}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-size:15px;font-weight:600;transition:transform .12s,opacity .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-danger-ghost{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.role-badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.role-badge.master{background:#fde8e8;color:#c53030}
.role-badge.sub{background:#e8eefd;color:#3b6fe0}
.role-badge.admin{background:#f0e8fd;color:#7c3aed}
[data-theme="dark"] .role-badge.master{background:#3a2020;color:#fca5a5}
[data-theme="dark"] .role-badge.sub{background:#1d2942;color:#93b4f8}
[data-theme="dark"] .role-badge.admin{background:#2c2240;color:#c4a5f4}
.empty-hint{text-align:center;color:var(--text3);padding:48px 20px;font-size:14px}
.empty-hint .big{font-size:42px;margin-bottom:10px;opacity:.5}
select option:disabled{color:#b5aea4;background:#f6f3ee}
.list-date-title{font-size:13px;font-weight:700;color:var(--text2);padding:10px 4px 6px;display:flex;align-items:center;justify-content:space-between}
#scheduleListView{width:100%;max-width:900px;margin:0 auto}
@media(min-width:1100px){#scheduleListView{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}#scheduleListView .list-date-title,#scheduleListView .delivered-divider{grid-column:1/-1}}
/* 下两次订单日 */
.upcoming-btn{margin:10px 4px 2px}
.up-day{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px;margin-bottom:12px}
.up-day-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;cursor:pointer;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--border);color:var(--primary)}
.up-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--input-bg);cursor:pointer}
.up-card:active{opacity:.7}
.up-card-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.up-client{font-weight:700;font-size:14px}
.up-time{font-size:12px;color:var(--primary);font-weight:600}
.up-card-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* Toast */
#toastRoot{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{padding:10px 20px;border-radius:12px;background:rgba(30,34,48,.92);color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:toastIn .25s ease;max-width:100%;text-align:center}
.toast.error{background:rgba(190,55,60,.95)}
.toast.ok{background:rgba(34,138,107,.95)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* 确认框 */
#confirmRoot{position:fixed;inset:0;z-index:980;display:flex;align-items:center;justify-content:center;background:rgba(15,17,26,.5);padding:24px;animation:fadeIn .18s}
.confirm-card{background:var(--card);border-radius:16px;padding:22px;width:min(92vw,360px);box-shadow:var(--shadow)}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--text2);margin-bottom:18px;white-space:pre-wrap}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}

/* ============ 登录页 ============ */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--primary-soft),var(--bg) 60%)}
.auth-card{width:min(92vw,400px);background:var(--card);border-radius:20px;padding:32px 26px;box-shadow:var(--shadow)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .logo-box{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;font-size:30px;font-weight:800}
.auth-logo h1{font-size:22px;font-weight:800}
.auth-logo p{font-size:13px;color:var(--text3);margin-top:4px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600}
.auth-toggle{display:flex;background:var(--input-bg);border-radius:12px;padding:4px;margin-bottom:18px;border:1px solid var(--border)}
.auth-toggle button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text2)}
.auth-toggle button.active{background:var(--card);color:var(--primary);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.auth-hint{font-size:12px;color:var(--text3);text-align:center;margin-top:14px}
.wx-login-block{margin-bottom:6px}
.wx-btn{background:#07c160!important;color:#fff!important;font-weight:700;border:none}
.wx-btn:active{opacity:.88}
.wx-form{margin-top:12px;padding:12px;background:var(--input-bg);border-radius:12px;border:1px dashed var(--border)}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ============ 主框架 ============ */
.app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:74px}
.app-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
.header-l{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;flex-shrink:0}
.header-title{font-size:17px;font-weight:800;line-height:1.2}
.header-sub{font-size:11px;color:var(--text3)}
.header-r{display:flex;align-items:center;gap:10px}
.sync-state{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s}
.sync-dot.on{background:var(--ok)}
.sync-dot.off{background:var(--danger)}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.header-user{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.header-user .u-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--input-bg);border:1px solid var(--border);color:var(--text2);font-size:16px}
.icon-btn:active{transform:scale(.94)}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--text3);font-size:11px;font-weight:600}
.tab-item .t-ic{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .2s}
.tab-item.active{color:var(--primary)}
.tab-item.active .t-ic{background:var(--primary-soft)}
@media(min-width:768px){
  .app{padding-bottom:20px}
  .tabbar{position:static;border-top:none;border-bottom:1px solid var(--border);box-shadow:none;max-width:1100px;margin:0 auto}
  .tab-item{flex:none;flex-direction:row;gap:7px;padding:13px 22px;font-size:14px}
}

/* ============ 档期 ============ */
.tab-page{padding:14px 14px 20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-switch{display:flex;gap:8px;margin-bottom:12px}
.view-switch button{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-weight:600;color:var(--text2)}
.view-switch button.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* 日历 */
.calendar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--input-bg);font-size:16px;color:var(--text2)}
.cal-nav button:active{transform:scale(.94)}
.cal-month{font-size:17px;font-weight:800;cursor:pointer;padding:6px 10px;border-radius:9px}
.cal-month:hover{background:var(--input-bg)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px 4px}
.cal-week span{text-align:center;font-size:12px;color:var(--text3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 6px 10px}
.cal-day{position:relative;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;cursor:pointer;transition:background .15s}
.cal-day:hover{background:var(--input-bg)}
.cal-day.out{opacity:.3}
.cal-day.today{background:var(--primary-soft)}
.cal-day.today .d-num{color:var(--primary);font-weight:800}
.cal-day.selected{background:var(--primary)}
.cal-day.selected .d-num,.cal-day.selected .d-count{color:#fff}
.d-num{font-size:14px;font-weight:600}
.d-count{font-size:10px;color:var(--text3);margin-top:2px;font-weight:600}
.cal-day.selected .d-count{color:rgba(255,255,255,.85)}
.dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:80%}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.cal-day.selected .dots i{background:#fff}
@media(min-width:768px){.cal-day{min-height:72px}.d-num{font-size:15px}}

/* 筛选 */
.sched-filters{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
.sched-filters select{width:auto;flex:1;min-width:120px}
.sched-filters input{flex:2;min-width:140px}

/* 档期卡片 */
.sched-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--primary);transition:transform .12s}
.sched-card:active{transform:scale(.99)}
.sched-card.delivered{border-left-color:var(--text3);opacity:.6;filter:grayscale(.6)}
.sched-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sched-client{font-size:16px;font-weight:800;word-break:break-all}
.sched-date{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;flex-shrink:0;padding-top:2px}
.sched-card.delivered .sched-date{color:var(--text3)}
.sched-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--text2)}
.sched-meta .m{background:var(--input-bg);padding:3px 9px;border-radius:8px;font-size:12px}
.sched-note{margin-top:8px;font-size:13px;color:var(--text2);background:var(--input-bg);border-radius:9px;padding:8px 10px;white-space:pre-wrap;word-break:break-all}
.sched-money{display:flex;gap:14px;margin-top:9px;font-size:13px}
.sched-money .amt{color:var(--text);font-weight:800}
.sched-money .dep{color:var(--warn);font-weight:700}
.sched-money .bal{color:var(--ok);font-weight:700}
.sched-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.sched-tags{display:flex;gap:5px;flex-wrap:wrap}
.sched-actions{display:flex;gap:6px}
.sched-actions button{font-size:12px}
.delivered-stamp{font-size:12px;font-weight:700;color:var(--text3)}
.delivered-divider{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12px;margin:16px 0 8px;font-weight:600}
.delivered-divider::before,.delivered-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}

.upcoming{color:var(--danger)!important;font-weight:800}

/* ============ 留言广场 ============ */
.plaza-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plaza-head h2{font-size:19px;font-weight:800}
.plaza-sub{font-size:12px;color:var(--text3);margin-top:2px}
.plaza-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:transform .12s}
.plaza-card:active{transform:scale(.99)}
.plaza-title{font-size:16px;font-weight:800;margin-bottom:6px;word-break:break-all}
.plaza-content{font-size:14px;color:var(--text2);white-space:pre-wrap;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plaza-author{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.plaza-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.plaza-name{font-size:13px;font-weight:700}
.plaza-time{font-size:12px;color:var(--text3)}
.plaza-foot{display:flex;align-items:center;gap:14px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);font-size:12px;color:var(--text3)}
.plaza-foot .cmt{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--text2)}
.plaza-del{margin-left:auto;color:var(--danger);font-weight:600;font-size:12px}

/* 主题详情 */
.plaza-detail{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.pd-title{font-size:18px;font-weight:800;margin-bottom:8px;word-break:break-all}
.pd-content{font-size:14.5px;color:var(--text2);white-space:pre-wrap;word-break:break-all;margin-bottom:12px}
.comment-list{margin-top:4px}
.comment-item{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border)}
.comment-item:last-child{border-bottom:none}
.cmt-body{flex:1;min-width:0}
.cmt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cmt-text{font-size:14px;margin-top:4px;white-space:pre-wrap;word-break:break-all}
.cmt-del{margin-left:auto;color:var(--danger);font-size:12px;font-weight:600}
.comment-box{display:flex;gap:8px;margin-top:12px}
.comment-box input{flex:1}

/* ============ 我的 ============ */
.me-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.me-card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.me-card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}
.me-card .me-card-head{justify-content:space-between;cursor:pointer;user-select:none;margin-bottom:0!important}
.me-card .me-card-head .arr{transition:transform .2s;font-size:10px;color:var(--text3);flex-shrink:0}
.me-card.collapsed .me-card-head .arr{transform:rotate(90deg)}
.me-card.collapsed .me-card-body{display:none}
.me-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.me-row:last-child{border-bottom:none}
.me-row .lbl{font-size:14px;color:var(--text2)}
.me-row .val{font-size:14px;font-weight:600;text-align:right;word-break:break-all}
.me-row .val.small{font-size:13px;font-weight:400}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip-item{display:inline-flex;align-items:center;gap:6px;background:var(--input-bg);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:background .15s}
.chip-item:active{background:var(--primary-soft)}
.chip-item .x{color:var(--danger);font-weight:800;font-size:14px}
.chip-item .drag{color:var(--text3);cursor:grab;font-size:14px}
.theme-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.theme-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:12px;border:2px solid var(--border);cursor:pointer;font-size:12px;transition:all .15s}
.theme-item.active{border-color:var(--primary);background:var(--primary-soft);font-weight:700}
.theme-swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.08)}
.log-list{max-height:240px;overflow-y:auto}
.log-item{display:flex;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--border);font-size:13px}
.log-item .lt{color:var(--text3);white-space:nowrap;font-size:12px}
.log-item .ld{color:var(--text2)}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--border);transition:background .2s;flex-shrink:0}
.switch.on{background:var(--ok)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch.on::after{left:23px}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;z-index:900;background:rgba(15,17,26,.5);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s}
@media(min-width:768px){.modal-mask{align-items:center;padding:24px}}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .22s ease;overflow:hidden}
@media(min-width:768px){.modal{border-radius:20px}}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:800}
.modal-close{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--input-bg);font-size:16px;color:var(--text2)}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* 表单 */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-item{display:flex;flex-direction:column;gap:5px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:13px;color:var(--text2);font-weight:600}
.check-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:4px 0}
.check-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.check-label input{width:17px;height:17px;accent-color:var(--primary)}
.readonly-note{font-size:12px;color:var(--text3);margin-top:6px}

/* 酒店目录树 */
.hotel-tree{display:flex;flex-direction:column;gap:10px}
.hotel-node{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card)}
.hotel-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;cursor:pointer;user-select:none;margin-bottom:4px}
.hotel-head .arr{display:inline-block;width:14px;color:var(--text3);transition:transform .2s;font-size:10px}
.hotel-node.open .hotel-head .arr{transform:rotate(90deg)}
.hotel-head .hcount{font-size:11px;font-weight:400;color:var(--text3);margin-left:6px}
.hotel-body{display:none;margin-top:6px}
.hotel-node.open .hotel-body{display:block}
.hall-node{border-left:2px solid var(--border);padding-left:10px;margin:8px 0 4px}
.hall-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.hall-planners{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.p-chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.p-chip .x{background:none;border:none;color:inherit;font-size:13px;cursor:pointer;padding:0 2px}
.tree-add{display:flex;gap:6px;margin-top:8px}
.tree-add input{flex:1;padding:7px 10px;font-size:13px;border-radius:8px}
.tree-add button{flex-shrink:0}

/* FAB */
.fab{position:fixed;right:18px;bottom:86px;z-index:150;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(230,70,124,.4);transition:transform .15s}
.fab:active{transform:scale(.92)}
@media(min-width:768px){.fab{bottom:30px}}

/* 底部操作栏（主题详情） */
.detail-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.detail-toolbar .back{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--text2)}
</style>

<script>
'use strict';
/* ================================================================
   毛豆档期 v31.0（小程序平台 · 留言广场版）
   - 仅网页/小程序平台，无分享页、无聊天群
   - 留言广场：所有登录用户可发主题 + 评论
   - 云端为唯一真相源：登录强制拉取最新数据（REPLACE 覆盖），
     任何修改立即推送云端，20s 心跳 + watch 实时同步
   ================================================================ */
const APP_VERSION = 'v31.0';
const CLOUDBASE_ENV = 'mjz1024-d9gmd96afc2ffc3ad';
const CLOUD_REGION = 'ap-shanghai';   // 环境实际创建区域（ap-shanghai）
const THEME_ORDER = ['auto','champagne','pink','dark','blackgold'];
const THEME_NAMES = {auto:'跟随系统', champagne:'香槟', pink:'粉色', dark:'深色', blackgold:'黑金'};
const THEME_COLORS = {auto:'#8b93a3', champagne:'#b98a2f', pink:'#ec407a', dark:'#3b4252', blackgold:'#d4af37'};

/* ============ 工具函数 ============ */
function uid(p){ return (p||'x') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function $(id){ return document.getElementById(id); }
function val(id){ return $(id).value; }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* Toast */
function toast(msg, type){
  const root=$('toastRoot');
  const el=document.createElement('div');
  el.className='toast'+(type==='error'?' error':type==='ok'?' ok':'');
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); },320); }, 2400);
}

/* 确认框（Promise） */
function confirmBox(title, text){
  return new Promise(function(resolve){
    const root=$('confirmRoot');
    root.classList.remove('hidden');
    root.innerHTML='<div class="confirm-card">'+
      '<div class="confirm-title">'+esc(title)+'</div>'+
      '<div class="confirm-text">'+esc(text)+'</div>'+
      '<div class="confirm-actions">'+
      '<button class="btn btn-ghost" id="confirmNo">取消</button>'+
      '<button class="btn btn-primary" id="confirmYes">确定</button>'+
      '</div></div>';
    $('confirmYes').onclick=function(){ root.classList.add('hidden'); resolve(true); };
    $('confirmNo').onclick=function(){ root.classList.add('hidden'); resolve(false); };
    root.onclick=function(e){ if(e.target===root){ root.classList.add('hidden'); resolve(false); } };
  });
}

/* 下载文件 */
function download(filename, content, mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ============ 本地存储层（ps_ 前缀，云端集合一一对应） ============ */
const DB = {
  get:function(key,fb){ try{ const v=localStorage.getItem('ps_'+key); return v?JSON.parse(v):fb; }catch(e){ return fb; } },
  set:function(key,val){ try{ localStorage.setItem('ps_'+key, JSON.stringify(val)); }catch(e){ console.warn('storage write fail', key); } },
  getUsers:function(){ return this.get('users',[]); },
  setUsers:function(v){ this.set('users',v); },
  getSchedules:function(){ return this.get('schedules',[]); },
  setSchedules:function(v){ this.set('schedules',v); },
  getSettings:function(){ return this.get('settings',{}); },
  setSettings:function(v){ this.set('settings',v); },
  getDaySettings:function(){ return this.get('day_settings',{}); },
  setDaySettings:function(v){ this.set('day_settings',v); },
  getSessions:function(){
    const v=this.get('sessions',null);
    if(v===null) return [];
    if(Array.isArray(v)) return v;
    // 兼容旧版格式：按 userId 分组的对象 {uid: [{deviceId, loginAt}]}
    const out=[];
    const users=this.getUsers();
    Object.keys(v).forEach(function(uid){
      const u=users.find(function(x){return x.id===uid;});
      (v[uid]||[]).forEach(function(r){
        if(!r) return;
        out.push({
          id:(r.id)||('s2_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)),
          username:(r.username)||(u?u.username:'')||uid,
          nickname:(r.nickname)||(u?u.nickname:'')||(u?u.username:''),
          role:(r.role)||(u?u.role:''),
          deviceId:(r.deviceId)||'',
          loginTime:(r.loginTime)||(r.loginAt)||''
        });
      });
    });
    return out;
  },
  setSessions:function(v){ this.set('sessions',v); },
  getPhoto:function(mid){ return this.get('photographers_'+mid,[]); },
  setPhoto:function(mid,v){ this.set('photographers_'+mid,v); },
  getHotels:function(mid){ return this.get('hotels_'+mid,[]); },
  setHotels:function(mid,v){ this.set('hotels_'+mid,v); },
  getOpLog:function(mid){ return this.get('operation_log_'+mid,[]); },
  setOpLog:function(mid,v){ this.set('operation_log_'+mid,v); },
  getPlazaTopics:function(){ return this.get('plaza_topics',[]); },
  setPlazaTopics:function(v){ this.set('plaza_topics',v); },
  getPlazaComments:function(){ return this.get('plaza_comments',[]); },
  setPlazaComments:function(v){ this.set('plaza_comments',v); },
  getSession:function(){ return this.get('session',null); },
  setSession:function(v){ this.set('session',v); },
  getDeviceId:function(){
    let d=localStorage.getItem('ps_device_id');
    if(!d){ d='dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,10); localStorage.setItem('ps_device_id',d); }
    return d;
  }
};

/* ============ 全局状态 ============ */
let currentUser=null;
let activeTab='schedule';
let calYear=null, calMonth=null;   // 当前显示的日历年月（0-11）
let selectedDate=null;

function getCurrentMasterId(){
  if(!currentUser) return null;
  if(currentUser.role==='master'||currentUser.role==='admin') return currentUser.id;
  if(currentUser.ownerId) return currentUser.ownerId;
  const owner=DB.getUsers().find(function(u){ return u.id===currentUser.createdBy || u.username===currentUser.createdBy; });
  return owner?owner.id:null;
}
function isMasterLike(){ return currentUser && (currentUser.role==='master'||currentUser.role==='admin'); }
function hotelName(h){ return (typeof h==='string')?h:((h&&h.name)?h.name:''); }
function mapOldTheme(t){
  if(t==='system'||t==='light') return 'auto';
  return THEME_ORDER.indexOf(t)>=0?t:'blackgold';
}
/* 兼容旧版 ps_settings 扁平格式 {themeMode, themeColor} → 按主账号分组 */
function ensureSettingsShape(){
  const s=DB.getSettings();
  if(!s || (s.themeMode===undefined && s.themeColor===undefined)) return;
  const mids=DB.getUsers().filter(function(u){return u.role==='master'||u.role==='admin';}).map(function(u){return u.id;});
  const theme=mapOldTheme(s.themeMode||s.themeColor||'blackgold');
  const news={};
  mids.forEach(function(mid){ news[mid]={masterId:mid, theme:theme, updatedAt:new Date().toISOString()}; });
  if(Object.keys(news).length) DB.setSettings(news);
}
function masterSettings(){
  const mid=getCurrentMasterId();
  const s=DB.getSettings();
  return s[mid]||{ masterId:mid };
}
function saveMasterSettings(patch){
  const mid=getCurrentMasterId(); if(!mid) return;
  const s=DB.getSettings();
  s[mid]=Object.assign({}, s[mid]||{masterId:mid}, patch, {updatedAt:new Date().toISOString()});
  DB.setSettings(s);
  markDirty('settings');
}
function addLog(action, detail){
  const mid=getCurrentMasterId(); if(!mid) return;
  const log=DB.getOpLog(mid);
  log.unshift({id:uid('log'), action:action, detail:detail||'', username:currentUser?currentUser.username:'', time:new Date().toISOString()});
  if(log.length>500) log.length=500;
  DB.setOpLog(mid, log);
  markDirty('operation_log');
}

/* ============ 云端同步层 ============ */
let cloudApp=null, cloudDB=null, cloudOK=false;
const dirty=new Set();
let pushTimer=null, pushing=false;

async function initCloud(){
  try{
    if(typeof cloudbase==='undefined'){ console.warn('[cloud] SDK 未加载，离线模式'); return false; }
    cloudApp=cloudbase.init({env:CLOUDBASE_ENV, region:CLOUD_REGION});
    const auth=cloudApp.auth({persistence:'local'});
    await auth.signInAnonymously();
    // SDK 在匿名登录未开通时会静默失败，这里主动校验登录态
    const st=await auth.getLoginState();
    if(!st){ throw new Error('匿名登录未开通，请到 CloudBase 控制台开启'); }
    cloudDB=cloudApp.database();
    // 探活：真实读取一次，验证数据接口（CORS/安全域名）可用，避免登录成功但数据接口被拦时误报「已同步」
    try{
      await cloudDB.collection('users').limit(1).get();
    }catch(probeErr){
      console.warn('[cloud] 数据接口探活失败:', probeErr && probeErr.message);
      throw new Error('数据接口不可用：请在 CloudBase 控制台「安全来源-Web 安全域名」添加 '+location.origin);
    }
    cloudOK=true;
    setSyncState('busy');
    await pullAllToLocal(true);      // 登录前先拉最新
    await pushAllCollections();      // 补推本地未同步内容
    setSyncState('on');
    startWatchers();
    return true;
  }catch(e){
    console.warn('[cloud] 初始化失败:', e && e.message);
    cloudOK=false; setSyncState('off');
    toast((e&&e.message)||'云同步未连接','error');
    return false;
  }
}

function setSyncState(state){ // on | off | busy
  const dot=$('syncDot'), txt=$('syncText');
  if(!dot) return;
  dot.className='sync-dot '+state;
  if(!txt) return;
  if(state==='on'){ txt.textContent=cloudOK?'已同步':'离线'; }
  else if(state==='off'){ txt.textContent='离线模式'; }
  else { txt.textContent='同步中'; }
}

async function getAllDocs(name){
  if(!cloudOK||!cloudDB) return [];
  try{
    const col=cloudDB.collection(name);
    let out=[];
    let batch=await col.limit(100).get();
    out=out.concat(batch.data||[]);
    while((batch.data||[]).length===100){
      batch=await col.skip(out.length).limit(100).get();
      out=out.concat(batch.data||[]);
    }
    return out;
  }catch(e){ console.warn('[cloud] 拉取失败', name, e); return []; }
}

/* 全量拉取：云端 → 本地（REPLACE 覆盖；dirty 集合跳过以避免覆盖未同步的本地修改） */
async function pullAllToLocal(force){
  if(!cloudOK) return false;
  const skip=function(c){ return dirty.has(c); };
  try{
    const usersD=await getAllDocs('users');
    if(usersD.length>0) DB.setUsers(usersD.filter(function(x){return x&&x.id;}));
    const cloudUserIds={};
    usersD.forEach(function(u){ if(u&&u.id) cloudUserIds[u.id]=true; });

    const schedD=await getAllDocs('schedules');
    if(schedD.length>0) DB.setSchedules(schedD.filter(function(x){return x&&x.id;}));

    if(!skip('settings')){
      const d=await getAllDocs('settings');
      const map={};
      d.forEach(function(x){ if(x&&(x.masterId||x._masterId)) map[x.masterId||x._masterId]=x; });
      if(Object.keys(map).length>0) DB.setSettings(map);
    }
    if(!skip('day_settings')){
      const d=await getAllDocs('day_settings');
      const map={};
      d.forEach(function(x){ if(x&&x.date) map[x.date]=x; });
      if(Object.keys(map).length>0) DB.setDaySettings(map);
    }
    if(!skip('sessions')){
      const d=await getAllDocs('sessions');
      if(d.length>0) DB.setSessions(d.filter(function(x){return x&&(x.id||x.loginAt||x.loginTime||x.deviceId);}));
    }
    if(!skip('photographers')){
      const d=await getAllDocs('photographers');
      const by={};
      d.forEach(function(x){ if(x&&x.name){ const m=x._masterId||x.masterId||'_default'; (by[m]=by[m]||[]).push(x.name); } });
      Object.keys(by).forEach(function(m){ DB.setPhoto(m, by[m]); });
      if(force){
        Object.keys(cloudUserIds).forEach(function(mid){ if(by[mid]===undefined) DB.setPhoto(mid, []); });
      }
    }
    if(!skip('hotels')){
      const d=await getAllDocs('hotels');
      const by={};
      d.forEach(function(x){
        if(x&&x.name){
          const m=x._masterId||x.masterId||'_default';
          const nm=x.name;
          const arr=(by[m]=by[m]||[]);
          if(!arr.some(function(y){ return hotelName(y)===nm; })){
            arr.push({name:nm, halls:x.halls||[], planners:x.planners||[]});
          }
        }
      });
      Object.keys(by).forEach(function(m){ DB.setHotels(m, by[m]); });
      if(force){
        Object.keys(cloudUserIds).forEach(function(mid){ if(by[mid]===undefined) DB.setHotels(mid, []); });
      }
    }
    if(!skip('operation_log')){
      const d=await getAllDocs('operation_log');
      const by={};
      d.forEach(function(x){ if(x&&x.id){ const m=x._masterId||x.masterId||'_default'; (by[m]=by[m]||[]).push(x); } });
      Object.keys(by).forEach(function(m){ DB.setOpLog(m, by[m]); });
    }
    if(!skip('plaza_topics')){
      const d=await getAllDocs('plaza_topics');
      if(d.length>0) DB.setPlazaTopics(d.filter(function(x){return x&&x.id;}));
    }
    if(!skip('plaza_comments')){
      const d=await getAllDocs('plaza_comments');
      if(d.length>0) DB.setPlazaComments(d.filter(function(x){return x&&x.id;}));
    }
    return true;
  }catch(e){ console.warn('[cloud] pull 异常', e); return false; }
}

/* 元信息 */
function cloudMeta(){

}

/* 推送单个集合：本地 → 云端（doc.set 幂等覆盖） */
async function pushCollection(name){
  if(!cloudOK||!cloudDB) return;
  try{
    const col=cloudDB.collection(name);
    let items=[];
    const masterUsers=DB.getUsers().filter(function(u){ return u.role==='master'||u.role==='admin'; });
    if(name==='users'){
      items=DB.getUsers().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='schedules'){
      items=DB.getSchedules().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='sessions'){
      items=DB.getSessions().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='plaza_topics'){
      items=DB.getPlazaTopics().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='plaza_comments'){
      items=DB.getPlazaComments().map(function(x){ return Object.assign({}, x, cloudMeta()); });
    } else if(name==='settings'){
      const s=DB.getSettings();
      Object.keys(s).forEach(function(mid){
        items.push(Object.assign({}, s[mid], {_id:'settings_'+mid, masterId:mid}, cloudMeta()));
      });
    } else if(name==='day_settings'){
      const ds=DB.getDaySettings();
      Object.keys(ds).forEach(function(date){
        items.push(Object.assign({}, ds[date], {_id:'day_'+date, date:date}, cloudMeta()));
      });
    } else if(name==='operation_log'){
      masterUsers.forEach(function(mu){
        DB.getOpLog(mu.id).forEach(function(item){
          items.push(Object.assign({}, item, {_masterId:mu.id}, cloudMeta()));
        });
      });
    } else if(name==='photographers'){
      masterUsers.forEach(function(mu){
        DB.getPhoto(mu.id).forEach(function(name){
          items.push({_id:mu.id+'|'+name, name:name, _masterId:mu.id, _syncAt:cloudMeta()._syncAt, _env:CLOUDBASE_ENV, _device:DB.getDeviceId()});
        });
      });
    } else if(name==='hotels'){
      masterUsers.forEach(function(mu){
        DB.getHotels(mu.id).forEach(function(item){
          const nm=hotelName(item);
          if(!nm) return;
          items.push({_id:mu.id+'|'+nm, name:nm, halls:(item&&item.halls)||[], planners:(item&&item.planners)||[], _masterId:mu.id, _syncAt:cloudMeta()._syncAt, _env:CLOUDBASE_ENV, _device:DB.getDeviceId()});
        });
      });
    }
    if(items.length===0) return;
    const B=50;
    for(let i=0;i<items.length;i+=B){
      const batch=items.slice(i,i+B);
      await Promise.all(batch.map(function(item){
        if(item._id){
          return col.doc(item._id).set({data:item}).catch(function(){ return col.add({data:item}); });
        }
        return col.add({data:item});
      }));
    }
    dirty.delete(name);
    setSyncState('on');
  }catch(e){ console.warn('[cloud] 推送失败', name, e && e.message); setSyncState('off'); }
}

function markDirty(name){ dirty.add(name); setSyncState('busy'); schedulePush(); }

function schedulePush(){
  if(!cloudOK) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){ pushTimer=null; pushAllDirty(); }, 400);
}
async function pushAllDirty(){
  if(!cloudOK||pushing) return;
  pushing=true;
  try{
    const list=[];
    dirty.forEach(function(c){ list.push(c); });
    for(const c of list){ await pushCollection(c); }
  }catch(e){ console.warn(e); }
  finally{ pushing=false; }
}
async function flushPush(){
  if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; }
  await pushAllDirty();
}
async function pushAllCollections(){
  if(!cloudOK) return;
  const names=['users','schedules','settings','day_settings','sessions','operation_log','photographers','hotels','plaza_topics','plaza_comments'];
  for(const n of names){ dirty.add(n); await pushCollection(n); }
}

/* 按业务字段删除云端文档（直接删除，保证删除实时生效） */
async function cloudRemoveByField(name, field, value){
  if(!cloudOK||!cloudDB) return;
  try{
    const res=await cloudDB.collection(name).where(({[field]:value})).limit(100).get();
    const docs=res.data||[];
    for(const doc of docs){
      try{ await cloudDB.collection(name).doc(doc._id).remove(); }catch(e2){}
    }
  }catch(e){ console.warn('[cloud] 删除失败', name, e); }
}
async function cloudRemoveByQuery(name, queryObj){
  if(!cloudOK||!cloudDB) return;
  try{
    const res=await cloudDB.collection(name).where(queryObj).limit(100).get();
    const docs=res.data||[];
    for(const doc of docs){
      try{ await cloudDB.collection(name).doc(doc._id).remove(); }catch(e2){}
    }
  }catch(e){ console.warn('[cloud] 删除失败', name, e); }
}

/* watch 实时监听（收到他人修改立即合并到本地并重渲染） */
function startWatchers(){
  if(!cloudOK||!cloudDB) return;
  const cfgs=[
    {name:'schedules', local:'schedules', idKey:'id'},
    {name:'users', local:'users', idKey:'id'},
    {name:'plaza_topics', local:'plaza_topics', idKey:'id'},
    {name:'plaza_comments', local:'plaza_comments', idKey:'id'},
    {name:'sessions', local:'sessions', idKey:'id'}
  ];
  cfgs.forEach(function(cfg){
    try{
      cloudDB.collection(cfg.name).watch({
        onChange:function(snap){
          if(!snap.docChanges||!snap.docChanges.length) return;
          const arr=DB.get(cfg.local, []);
          let changed=false;
          snap.docChanges.forEach(function(ch){
            const doc=ch.doc; if(!doc||!doc[cfg.idKey]) return;
            const i=arr.findIndex(function(x){ return x[cfg.idKey]===doc[cfg.idKey]; });
            if(ch.dataType==='remove'){ if(i>=0){ arr.splice(i,1); changed=true; } }
            else if(ch.dataType==='update'){ if(i>=0){ arr[i]=doc; changed=true; } }
            else if(ch.dataType==='add'){ if(i<0){ arr.push(doc); changed=true; } }
          });
          if(changed){
            DB.set(cfg.local, arr);
            if(!modalOpen) renderAll();
          }
        },
        onError:function(err){ console.warn('[cloud] watch 错误', cfg.name, err); }
      });
    }catch(e){ console.warn('[cloud] watch 启动失败', cfg.name); }
  });
}

/* 心跳：20s 拉取一次最新数据 */
function startHeartbeat(){
  setInterval(async function(){
    if(!cloudOK||!navigator.onLine) return;
    if(pushing) return;
    const before=JSON.stringify({
      s:DB.getSchedules().map(function(x){return x.updatedAt||x.id;}).sort(),
      p:DB.getPlazaTopics().map(function(x){return x.id;}).sort(),
      c:DB.getPlazaComments().map(function(x){return x.id;}).sort()
    });
    await pullAllToLocal(false);
    const after=JSON.stringify({
      s:DB.getSchedules().map(function(x){return x.updatedAt||x.id;}).sort(),
      p:DB.getPlazaTopics().map(function(x){return x.id;}).sort(),
      c:DB.getPlazaComments().map(function(x){return x.id;}).sort()
    });
    if(before!==after && !modalOpen) renderAll();
  }, 20000);
}

function applyTheme(theme){
  if(theme==='auto'){
    const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme=dark?'dark':'light';
  }else{
    document.documentElement.dataset.theme=theme;
  }
}

}

/* ============ 档期：日历 ============ */
function initCalDates(){
  if(calYear===null){
    const now=new Date();
    calYear=now.getFullYear(); calMonth=now.getMonth();
  }
}
function renderCalendar(){
  initCalDates();
  const cont=$('calendarView');
  const y=calYear, m=calMonth;
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;   // 周一为 0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const scheds=DB.getSchedules();
  const countMap={};
  scheds.forEach(function(s){
    if(s.shootDate){ countMap[s.shootDate]=(countMap[s.shootDate]||0)+1; }
  });
  const today=todayStr();
  let html='<div class="calendar">';
  html+='<div class="cal-top">';
  html+='<div class="cal-nav"><button id="calPrev">‹</button><span class="cal-month" id="calMonthLabel">'+y+'年'+(m+1)+'月</span><button id="calNext">›</button></div>';
  html+='<button class="btn btn-ghost btn-sm" id="calToday">今天</button>';
  html+='</div>';
  html+='<div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>';
  html+='<div class="cal-grid">';
  for(let i=0;i<startDow;i++){
    html+='<div class="cal-day out"></div>';
  }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=y+'-'+pad(m+1)+'-'+pad(d);
    const cnt=countMap[dateStr]||0;
    const isToday=dateStr===today;
    const isSel=dateStr===selectedDate;
    html+='<div class="cal-day'+(isToday?' today':'')+(isSel?' selected':'')+'" data-date="'+dateStr+'">'+
      '<span class="d-num">'+d+'</span>'+
      (cnt>0?'<span class="d-count">'+cnt+'单</span>':'')+
      '</div>';
  }
  html+='</div></div>';
  cont.innerHTML=html;
  $('calPrev').onclick=function(){ calMonth--; if(calMonth<0){ calMonth=11; calYear--; } renderCalendar(); };
  $('calNext').onclick=function(){ calMonth++; if(calMonth>11){ calMonth=0; calYear++; } renderCalendar(); };
  $('calToday').onclick=function(){ const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth(); selectedDate=todayStr(); renderCalendar(); renderScheduleList(); };
  cont.querySelectorAll('.cal-day[data-date]').forEach(function(el){
    el.onclick=function(){ selectedDate=el.dataset.date; renderCalendar(); renderScheduleList(); };
  });
}

function filterSchedules(){
  const kw=($('filterKeyword').value||'').trim().toLowerCase();
  const ph=$('filterPhotographer').value;
  return DB.getSchedules().filter(function(s){
    if(ph && s.photographer!==ph) return false;
    if(kw){
      const hay=[s.clientName,s.hotel,s.hall,s.planner,s.photographer,s.secondPhotographer,s.note].join(' ').toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
}

function schedCardHTML(s, upcoming){
  const flags=[];
  if(s.pickup) flags.push('接送');
  if(s.dualCamera) flags.push('双机');
  if(s.noMorningGown) flags.push('无晨袍');
  if(s.personConfirmed) flags.push('已指定');
  const bal=(s.totalAmount||0)-(s.deposit||0);
  const note=s.note||s.remarks||'';
  const canEdit=isMasterLike();
  const dateHtml=upcoming[s.shootDate]&&!s.delivered?'<span class="upcoming">'+(s.shootDate?esc(s.shootDate).slice(5):'')+'</span>':(s.shootDate?esc(s.shootDate).slice(5):'未定');
  let html='<div class="sched-card'+(s.delivered?' delivered':'')+'" data-id="'+esc(s.id)+'">';
  html+='<div class="sched-head"><div class="sched-client">'+esc(s.clientName)+'</div><div class="sched-date">'+dateHtml+'</div></div>';
  if(s.hotel||s.hall||s.planner||s.photographer||s.secondPhotographer||s.orderDate||s.arrivalTime){
    html+='<div class="sched-meta">';
    if(s.hotel) html+='<span class="m">'+esc(s.hotel)+'</span>';
    if(s.hall) html+='<span class="m">'+esc(s.hall)+'</span>';
    if(s.planner) html+='<span class="m">策划：'+esc(s.planner)+'</span>';
    if(s.photographer) html+='<span class="m">📷 '+esc(s.photographer)+'</span>';
    if(s.secondPhotographer) html+='<span class="m">副机：'+esc(s.secondPhotographer)+'</span>';
    if(s.orderDate) html+='<span class="m">下单 '+esc(s.orderDate)+'</span>';
    if(s.arrivalTime) html+='<span class="m">到场 '+esc(s.arrivalTime)+'</span>';
    html+='</div>';
  }
  html+='<div class="sched-money"><span class="amt">总额 ¥'+(s.totalAmount||0)+'</span><span class="dep">定金 ¥'+(s.deposit||0)+'</span><span class="bal">尾款 ¥'+bal+'</span></div>';
  if(note) html+='<div class="sched-note">'+esc(note)+'</div>';
  html+='<div class="sched-foot"><div class="sched-tags">';
  if(flags.length) flags.forEach(function(f){ html+='<span class="chip">'+f+'</span>'; });
  if(s.delivered){ html+='<span class="delivered-stamp">已交付 '+(s.deliveredAt?esc(s.deliveredAt).slice(0,10):'')+'</span>'; }
  html+='</div><div class="sched-actions">';
  if(!s.delivered && canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-deliver">交付</button>';
  }else if(s.delivered && canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-restore">恢复</button>';
  }
  if(canEdit){
    html+='<button class="btn btn-sm btn-ghost s-act-edit">编辑</button>';
    html+='<button class="btn btn-sm btn-danger-ghost s-act-del">删除</button>';
  }
  html+='</div></div></div>';
  return html;
}
function renderScheduleList(){
  initCalDates();
  const cont=$('scheduleListView');
  if(!selectedDate){
    cont.innerHTML='<div class="empty-hint"><div class="big">📅</div>点击日历选择日期，查看当日订单</div>';
    return;
  }

  const upcoming=upcomingDays();

  const delivered=scheds.filter(function(s){return s.delivered;}).sort(function(a,b){ return (b.deliveredAt||'').localeCompare(a.deliveredAt||''); });

    if(card.classList.contains('delivered')){

function dayOccupiedNames(dateStr, excludeId){

/* 增量更新下拉选项：内容未变时只改 disabled/selected，绝不重建 innerHTML，
   避免移动端点开下拉时被重建导致列表闪退 */
function setSelectOptions(sel, options){
  const cur=sel.querySelectorAll('option');
  let same=cur.length===options.length;
  for(let i=0;i<options.length && same;i++){
    const o=cur[i];
    if(!o || o.value!==options[i].v || o.textContent!==options[i].label) same=false;
  }
  if(same){
    options.forEach(function(op,i){
      cur[i].disabled=!!op.disabled;
      cur[i].selected=!!op.selected;
    });
    return;
  }
  sel.innerHTML=options.map(function(op){
    return '<option value="'+esc(op.v)+'"'+(op.selected?' selected':'')+(op.disabled?' disabled':'')+'>'+esc(op.label)+'</option>';
  }).join('');
}
function buildPersonOptions(people, occ, excludeVals, currentVal){
  const opts=[{v:'',label:excludeVals.length?'（已选为主人员）':'未指定',disabled:false,selected:currentVal===''}];
  people.forEach(function(p){
    const busy=(occ[p]||excludeVals.indexOf(p)>=0) && p!==currentVal;
    opts.push({v:p, label:p+(busy?'（已占用）':''), disabled:busy, selected:p===currentVal});
  });
  return opts;
}

/* —— 酒店/厅/策划师 层级（目录树数据） —— */
function hotelHalls(h){
  const halls=h&&h.halls;
  if(!halls) return [];
  if(halls.length && typeof halls[0]==='string'){   // 兼容旧格式：字符串数组
    return halls.map(function(nm,i){ return {id:'hh_'+i+'_'+nm, name:nm, planners:[]}; });
  }
  return halls;
}
function hallName(hall){ return (typeof hall==='string')?hall:((hall&&hall.name)?hall.name:''); }
function hotelPlanners(h){ return (h&&h.planners&&Array.isArray(h.planners))?h.planners:[]; }
function hallPlanners(h, hName){
  const hall=hotelHalls(h).find(function(x){ return hallName(x)===hName; });
  return (hall&&Array.isArray(hall.planners))?hall.planners:[];
}
function findHotel(hotels, nm){ return hotels.find(function(x){ return hotelName(x)===nm; })||null; }
/* 联动填充：酒店 → 厅 → 策划师 */
function populateHotelChain(){
  const mid=getCurrentMasterId();
  const hotels=DB.getHotels(mid);
  const curHotel=$('fHotel').value;
  const curHall=$('fHall').value;
  const curPlanner=$('fPlanner').value;
  // 酒店下拉
  const hOpts=[{v:'',label:'未指定',disabled:false,selected:curHotel===''}];
  hotels.forEach(function(h){
    hOpts.push({v:hotelName(h), label:hotelName(h), disabled:false, selected:hotelName(h)===curHotel});
  });
  if(curHotel && !hotels.some(function(h){ return hotelName(h)===curHotel; })){
    hOpts.push({v:curHotel, label:curHotel, disabled:false, selected:true});
  }
  setSelectOptions($('fHotel'), hOpts);
  // 厅下拉
  const h=findHotel(hotels, curHotel);
  const halls=hotelHalls(h);
  const hallOpts=[{v:'',label:curHotel?'选择厅':'（先选择酒店）',disabled:false,selected:curHall===''}];
  halls.forEach(function(x){
    hallOpts.push({v:hallName(x), label:hallName(x), disabled:false, selected:hallName(x)===curHall});
  });
  if(curHall && !halls.some(function(x){ return hallName(x)===curHall; })){
    hallOpts.push({v:curHall, label:curHall, disabled:false, selected:true});
  }
  setSelectOptions($('fHall'), hallOpts);
  // 策划师下拉：一个酒店共用一批策划师（酒店级为主，兼容旧数据的厅级策划师）
  const allPlanners=[];
  hotelPlanners(h).forEach(function(p){ if(allPlanners.indexOf(p)<0) allPlanners.push(p); });
  hotelHalls(h).forEach(function(x){
    hallPlanners(h, hallName(x)).forEach(function(p){ if(allPlanners.indexOf(p)<0) allPlanners.push(p); });
  });
  const pOpts=[{v:'',label:curHotel?'未指定':'（先选择酒店）',disabled:false,selected:curPlanner===''}];
  allPlanners.forEach(function(p){ pOpts.push({v:p, label:p, disabled:false, selected:p===curPlanner}); });
  if(curPlanner && allPlanners.indexOf(curPlanner)<0){
    pOpts.push({v:curPlanner, label:curPlanner, disabled:false, selected:true});
  }
  setSelectOptions($('fPlanner'), pOpts);
}

      shootDate:shoot, orderDate:$('fOrderDate').value, arrivalTime:$('fArrival').value,

      '<div class="plaza-foot"><span class="cmt">💬 '+cnt+' 条评论</span></div>'+
      '</div>';

  cont.innerHTML=html;

function roleName(r){ return r==='master'?'主账号':(r==='admin'?'管理员':'子账号'); }
function canDeletePlaza(item){
  if(!currentUser) return false;
  if(isMasterLike()) return true;
  return item.authorId===currentUser.id;
}
function openTopic(id){
  activeTopicId=id;
  hide('plazaListView'); show('plazaDetailView');
  renderTopicDetail(id);
}
function renderTopicDetail(id){
  const t=DB.getPlazaTopics().find(function(x){return x.id===id;});
  const detail=$('plazaDetailCard');
  if(!t){
    activeTopicId=null;

    '<div class="pd-content">'+esc(t.content)+'</div>'+

    (canDeletePlaza(t)?'<button class="plaza-del" id="pdDel">删除主题</button>':'')+
    '</div>';
  detail.innerHTML=html;
  if($('pdDel')) $('pdDel').onclick=function(){ deleteTopic(t.id); };
  // 评论列表
  const comments=DB.getPlazaComments().filter(function(c){return c.topicId===id;}).sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); });
  const cl=$('commentList');
  if(!comments.length){
    cl.innerHTML='<div class="empty-hint" style="padding:24px">还没有评论，来抢沙发～</div>';
  }else{
    let ch='';
    comments.forEach(function(c){
      ch+='<div class="comment-item">'+
        '<div class="plaza-avatar" style="width:26px;height:26px;font-size:12px">'+esc((c.authorName||c.authorUsername||'匿').charAt(0))+'</div>'+

        (canDeletePlaza(c)?'<button class="cmt-del" data-cid="'+esc(c.id)+'">删除</button>':'')+
        '</div>'+
        '<div class="cmt-text">'+esc(c.content)+'</div>'+
        '</div></div>';
    });
    cl.innerHTML=ch;
    cl.querySelectorAll('.cmt-del').forEach(function(b){

    });

async function submitTopic(){
  const title=$('topicTitle').value.trim();
  const content=$('topicContent').value.trim();
  if(!title){ toast('请填写标题','error'); return; }
  if(!content){ toast('请填写内容','error'); return; }
  const t={
    id:uid('pt'), title:title, content:content,
    authorId:currentUser.id, authorUsername:currentUser.username,
    authorName:currentUser.nickname||currentUser.username,
    authorRole:currentUser.role,
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  const list=DB.getPlazaTopics();
  list.push(t);
  DB.setPlazaTopics(list);
  markDirty('plaza_topics');
  await flushPush();
  $('topicTitle').value=''; $('topicContent').value='';
  closeModal('newTopicModal');
  activeTopicId=t.id;
  hide('plazaListView'); show('plazaDetailView');
  renderTopicDetail(t.id);
  toast('主题已发布','ok');
}
async function submitComment(){
  const content=$('commentInput').value.trim();
  if(!content){ toast('请输入评论内容','error'); return; }
  if(!activeTopicId) return;
  const c={
    id:uid('pc'), topicId:activeTopicId, content:content,
    authorId:currentUser.id, authorUsername:currentUser.username,
    authorName:currentUser.nickname||currentUser.username,
    authorRole:currentUser.role,
    createdAt:new Date().toISOString()
  };
  const list=DB.getPlazaComments();
  list.push(c);
  DB.setPlazaComments(list);
  markDirty('plaza_comments');
  await flushPush();
  $('commentInput').value='';
  renderTopicDetail(activeTopicId);
  toast('评论已发布','ok');
}
async function deleteTopic(id){
  const t=DB.getPlazaTopics().find(function(x){return x.id===id;});
  if(!t||!canDeletePlaza(t)) return;
  const ok=await confirmBox('删除主题','确定删除主题「'+t.title+'」及其全部评论吗？');
  if(!ok) return;
  DB.setPlazaTopics(DB.getPlazaTopics().filter(function(x){return x.id!==id;}));
  DB.setPlazaComments(DB.getPlazaComments().filter(function(c){return c.topicId!==id;}));
  addLog('删除广场主题', t.title);
  markDirty('plaza_topics'); markDirty('plaza_comments');
  cloudRemoveByField('plaza_topics','id',id);
  cloudRemoveByField('plaza_comments','topicId',id);
  flushPush();
  if(activeTopicId===id){ activeTopicId=null; show('plazaListView'); hide('plazaDetailView'); }
  renderPlaza();
  toast('已删除','ok');
}
async function deleteComment(cid){
  const c=DB.getPlazaComments().find(function(x){return x.id===cid;});
  if(!c||!canDeletePlaza(c)) return;
  const ok=await confirmBox('删除评论','确定删除这条评论吗？');
  if(!ok) return;
  DB.setPlazaComments(DB.getPlazaComments().filter(function(x){return x.id!==cid;}));
  markDirty('plaza_comments');
  cloudRemoveByField('plaza_comments','id',cid);
  flushPush();
  renderTopicDetail(activeTopicId);
  toast('已删除','ok');
}

function initDragSort(listId, onOrderChange){
  const list=$(listId); if(!list) return;
  let dragEl=null;
  list.querySelectorAll('[draggable="true"]').forEach(function(el){
    el.addEventListener('dragstart', function(e){ dragEl=el; e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover', function(e){ e.preventDefault(); });
    el.addEventListener('drop', function(e){
      e.preventDefault();
      if(!dragEl||dragEl===el) return;
      const items=Array.from(list.children);
      const from=items.indexOf(dragEl), to=items.indexOf(el);
      if(from<0||to<0) return;
      if(from<to) el.after(dragEl); else el.before(dragEl);
      onOrderChange();
    });
  });
  // 移动端拖拽排序：长按进入移动模式（简化：长按 600ms 后冒泡提示改用桌面端）
}

/* ============ Excel / ICS ============ */
function cell(row, idx){ return (row[idx]===undefined?'':row[idx]); }
function excelDateToStr(v){
  if(typeof v==='number'&&v>20000&&v<60000){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return fmtDate(d);
  }
  const s=String(v||'');
  if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) return s.replace(/\//g,'-').slice(0,10);
  return s;
}
function exportExcel(scope){
  if(typeof XLSX==='undefined'){ toast('Excel 组件未加载','error'); return; }
  const headers=['客户','酒店','厅名','策划师','摄影师','副机位','下单日期','拍摄日期','到场时间','总额','定金','尾款','接送','双机','无晨袍','已指定','备注','交付状态'];
  let list=DB.getSchedules().slice();
  if(scope==='month'){
    const y=calYear, m=calMonth;
    list=list.filter(function(s){ return s.shootDate && s.shootDate.indexOf(y+'-'+pad(m+1))===0; });
  }
  list.sort(function(a,b){ return (a.shootDate||'').localeCompare(b.shootDate||''); });
  const rows=[headers];
  list.forEach(function(s){
    rows.push([
      s.clientName||'', s.hotel||'', s.hall||'', s.planner||'', s.photographer||'', s.secondPhotographer||'',
      s.orderDate||'', s.shootDate||'', s.arrivalTime||'', s.totalAmount||0, s.deposit||0,
      ((s.totalAmount||0)-(s.deposit||0)).toFixed(2),
      s.pickup?'是':'', s.dualCamera?'是':'', s.noMorningGown?'是':'', s.personConfirmed?'是':'',
      s.note||s.remarks||'', s.delivered?'已交付':'待拍摄'
    ]);
  });
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, '档期');
    XLSX.writeFile(wb, '毛豆档期-'+(scope==='month'?(calYear+'-'+pad(calMonth+1)):'全部')+'.xlsx');
    addLog('导出Excel('+(scope==='month'?'当月':'全部')+')', list.length+' 条');
    toast('已导出 '+list.length+' 条','ok');
  }catch(e){ toast('导出失败: '+e.message,'error'); }
}
function importExcel(file){
  if(typeof XLSX==='undefined'){ toast('Excel 组件未加载','error'); return; }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if(rows.length<2){ toast('表格无数据','error'); return; }
      const head=rows[0].map(function(h){ return String(h).trim(); });
      const idx={};
      ['客户','酒店','厅名','策划师','摄影师','副机位','下单日期','拍摄日期','到场时间','总额','定金','备注'].forEach(function(k){ idx[k]=head.indexOf(k); });
      if(idx['客户']<0||idx['拍摄日期']<0){ toast('表头不完整，请使用模板格式','error'); return; }
      const mid=getCurrentMasterId();
      const now=new Date().toISOString();
      const scheds=DB.getSchedules();
      let added=0;
      rows.slice(1).forEach(function(r){
        const client=String(cell(r, idx['客户'])).trim();
        if(!client) return;
        scheds.push({
          id:uid('s'), clientName:client, hotel:String(cell(r,idx['酒店'])).trim(),
          hall:String(cell(r,idx['厅名'])).trim(), planner:String(cell(r,idx['策划师'])).trim(),
          photographer:String(cell(r,idx['摄影师'])).trim()||'', secondPhotographer:String(cell(r,idx['副机位'])).trim(),
          orderDate:excelDateToStr(cell(r,idx['下单日期'])), shootDate:excelDateToStr(cell(r,idx['拍摄日期'])),
          arrivalTime:String(cell(r,idx['到场时间'])).trim(), totalAmount:num(cell(r,idx['总额'])),
          deposit:num(cell(r,idx['定金'])), note:String(cell(r,idx['备注'])).trim(),
          ownerId:mid, createdBy:currentUser.username, createdAt:now, updatedAt:now,
          delivered:false, deliveredAt:null, personConfirmed:false, noMorningGown:false, pickup:false, dualCamera:false
        });
        added++;
      });
      DB.setSchedules(scheds);
      addLog('导入Excel', added+' 条');
      markDirty('schedules'); flushPush(); renderAll();
      toast('成功导入 '+added+' 条档期','ok');
    }catch(err){ toast('导入失败: '+err.message,'error'); }
  };
  reader.readAsArrayBuffer(file);
}
function exportICS(){
  const list=DB.getSchedules().filter(function(s){ return s.shootDate && !s.delivered; })
    .sort(function(a,b){ return (a.shootDate||'').localeCompare(b.shootDate||''); });
  if(!list.length){ toast('暂无待拍摄档期','error'); return; }
  function icsDate(d){ return String(d).replace(/-/g,''); }
  function icsTime(t){ return t?String(t).replace(':',''):'0900'; }
  function icsEsc(s){ return String(s||'').replace(/[,;\\\n]/g, function(c){ return '\\'+c; }); }
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//毛豆档期//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(function(s){
    lines=lines.concat([
      'BEGIN:VEVENT',
      'UID:'+s.id+'@maodou',
      'DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+icsDate(s.shootDate),
      'SUMMARY:'+icsEsc(s.clientName+(s.hotel?' '+s.hotel:'')+(s.hall?' '+s.hall:'')),
      'DESCRIPTION:'+icsEsc((s.arrivalTime?'到场 '+s.arrivalTime+' ':'')+(s.note||'')),
      'END:VEVENT'
    ]);
  });
  lines.push('END:VCALENDAR');
  download('毛豆档期-拍摄日程.ics', lines.join('\r\n'), 'text/calendar;charset=utf-8');
  addLog('导出ICS', list.length+' 条');
  toast('已导出 ICS','ok');
}

async function handleLogin(){
  const username=val('loginUsername').trim();
  const password=val('loginPassword');
  if(!username||!password){ toast('请输入用户名和密码','error'); return; }
  const btn=$('loginBtn');
  btn.disabled=true; btn.textContent='登录中…';
  try{
    // 登录前强制拉取云端最新（保证同一账号每次登录都读到最新数据）
    if(cloudOK && navigator.onLine){ await pullAllToLocal(true); }
    let users=DB.getUsers();
    let user=users.find(function(u){ return u.username===username; });
    const isFirst=users.length===0;
    if(!user){
      if(isFirst){
        user={id:uid('u'), username:username, password:password, nickname:username, role:'master', phone:'', createdAt:new Date().toISOString(), visitCount:1, ownerId:null};
        users.push(user);
        DB.setUsers(users);

        await flushPush();
        toast('已自动注册为主账号','ok');
      }else{
        toast('用户名或密码错误','error');
        return;
      }
    }else{
      if(user.password!==password){ toast('用户名或密码错误','error'); return; }
      user.visitCount=(user.visitCount||0)+1;
      user.loginMethod='password';
      DB.setUsers(users);
      markDirty('users');
    }
    await loginComplete(user);
  }catch(e){
    console.warn(e);
    toast('登录异常：'+e.message,'error');
  }finally{
    btn.disabled=false; btn.textContent='登 录';
  }
}
/* 微信登录：首次自动注册为主账号并记录微信信息，后台 users 集合持久化 */
async function handleWechatLogin(){
  const nickname=$('wxNickname').value.trim();
  const phone=$('wxPhone').value.trim();
  if(!phone){ toast('请输入微信手机号','error'); return; }
  if(!/^1\d{10}$/.test(phone)){ toast('手机号格式不正确','error'); return; }
  const btn=$('wxLoginGoBtn');
  btn.disabled=true; btn.textContent='登录中…';
  try{
    if(cloudOK && navigator.onLine){ await pullAllToLocal(true); }
    const users=DB.getUsers();
    let user=users.find(function(u){ return u.wechat && u.wechat.phone===phone; });
    if(!user){
      let uname='wx'+phone.slice(-6);
      let i=2;
      while(users.some(function(u){ return u.username===uname; })){ uname='wx'+phone.slice(-6)+'_'+(i++); }
      user={
        id:uid('u'), username:uname,
        password:'wx_'+phone.slice(-6)+'_'+Math.random().toString(36).slice(2,6), // 随机密码，微信方式登录
        nickname:nickname||('微信用户'+phone.slice(-4)), phone:phone,
        role:'master', ownerId:null,
        wechat:{nickname:nickname||'', phone:phone},
        loginMethod:'wechat',
        createdAt:new Date().toISOString(), visitCount:1
      };
      users.push(user);
      DB.setUsers(users);
      markDirty('users');
      await flushPush();
      toast('微信登录成功，已自动注册主账号','ok');
    }else{
      if(nickname && user.wechat && !user.wechat.nickname) user.wechat.nickname=nickname;
      user.visitCount=(user.visitCount||0)+1;
      user.loginMethod='wechat';
      DB.setUsers(users);
      markDirty('users');
      toast('微信登录成功','ok');
    }
    await loginComplete(user);
  }catch(e){
    console.warn(e);
    toast('微信登录异常：'+e.message,'error');
  }finally{
    btn.disabled=false; btn.textContent='确认微信登录';
  }
}
/* 登录后公共流程：写会话 → 云端补拉补推 → 进入主界面 */
async function loginComplete(user){
  if($('wxNickname')){ $('wxNickname').value=''; $('wxPhone').value=''; hide('wxLoginForm'); }
  currentUser=user;
  DB.setSession({
    id:uid('sess'),
    currentUser:{id:user.id, username:user.username, nickname:user.nickname, role:user.role},
    token:'tk_'+Math.random().toString(36).slice(2,14),
    loginTime:new Date().toISOString()
  });
  // 记录多端登录会话
  const sessions=DB.getSessions();
  sessions.push({
    id:uid('sess2'), username:user.username, nickname:user.nickname||user.username,
    role:user.role, deviceId:DB.getDeviceId(), loginTime:new Date().toISOString()
  });
  DB.setSessions(sessions);
  markDirty('sessions');
  // 登录后再拉取一次并补推（云端为真相源）
  if(cloudOK && navigator.onLine){
    await pullAllToLocal(true);
    await pushAllCollections();
    // 重新解析当前用户（云端可能更新了用户数据）
    currentUser=DB.getUsers().find(function(u2){ return u2.id===user.id; })||user;
  }
  ensureSettingsShape();
  // 初始化日历到当前月
  const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
  selectedDate=null;
  activeTab='schedule'; activeTopicId=null;
  hide('authPage'); show('mainApp');
  switchTab('schedule');
  renderAll();
  refreshPhotographerFilter();
  toast('欢迎，'+(currentUser.nickname||currentUser.username));
}

    el.classList.toggle('active', el.dataset.tab===tab);
  });
  ['schedule','plaza','me'].forEach(function(t){
    $('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  if(tab==='schedule'){ renderCalendar(); renderScheduleList(); }
  if(tab==='plaza'){ renderPlaza(); }
  if(tab==='me'){ renderMe(); }
}

/* ============ 事件绑定与启动 ============ */
function bindEvents(){
  // 登录角色切换
  $('authRoleToggle').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      $('authRoleToggle').querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      $('authHint').textContent = b.dataset.role==='master'
        ? '主账号首次登录自动注册；子账号由主账号在「我的-账号管理」中添加'
        : '子账号使用用户名+密码登录，仅可查看档期，可在留言广场发言';
    };
  });
  $('loginBtn').onclick=handleLogin;
  $('loginPassword').addEventListener('keydown', function(e){ if(e.key==='Enter') handleLogin(); });
  $('loginUsername').addEventListener('keydown', function(e){ if(e.key==='Enter') handleLogin(); });
  $('wxLoginBtn').onclick=function(){
    const form=$('wxLoginForm');
    const hidden=form.classList.contains('hidden');
    if(hidden) show('wxLoginForm'); else hide('wxLoginForm');
  };
  $('wxLoginGoBtn').onclick=handleWechatLogin;
  $('wxPhone').addEventListener('keydown', function(e){ if(e.key==='Enter') handleWechatLogin(); });

  // Tabbar
  document.querySelectorAll('.tab-item').forEach(function(el){
    el.onclick=function(){ switchTab(el.dataset.tab); };
  });

  // 视图切换
  $('viewCalBtn').onclick=function(){
    viewMode='calendar';
    $('viewCalBtn').classList.add('active'); $('viewListBtn').classList.remove('active');
    show('calendarView'); show('filterBar');
  };
  $('viewListBtn').onclick=function(){
    viewMode='list';
    $('viewListBtn').classList.add('active'); $('viewCalBtn').classList.remove('active');
    hide('calendarView'); hide('filterBar');
  };

  // 筛选
  $('filterPhotographer').onchange=function(){ renderScheduleList(); };
  $('filterKeyword').addEventListener('input', debounce(function(){ renderScheduleList(); }, 250));

  // 头部的立即同步
  $('headerSyncBtn').onclick=function(){
    toast('正在同步…');
    (async function(){
      await pullAllToLocal(true);
      await pushAllCollections();
      renderAll(); refreshPhotographerFilter();
      setSyncState('on');
      toast('已同步到最新','ok');
    })();
  };

  // 广场
  $('newTopicBtn').onclick=function(){ modalOpen=true; show('newTopicModal'); $('topicTitle').focus(); };
  $('topicSubmitBtn').onclick=submitTopic;
  $('subAccountSaveBtn').onclick=saveSubAccount;
  $('commentSendBtn').onclick=submitComment;
  $('commentInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submitComment(); });
  $('plazaBackBtn').onclick=function(){
    activeTopicId=null;
    show('plazaListView'); hide('plazaDetailView');
    renderPlaza();
  };

  // 档期表单
  $('fTotal').addEventListener('input', updateBalance);
  $('fDeposit').addEventListener('input', updateBalance);
  $('fShootDate').addEventListener('change', function(){ populateMainSelect(); populateSecondSelect(); });
  $('fPhotographer').addEventListener('change', function(){ populateSecondSelect(); });
  $('fSecond').addEventListener('change', function(){ populateMainSelect(); });
  $('fHotel').addEventListener('change', function(){ $('fHall').value=''; $('fPlanner').value=''; populateHotelChain(); });
  $('fHall').addEventListener('change', function(){ populateHotelChain(); });
  $('fabAddBtn').onclick=function(){ if(isMasterLike()) openScheduleModal(null); else toast('子账号仅可查看档期','error'); };
  $('upcomingBtn').onclick=openUpcomingModal;
  $('scheduleSaveBtn').onclick=saveSchedule;

  // 弹窗关闭
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.onclick=function(){ closeModal(b.dataset.close); };
  });
  document.querySelectorAll('.modal-mask').forEach(function(mask){
    mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(mask.id); });
  });

  // 跨标签页同步
  window.addEventListener('storage', function(e){
    if(e.key && e.key.indexOf('ps_')===0 && e.key!=='ps_session'){
      if(!modalOpen){ renderAll(); if(activeTab==='schedule') refreshPhotographerFilter(); }
    }
  });
  // 切回前台拉取
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && cloudOK && navigator.onLine){
      (async function(){ await pullAllToLocal(false); if(!modalOpen) renderAll(); })();
    }
  });
  // 恢复在线
  window.addEventListener('online', function(){
    if(cloudOK){
      (async function(){
        await pullAllToLocal(true);
        await pushAllCollections();
        renderAll();
        setSyncState('on');
        toast('网络已恢复，数据已同步','ok');
      })();
    }
  });
  window.addEventListener('offline', function(){ setSyncState('off'); toast('当前离线，修改将在联网后自动同步','error'); });
  // 系统主题变化（跟随系统）
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ loadTheme(); });
  }
}

async function boot(){
  bindEvents();
  setSyncState('busy');
  const hasCloud=await initCloud();
  if(!hasCloud) setSyncState('off');
  ensureSettingsShape();
  // 已登录会话恢复（兼容旧版 ps_session 的 {username} 格式）
  const session=DB.getSession();
  let resumeUser=null;
  if(session && session.currentUser){
    resumeUser=DB.getUsers().find(function(x){ return x.id===session.currentUser.id; });
  }else if(session && session.username){
    resumeUser=DB.getUsers().find(function(x){ return x.username===session.username; });
  }
  if(resumeUser){
    currentUser=resumeUser;
    const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
    selectedDate=null;
    hide('authPage'); show('mainApp');
    switchTab('schedule');
    renderAll();
    refreshPhotographerFilter();
    if(hasCloud){ startHeartbeat(); startReminderLoop(); }
    return;
  }
  show('authPage');
  if(hasCloud){ startHeartbeat(); startReminderLoop(); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
